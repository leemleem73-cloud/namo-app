<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAMO Talk 초안</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #07111f;
      color: #e5edf7;
      min-height: 100vh;
    }
    button, input, textarea { font: inherit; }

    .app-header {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 24px;
      background: #0d1d32;
      border-bottom: 1px solid #22354d;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { font-size: 24px; font-weight: 800; }
    .header-spacer { flex: 1; }
    .header-user { color: #a9b8ca; font-size: 14px; }
    .talk-open-btn {
      border: 1px solid #27b6e8;
      background: #0a6f97;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .app-menu {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 24px;
      background: #102c4b;
      border-bottom: 1px solid #24415f;
      color: #c9d7e7;
      font-size: 14px;
    }
    .content {
      padding: 28px;
    }
    .dashboard-card {
      height: 250px;
      border: 1px solid #1e334d;
      border-radius: 14px;
      background: #0e2036;
      margin-bottom: 18px;
    }
    .dashboard-card.small { height: 160px; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      visibility: hidden;
      transition: 0.2s ease;
      z-index: 40;
    }
    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .talk-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(760px, 94vw);
      height: 100vh;
      background: #f5f7fa;
      color: #16202c;
      box-shadow: -18px 0 45px rgba(0,0,0,0.35);
      transform: translateX(100%);
      transition: transform 0.24s ease;
      z-index: 50;
      display: grid;
      grid-template-rows: 64px 1fr;
    }
    .talk-panel.open { transform: translateX(0); }

    .talk-topbar {
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #0d2c49;
      color: #fff;
      border-bottom: 1px solid #244661;
    }
    .talk-title { font-size: 18px; font-weight: 800; }
    .talk-subtitle { margin-left: 10px; color: #9fc4dd; font-size: 12px; }
    .talk-topbar-spacer { flex: 1; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 20px;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }

    .talk-body {
      min-height: 0;
      display: grid;
      grid-template-columns: 270px 1fr;
    }
    .room-list {
      min-width: 0;
      background: #ffffff;
      border-right: 1px solid #dce3ea;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #edf1f5;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1477a9;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .profile-name { font-weight: 800; }
    .profile-meta { font-size: 12px; color: #738294; margin-top: 3px; }
    .search-wrap { padding: 12px; border-bottom: 1px solid #edf1f5; }
    .search-wrap input {
      width: 100%;
      border: 1px solid #d7e0e8;
      background: #f7f9fb;
      border-radius: 8px;
      padding: 10px 11px;
      outline: none;
    }
    .room-scroll { overflow-y: auto; }
    .section-label {
      padding: 14px 14px 8px;
      color: #8290a0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .room-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px 13px;
      text-align: left;
      cursor: pointer;
    }
    .room-item:hover { background: #f3f7fa; }
    .room-item.active { background: #e7f4fb; }
    .room-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #dbeef8;
      color: #0c6a99;
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .room-name { font-size: 14px; font-weight: 800; }
    .room-preview {
      margin-top: 4px;
      color: #8290a0;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #eb4d4b;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .chat-view {
      min-width: 0;
      display: grid;
      grid-template-rows: 66px 1fr auto;
      background: #eaf1f6;
    }
    .chat-header {
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #fff;
      border-bottom: 1px solid #dce3ea;
    }
    .chat-room-name { font-weight: 800; }
    .chat-room-meta { margin-top: 3px; color: #7d8b9b; font-size: 12px; }
    .chat-header-spacer { flex: 1; }
    .small-action {
      border: 1px solid #d5dde5;
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .messages {
      overflow-y: auto;
      padding: 20px;
    }
    .message-row { display: flex; margin-bottom: 16px; }
    .message-row.mine { justify-content: flex-end; }
    .message-block { max-width: 72%; }
    .sender { font-size: 12px; color: #617181; margin-bottom: 5px; }
    .bubble {
      padding: 11px 13px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #d8e0e7;
      line-height: 1.45;
      font-size: 14px;
      box-shadow: 0 3px 10px rgba(24,45,65,0.05);
    }
    .mine .bubble {
      background: #1aa3d8;
      color: #fff;
      border-color: #1aa3d8;
    }
    .message-time { color: #8794a3; font-size: 10px; margin-top: 5px; }
    .mine .message-time { text-align: right; }
    .system-line {
      text-align: center;
      color: #8794a3;
      font-size: 11px;
      margin: 18px 0;
    }

    .composer {
      background: #fff;
      border-top: 1px solid #dce3ea;
      padding: 12px;
    }
    .composer-tools {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tool-btn {
      width: 34px;
      height: 32px;
      border: 1px solid #d9e1e8;
      background: #fff;
      border-radius: 7px;
      cursor: pointer;
    }
    .composer-row { display: flex; gap: 8px; }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 66px;
      max-height: 130px;
      border: 1px solid #d7e0e8;
      border-radius: 9px;
      padding: 11px;
      outline: none;
    }
    .send-btn {
      width: 72px;
      border: 0;
      border-radius: 9px;
      background: #0d83b9;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .talk-panel { width: 100vw; }
      .talk-body { grid-template-columns: 108px 1fr; }
      .profile-box { padding: 12px 8px; justify-content: center; }
      .profile-text, .search-wrap, .room-preview, .section-label { display: none; }
      .room-item { grid-template-columns: 1fr; justify-items: center; padding: 10px 5px; }
      .room-name { font-size: 11px; text-align: center; }
      .badge { position: absolute; transform: translate(18px,-15px); }
      .message-block { max-width: 88%; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">NAMO Chemical QMES</div>
    <div class="header-spacer"></div>
    <div class="header-user">관리자 · 관리부</div>
    <button class="talk-open-btn" id="openTalk">▣ NAMO Talk</button>
  </header>

  <nav class="app-menu">
    <span>대시보드</span><span>생산관리</span><span>품질검사</span><span>현장입력</span><span>재고관리</span><span>LOT 추적</span>
  </nav>

  <main class="content">
    <div class="dashboard-card"></div>
    <div class="dashboard-card small"></div>
  </main>

  <div class="overlay" id="overlay"></div>

  <aside class="talk-panel" id="talkPanel" aria-hidden="true">
    <div class="talk-topbar">
      <div class="talk-title">NAMO Talk</div>
      <div class="talk-subtitle">사내 메신저 초안</div>
      <div class="talk-topbar-spacer"></div>
      <button class="icon-btn" title="설정">⚙</button>
      <button class="icon-btn" id="closeTalk" title="닫기">×</button>
    </div>

    <div class="talk-body">
      <section class="room-list">
        <div class="profile-box">
          <div class="avatar">관</div>
          <div class="profile-text">
            <div class="profile-name">관리자</div>
            <div class="profile-meta">관리부 · 온라인</div>
          </div>
        </div>

        <div class="search-wrap">
          <input id="roomSearch" type="search" placeholder="채팅방 또는 직원 검색" />
        </div>

        <div class="room-scroll" id="roomList">
          <div class="section-label">업무 채널</div>
          <button class="room-item active" data-room="전체공지" data-meta="전 직원 공지 채널">
            <div class="room-icon">공</div>
            <div><div class="room-name">전체공지</div><div class="room-preview">금일 생산회의는 오후 3시입니다.</div></div>
            <span class="badge">2</span>
          </button>
          <button class="room-item" data-room="품질부" data-meta="품질부 부서 채팅방">
            <div class="room-icon">품</div>
            <div><div class="room-name">품질부</div><div class="room-preview">OQC 성적서 확인 부탁드립니다.</div></div>
            <span class="badge">3</span>
          </button>
          <button class="room-item" data-room="생산부" data-meta="생산부 부서 채팅방">
            <div class="room-icon">생</div>
            <div><div class="room-name">생산부</div><div class="room-preview">HM01 배치 작업 시작했습니다.</div></div>
            <span class="badge">1</span>
          </button>
          <button class="room-item" data-room="연구소" data-meta="연구소 부서 채팅방">
            <div class="room-icon">연</div>
            <div><div class="room-name">연구소</div><div class="room-preview">신규 샘플 시험 일정 공유드립니다.</div></div>
          </button>

          <div class="section-label">1:1 대화</div>
          <button class="room-item" data-room="김세희" data-meta="연구소 · 이사">
            <div class="room-icon">김</div>
            <div><div class="room-name">김세희</div><div class="room-preview">자료 확인했습니다.</div></div>
          </button>
          <button class="room-item" data-room="박도훈" data-meta="생산부 · 대리">
            <div class="room-icon">박</div>
            <div><div class="room-name">박도훈</div><div class="room-preview">작업 완료 후 공유드리겠습니다.</div></div>
          </button>
          <button class="room-item" data-room="임흥배" data-meta="품질부 · 부장">
            <div class="room-icon">임</div>
            <div><div class="room-name">임흥배</div><div class="room-preview">고객사 자료 준비 중입니다.</div></div>
          </button>
        </div>
      </section>

      <section class="chat-view">
        <div class="chat-header">
          <div>
            <div class="chat-room-name" id="chatRoomName">전체공지</div>
            <div class="chat-room-meta" id="chatRoomMeta">전 직원 공지 채널</div>
          </div>
          <div class="chat-header-spacer"></div>
          <button class="small-action">참여자</button>
        </div>

        <div class="messages" id="messages">
          <div class="system-line">2026년 7월 28일</div>
          <div class="message-row">
            <div class="message-block">
              <div class="sender">김종혁 · 대표</div>
              <div class="bubble">금일 생산 및 품질 회의는 오후 3시에 진행합니다.</div>
              <div class="message-time">14:10</div>
            </div>
          </div>
          <div class="message-row">
            <div class="message-block">
              <div class="sender">임흥배 · 품질부</div>
              <div class="bubble">현대자동차 제출 자료도 함께 검토 부탁드립니다.</div>
              <div class="message-time">14:18</div>
            </div>
          </div>
          <div class="message-row mine">
            <div class="message-block">
              <div class="bubble">네, 회의 전까지 준비해 두겠습니다.</div>
              <div class="message-time">14:22 · 읽음</div>
            </div>
          </div>
        </div>

        <div class="composer">
          <div class="composer-tools">
            <button class="tool-btn" title="파일 첨부">＋</button>
            <button class="tool-btn" title="사진 첨부">▧</button>
            <button class="tool-btn" title="이모지">☺</button>
          </div>
          <div class="composer-row">
            <textarea id="messageInput" placeholder="메시지를 입력하세요. Enter 전송 / Shift+Enter 줄바꿈"></textarea>
            <button class="send-btn" id="sendMessage">전송</button>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <script>
    const panel = document.getElementById('talkPanel');
    const overlay = document.getElementById('overlay');
    const openTalk = document.getElementById('openTalk');
    const closeTalk = document.getElementById('closeTalk');
    const input = document.getElementById('messageInput');
    const messages = document.getElementById('messages');

    function openPanel() {
      panel.classList.add('open');
      overlay.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
    }
    function closePanel() {
      panel.classList.remove('open');
      overlay.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
    }
    openTalk.addEventListener('click', openPanel);
    closeTalk.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    document.querySelectorAll('.room-item').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.room-item').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        document.getElementById('chatRoomName').textContent = button.dataset.room;
        document.getElementById('chatRoomMeta').textContent = button.dataset.meta;
      });
    });

    document.getElementById('roomSearch').addEventListener('input', (event) => {
      const keyword = event.target.value.trim().toLowerCase();
      document.querySelectorAll('.room-item').forEach((item) => {
        item.style.display = item.textContent.toLowerCase().includes(keyword) ? 'grid' : 'none';
      });
    });

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      const row = document.createElement('div');
      row.className = 'message-row mine';
      const now = new Date();
      const time = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      row.innerHTML = '<div class="message-block"><div class="bubble"></div><div class="message-time"></div></div>';
      row.querySelector('.bubble').textContent = text;
      row.querySelector('.message-time').textContent = time + ' · 전송됨';
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      input.value = '';
    }
    document.getElementById('sendMessage').addEventListener('click', sendMessage);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
