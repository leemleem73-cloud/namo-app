<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>NAMO 근태 로그인</title>
  <style>
    :root{color-scheme:light;--ink:#142e44;--muted:#728497;--line:#d8e2e9;--blue:#0d5eb8;--bg:#f4f7f9;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}body{min-height:100dvh}.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));background:linear-gradient(180deg,#f7f9fb 0%,#eef4f7 100%)}.card{width:min(100%,430px);padding:28px 22px 24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 46px rgba(26,56,80,.10)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px}.brand img{width:58px;height:42px;object-fit:contain}.brand strong{display:block;font-size:22px;font-weight:950;letter-spacing:-.04em}.brand span{display:block;margin-top:3px;color:#8795a3;font-size:9px;font-weight:850;letter-spacing:.06em}.title{margin:0 0 5px;text-align:center;font-size:18px;font-weight:950;letter-spacing:-.035em}.desc{margin:0 0 22px;text-align:center;color:var(--muted);font-size:10px;font-weight:750;line-height:1.55}.field{display:block;margin-top:13px}.field span{display:block;margin-bottom:6px;color:#455c70;font-size:10px;font-weight:900}.field input{width:100%;height:48px;padding:0 12px;border:1px solid #cbd8e1;border-radius:10px;background:#fff;color:#173047;font-size:16px;outline:0}.field input:focus{border-color:#6aa8d2;box-shadow:0 0 0 3px rgba(31,119,180,.08)}.error{display:none;margin-top:12px;padding:10px 11px;border:1px solid #ecd0d5;border-radius:9px;background:#fff7f8;color:#a23443;font-size:9px;font-weight:850;line-height:1.5}.error.show{display:block}.primary,.secondary{width:100%;height:49px;margin-top:18px;border:0;border-radius:10px;font-size:14px;font-weight:950;cursor:pointer}.primary{background:linear-gradient(90deg,#1271df,#18a7cf);color:#fff}.secondary{margin-top:8px;background:#eef3f6;color:#51687a}.primary:disabled{opacity:.65;cursor:wait}.foot{margin-top:16px;text-align:center;color:#8b98a5;font-size:8.5px;font-weight:750;line-height:1.55}.hidden{display:none!important}
  </style>
</head>
<body>
<div class="page"><main class="card">
  <div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-att-login1" alt="NAMO"><div><strong>NAMO 근태</strong><span>QMES 통합계정</span></div></div>
  <section id="loginPanel">
    <h1 class="title">로그인</h1><p class="desc">기존 QMES 계정으로 로그인합니다.</p>
    <form id="loginForm">
      <label class="field"><span>아이디 또는 사번</span><input name="loginId" autocomplete="username" placeholder="이름 · 아이디 · 사번" required></label>
      <label class="field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" placeholder="QMES 비밀번호" required></label>
      <div class="error" id="loginError"></div>
      <button class="primary" id="loginBtn" type="submit">로그인 후 출퇴근 열기</button>
    </form>
    <button class="secondary" type="button" onclick="location.replace('/attendance.html?v=20260904-authbridge1')">근태 화면으로 돌아가기</button>
    <div class="foot">로그인 성공 후 NAMO 근태 화면으로 자동 이동합니다.</div>
  </section>
  <section id="passwordPanel" class="hidden">
    <h1 class="title">초기 비밀번호 변경</h1><p class="desc" id="passwordDesc">안전한 사용을 위해 새 비밀번호를 설정해 주세요.</p>
    <form id="passwordForm">
      <label class="field"><span>현재 비밀번호</span><input name="currentPassword" type="password" autocomplete="current-password" required></label>
      <label class="field"><span>새 비밀번호</span><input name="newPassword" type="password" autocomplete="new-password" minlength="4" required></label>
      <label class="field"><span>새 비밀번호 확인</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="4" required></label>
      <div class="error" id="passwordError"></div>
      <button class="primary" id="passwordBtn" type="submit">비밀번호 변경 후 출퇴근 열기</button>
    </form>
  </section>
</main></div>
<script>
(()=>{'use strict';
const HOME='/attendance.html?v=20260904-authbridge1';let currentUser=null;
const loginPanel=document.getElementById('loginPanel'),passwordPanel=document.getElementById('passwordPanel');
const showError=(id,text)=>{const el=document.getElementById(id);if(!el)return;el.textContent=text||'';el.classList.toggle('show',Boolean(text));};
const setBusy=(id,busy,text)=>{const btn=document.getElementById(id);if(!btn)return;btn.disabled=busy;if(text)btn.textContent=text;};
const normalizeUser=user=>({id:user?.id,uid:user?.uid||'',name:user?.name||'',email:user?.email||'',department:user?.department||user?.dept||'',title:user?.title||user?.position||'',role:user?.role||'user',mustChangePassword:Boolean(user?.mustChangePassword)});
const goHome=()=>location.replace(HOME);
const showPassword=user=>{currentUser=normalizeUser(user);loginPanel.classList.add('hidden');passwordPanel.classList.remove('hidden');document.getElementById('passwordDesc').textContent=`${currentUser.name||'사용자'}님, 안전한 사용을 위해 새 비밀번호를 설정해 주세요.`;};
async function jsonFetch(url,opt){const r=await fetch(url,opt);const text=await r.text();let p=null;try{p=text?JSON.parse(text):null}catch(_){throw new Error(`로그인 서버 응답 오류 (HTTP ${r.status})`)}if(!r.ok||!p?.success)throw new Error(p?.message||`로그인 실패 (HTTP ${r.status})`);return p;}
async function checkSession(){try{const p=await jsonFetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const user=p?.data?.user||p?.data||p?.user||p;if(!user?.name)return;if(user.mustChangePassword)showPassword(user);else goHome();}catch(_){}}
document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();showError('loginError','');const fd=new FormData(event.currentTarget),loginId=String(fd.get('loginId')||'').trim(),password=String(fd.get('password')||'').trim();if(!loginId||!password){showError('loginError','아이디와 비밀번호를 입력해 주세요.');return;}setBusy('loginBtn',true,'로그인 확인 중...');try{const p=await jsonFetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({loginId,password})});const user=p?.data?.user;if(!user)throw new Error('로그인 사용자 정보를 확인할 수 없습니다.');if(user.mustChangePassword){showPassword(user);event.currentTarget.reset();}else goHome();}catch(error){showError('loginError',error.message||'로그인에 실패했습니다.');}finally{setBusy('loginBtn',false,'로그인 후 출퇴근 열기');}});
document.getElementById('passwordForm').addEventListener('submit',async event=>{event.preventDefault();showError('passwordError','');const fd=new FormData(event.currentTarget),currentPassword=String(fd.get('currentPassword')||''),newPassword=String(fd.get('newPassword')||''),confirmPassword=String(fd.get('confirmPassword')||'');if(newPassword.length<4){showError('passwordError','새 비밀번호는 4자 이상 입력해 주세요.');return;}if(newPassword!==confirmPassword){showError('passwordError','새 비밀번호 확인이 일치하지 않습니다.');return;}setBusy('passwordBtn',true,'변경 중...');try{await jsonFetch('/api/auth/password',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword,newPassword})});goHome();}catch(error){showError('passwordError',error.message||'비밀번호 변경에 실패했습니다.');}finally{setBusy('passwordBtn',false,'비밀번호 변경 후 출퇴근 열기');}});
checkSession();
})();
</script>
</body></html>
