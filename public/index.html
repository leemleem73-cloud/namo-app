  <script>
    (function(){
      let allowNativeAccountClick=false;
      let closeTimer=null;
      const getAccountButton=()=>document.querySelector('button[aria-label="계정 설정 열기"]');
      const getAccountDialog=()=>document.querySelector('[role="dialog"][aria-label="계정 설정"]');
      const ensureDropdown=()=>{
        let menu=document.getElementById('qmes-user-dropdown');
        if(menu) return menu;
        menu=document.createElement('div');
        menu.id='qmes-user-dropdown';
        menu.setAttribute('role','menu');
        menu.innerHTML='<button type="button" data-action="password"><span>🔒</span><span>비밀번호 변경</span></button>'+ 
          '<button type="button" data-action="logout" class="qmes-dropdown-logout"><span>↪</span><span>로그아웃</span></button>';
        document.body.appendChild(menu);
        menu.addEventListener('mouseenter',()=>{clearTimeout(closeTimer);menu.classList.add('is-open');});
        menu.addEventListener('mouseleave',scheduleClose);
        menu.addEventListener('click',event=>{
          const actionButton=event.target.closest('button[data-action]');
          if(actionButton) runNativeAccountAction(actionButton.dataset.action);
        });
        return menu;
      };
      const positionMenu=()=>{
        const button=getAccountButton();
        const menu=ensureDropdown();
        if(!button) return;
        const rect=button.getBoundingClientRect();
        const left=Math.max(10,Math.min(window.innerWidth-200,rect.right-190));
        menu.style.left=left+'px';
        menu.style.top=(rect.bottom+7)+'px';
      };
      const openMenu=()=>{clearTimeout(closeTimer);positionMenu();ensureDropdown().classList.add('is-open');};
      const closeMenu=()=>{const menu=document.getElementById('qmes-user-dropdown');if(menu)menu.classList.remove('is-open');};
      function scheduleClose(){clearTimeout(closeTimer);closeTimer=setTimeout(closeMenu,180);}
      const runNativeAccountAction=action=>{
        const accountButton=getAccountButton();
        if(!accountButton) return;
        closeMenu();
        allowNativeAccountClick=true;
        accountButton.click();
        allowNativeAccountClick=false;
        setTimeout(()=>{
          const dialog=getAccountDialog();
          if(!dialog) return;
          const targetText=action==='password'?'비밀번호 변경하기':'로그아웃';
          const target=Array.from(dialog.querySelectorAll('button')).find(button=>button.textContent.trim()===targetText);
          if(target) target.click();
        },0);
      };
      document.addEventListener('click',event=>{
        const accountButton=getAccountButton();
        const menu=document.getElementById('qmes-user-dropdown');
        if(accountButton&&accountButton.contains(event.target)){
          if(allowNativeAccountClick) return;
          event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
          if(menu&&menu.classList.contains('is-open')) closeMenu(); else openMenu();
          return;
        }
        if(menu&&!menu.contains(event.target)) closeMenu();
      },true);
      document.addEventListener('mouseover',event=>{
        const accountButton=getAccountButton();
        if(accountButton&&accountButton.contains(event.target)) openMenu();
      },true);
      document.addEventListener('mouseout',event=>{
        const accountButton=getAccountButton();
        if(accountButton&&accountButton.contains(event.target)&&!accountButton.contains(event.relatedTarget)) scheduleClose();
      },true);
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});
      window.addEventListener('resize',()=>{const menu=document.getElementById('qmes-user-dropdown');if(menu&&menu.classList.contains('is-open'))positionMenu();});
      window.addEventListener('scroll',closeMenu,true);
    })();
  </script>
  <script>
    (function(){
      const menuMap={
        '대시보드':[
          {label:'종합 대시보드',direct:'대시보드'},
          {label:'SPC 대시보드',group:'품질검사',sub:'SPC (Cpk)'}
        ],
        '생산관리':[
          {label:'생산 진행',group:'생산관리',sub:'생산 (배치)'},
          {label:'작업지시서',group:'생산관리',sub:'작업지시서'}
        ],
        '품질검사':[
          {label:'수입검사 (IQC)',group:'품질검사',sub:'수입검사 (IQC)'},
          {label:'공정검사 (PQC)',group:'품질검사',sub:'공정검사 (PQC)'},
          {label:'출하검사 (OQC)',group:'품질검사',sub:'출하검사 (OQC)'},
          {label:'SPC (Cpk)',group:'품질검사',sub:'SPC (Cpk)'},
          {label:'품질 인터락',group:'품질검사',sub:'품질 인터락 (차단)'},
          {label:'출하성적서',group:'품질검사',sub:'출하성적서'}
        ],
        '현장입력':[{label:'현장 입력 (iPad)',direct:'현장입력'}],
        '재고관리':[{label:'원재료 재고',direct:'재고관리'}],
        '거래처 현황':[{label:'거래처 현황',direct:'거래처 현황'}],
        '설비관리':[{label:'설비 모니터링',direct:'설비관리'}],
        'LOT 추적':[{label:'LOT 추적',direct:'LOT 추적'}],
        '부적합관리':[
          {label:'부적합 (8D)',group:'부적합관리',sub:'부적합 (8D)'},
          {label:'고객불만 (GQMS)',group:'부적합관리',sub:'고객불만 (GQMS)'},
          {label:'4M 변경관리',group:'부적합관리',sub:'4M 변경관리'}
        ]
      };
      let closeTimer=null;
      let currentTopButton=null;
      const getTopButtons=()=>Array.from(document.querySelectorAll('.qmes-top-menu-button'));
      const buttonText=button=>button?button.textContent.replace('›','').replace('〉','').trim():'';
      const findTopButton=label=>getTopButtons().find(button=>buttonText(button)===label);
      const ensureMenu=()=>{
        let menu=document.getElementById('qmes-all-menu-dropdown');
        if(menu) return menu;
        menu=document.createElement('div');
        menu.id='qmes-all-menu-dropdown';
        menu.setAttribute('role','menu');
        document.body.appendChild(menu);
        menu.addEventListener('mouseenter',()=>clearTimeout(closeTimer));
        menu.addEventListener('mouseleave',scheduleClose);
        return menu;
      };
      const closeMenu=()=>{
        const menu=document.getElementById('qmes-all-menu-dropdown');
        if(menu) menu.classList.remove('is-open');
        currentTopButton=null;
      };
      function scheduleClose(){clearTimeout(closeTimer);closeTimer=setTimeout(closeMenu,400);}
      const navigate=item=>{
        closeMenu();
        if(item.direct){
          const button=findTopButton(item.direct);
          if(button) button.click();
          return;
        }
        const findSubButton=()=>Array.from(document.querySelectorAll('.qmes-submenu-button'))
          .find(button=>button.textContent.trim()===item.sub);
        const existingSubButton=findSubButton();
        if(existingSubButton){
          existingSubButton.click();
          return;
        }
        const groupButton=findTopButton(item.group);
        if(!groupButton) return;
        groupButton.click();
        requestAnimationFrame(()=>{
          requestAnimationFrame(()=>{
            const subButton=findSubButton();
            if(subButton) subButton.click();
          });
        });
      };
      const openFor=button=>{
        clearTimeout(closeTimer);
        const label=buttonText(button);
        const items=menuMap[label];
        if(!items||!items.length) return;
        currentTopButton=button;
        const menu=ensureMenu();
        menu.innerHTML='';
        const title=document.createElement('div');
        title.className='qmes-hover-title';
        title.textContent=label;
        menu.appendChild(title);
        items.forEach(item=>{
          const row=document.createElement('button');
          row.type='button';
          row.textContent=item.label;
          row.addEventListener('click',()=>navigate(item));
          menu.appendChild(row);
        });
        const rect=button.getBoundingClientRect();
        const width=Math.max(210,Math.min(280,menu.offsetWidth||230));
        const left=Math.max(8,Math.min(window.innerWidth-width-8,rect.left));
        menu.style.left=left+'px';
        menu.style.top=(rect.bottom+4)+'px';
        menu.classList.add('is-open');
      };
      document.addEventListener('mouseover',event=>{
        const button=event.target.closest('.qmes-top-menu-button');
        if(!button) return;
        if(button===currentTopButton) return;
        openFor(button);
      },true);
      document.addEventListener('mouseout',event=>{
        const topBar=event.target.closest('.qmes-top-menu-bar');
        if(topBar&&!topBar.contains(event.relatedTarget)) scheduleClose();
      },true);
      document.addEventListener('click',event=>{
        const menu=document.getElementById('qmes-all-menu-dropdown');
        if(menu&&!menu.contains(event.target)&&!event.target.closest('.qmes-top-menu-button')) closeMenu();
      },true);
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});
      window.addEventListener('scroll',closeMenu,true);
      window.addEventListener('resize',closeMenu);
    })();
  </script>
