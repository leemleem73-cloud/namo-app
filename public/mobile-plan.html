<style>
:root{color-scheme:light;--ink:#173249;--muted:#7b8b99;--line:#dce4eb;--bg:#f5f7f9;--blue:#176da1;--green:#277c49;--orange:#9e6509;--red:#b13b48;--safe-top:env(safe-area-inset-top);--safe-bottom:max(12px,env(safe-area-inset-bottom))}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{width:min(100%,760px);min-height:100dvh;margin:0 auto;padding-bottom:calc(22px + var(--safe-bottom))}.head{position:sticky;top:0;z-index:30;height:calc(66px + var(--safe-top));padding:var(--safe-top) 10px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.99);backdrop-filter:blur(14px)}.back,.refresh{height:38px;border:1px solid #d7e0e7;border-radius:9px;background:#fff;color:#35516a;font-weight:950}.back{width:42px;font-size:18px}.refresh{padding:0 10px;font-size:9px}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:8px}.brand img{width:46px;height:32px}.brand small{display:block;color:#8593a0;font-size:7px;font-weight:850}.brand strong{display:block;margin-top:2px;color:#112d45;font-size:14px;font-weight:950}.hero{padding:16px 12px 13px;background:#fff;border-bottom:1px solid #e8edf1}.hero-row{display:flex;justify-content:space-between;gap:10px}.hero h1{margin:0;font-size:22px;font-weight:950;letter-spacing:-.045em}.hero p{margin:5px 0 0;color:#748496;font-size:9px;font-weight:750;line-height:1.45}.sync{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid #cce2d3;border-radius:999px;background:#f4fbf6;color:#357b50;font-size:7px;font-weight:900}.sync i{width:6px;height:6px;border-radius:50%;background:#43ad68}.sync.loading{border-color:#eadcaf;background:#fffaf0;color:#84691f}.sync.loading i{background:#d29a2e}.sync.error{border-color:#ecd1d5;background:#fff8f9;color:#9c3d49}.sync.error i{background:#c95462}.content{padding:10px}.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.primary,.secondary{height:44px;border-radius:10px;font-size:10px;font-weight:950}.primary{border:0;background:#176da1;color:#fff}.secondary{border:1px solid #d6e0e7;background:#fff;color:#36526a;padding:0 12px}.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.kpi{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.kpi span{display:block;color:#8592a0;font-size:7.7px;font-weight:850}.kpi strong{display:block;margin-top:5px;color:#173249;font-size:20px;font-weight:950}.kpi small{display:block;margin-top:3px;color:#8996a2;font-size:7.2px;font-weight:750}.plan-card{margin-top:9px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.plan-head{display:flex;align-items:flex-start;gap:9px;padding:11px;border-bottom:1px solid #edf1f4}.plan-no{flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#edf5fa;color:#176b9c;display:grid;place-items:center;font-size:9px;font-weight:950}.plan-title{min-width:0;flex:1}.plan-title button{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:#176da1;font-size:12px;font-weight:950;text-decoration:underline;text-underline-offset:3px}.plan-title small{display:block;margin-top:4px;color:#7f8d9a;font-size:8px;font-weight:750}.badge{flex:none;padding:5px 7px;border-radius:7px;background:#eef2f5;color:#536577;font-size:7.3px;font-weight:950}.badge.green{background:#e7f7e9;color:#237a42}.badge.orange{background:#fff2dc;color:#9d6406}.badge.red{background:#fde8eb;color:#a83240}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 11px 8px}.field{min-width:0;padding:8px 4px;border-bottom:1px solid #f0f3f5}.field label{display:block;color:#929daa;font-size:7px;font-weight:850}.field span{display:block;margin-top:4px;color:#344c61;font-size:9px;font-weight:850}.panel{margin-top:9px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.panel h2{margin:0;padding:10px 11px;border-bottom:1px solid #edf1f4;background:#f8fafb;color:#29445c;font-size:10px;font-weight:950}.mrp{overflow:auto}.mrp table{width:100%;border-collapse:collapse;min-width:720px}.mrp th,.mrp td{padding:8px;border-bottom:1px solid #edf2f4;text-align:left;font-size:7.6px;white-space:nowrap}.mrp th{background:#f8fafb;color:#6f8090;font-weight:950}.mrp td{color:#334c61;font-weight:800}.mrp .bad{color:#b13b48;font-weight:950}.empty,.message{margin-top:9px;padding:24px 13px;border:1px dashed #d5dee5;border-radius:11px;background:#fff;text-align:center;color:#81909e;font-size:9px;font-weight:750;line-height:1.55}.message{display:none;padding:10px;text-align:left;border-style:solid}.message.show{display:block}.message.error{border-color:#edcfd4;background:#fff8f9;color:#9e3c49}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(14,34,51,.38)}.modal.show{display:flex}.sheet{width:min(100%,760px);max-height:95dvh;margin:0 auto;background:#f7f9fb;border-radius:18px 18px 0 0;overflow:hidden}.sheet-head{display:flex;align-items:center;gap:10px;padding:15px 14px;background:#fff;border-bottom:1px solid var(--line)}.sheet-head div{min-width:0;flex:1}.sheet-head strong{display:block;font-size:16px;font-weight:950}.sheet-head span{display:block;margin-top:3px;color:#7e8c99;font-size:8px;font-weight:750}.close{width:36px;height:36px;border:1px solid #dce4eb;border-radius:9px;background:#fff;color:#607387;font-size:20px}.form{overflow:auto;max-height:calc(95dvh - 68px);padding:12px 12px calc(18px + var(--safe-bottom))}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ff label{display:block;margin-bottom:5px;color:#53687b;font-size:8px;font-weight:900}.ff input,.ff select{width:100%;height:43px;padding:0 10px;border:1px solid #d4dee6;border-radius:9px;background:#fff;color:#18344a;outline:0;font-size:12px}.ff.full{grid-column:1/-1}.calc{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.calc-head{padding:9px 10px;border-bottom:1px solid #edf1f4;font-size:9px;font-weight:950}.calc-list{padding:7px 10px}.calc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid #f0f3f5}.calc-row:last-child{border-bottom:0}.calc-row b{font-size:8px}.calc-row span{font-size:8px;font-weight:900}.savebar{display:grid;grid-template-columns:1fr 1.35fr 1.8fr;gap:8px;margin-top:12px}.savebar button{height:45px;border-radius:10px;font-size:9px;font-weight:950}.cancel{border:1px solid #d6e0e7;background:#fff;color:#52687b}.calcbtn{border:1px solid #b9d5e5;background:#edf6fb;color:#176da1}.save{border:0;background:#176da1;color:#fff}.detail-body{max-height:calc(95dvh - 68px);overflow:auto;padding:10px 10px calc(18px + var(--safe-bottom))}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.detail-box{padding:9px;border:1px solid #dce4eb;border-radius:9px;background:#fff}.detail-box label{display:block;color:#8d9aa6;font-size:7px;font-weight:850}.detail-box strong{display:block;margin-top:4px;color:#30495f;font-size:9px;font-weight:900}.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}.step{padding:8px 4px;border:1px solid #dce4eb;border-radius:8px;background:#fff;text-align:center}.step b{display:block;font-size:7.5px}.step span{display:block;margin-top:3px;color:#8493a0;font-size:6.5px}.step.done{background:#eef9f1;border-color:#cde8d5}.step.current{background:#edf6fb;border-color:#aad1e6}@media(min-width:700px){.content{padding:14px 20px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.form-grid,.detail-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<body>
<div class="app">
<header class="head"><button class="back" id="backBtn" type="button">‹</button><div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-plan1" alt="NAMO"><div><small>NAMO CHEMICAL · QMES MOBILE</small><strong>생산계획 · MRP</strong></div></div><button class="refresh" id="refreshBtn" type="button">새로고침</button></header>
<section class="hero"><div class="hero-row"><div><h1>생산계획 · MRP</h1><p>PC와 동일한 erp:plan 공용 데이터와 실제 작업지시·IQC·재고 기준</p></div><div class="sync loading" id="sync"><i></i><span>조회 중</span></div></div></section>
<main class="content"><div class="actions"><button class="primary" id="newBtn" type="button">＋ 신규 생산계획</button><button class="secondary" id="shortBtn" type="button">부족자재 보기</button></div><section class="kpis"><article class="kpi"><span>현재 생산계획</span><strong id="planCount">0</strong><small>erp:plan</small></article><article class="kpi"><span>계획량</span><strong id="planQty">0</strong><small>kg</small></article><article class="kpi"><span>부족 자재</span><strong id="shortCount">0</strong><small>현재 재고 기준</small></article><article class="kpi"><span>IQC 대기</span><strong id="iqcCount">0</strong><small>원자재 검사</small></article></section><div id="message" class="message"></div><section id="plans"></section><section class="panel"><h2>현재 계획 MRP</h2><div class="mrp" id="mrpTable"><div class="empty">생산계획을 선택하거나 신규 계획에서 MRP를 계산하세요.</div></div></section></main>
</div>
<div class="modal" id="formModal"><section class="sheet"><header class="sheet-head"><div><strong>신규 생산계획</strong><span>PC 생산계획과 동일한 공용 DB에 저장</span></div><button class="close" id="formClose" type="button">×</button></header><form class="form" id="planForm"><div class="form-grid"><div class="ff"><label>계획일자</label><input id="fDate" type="date" required></div><div class="ff"><label>생산구분</label><select id="fType"><option value="샘플">B-Lab · 샘플</option><option value="개발">C-Pilot · 개발</option><option value="양산">D-양산</option></select></div><div class="ff full"><label>제품</label><input id="fProduct" value="절연슬러리(NBA20-HM01)" readonly></div><div class="ff"><label>생산계획량 (kg)</label><input id="fQty" type="number" min="0.001" step="0.001" inputmode="decimal" required></div><div class="ff"><label>Recipe/BOM Revision</label><input id="fRevision" placeholder="예: Rev.3 / 현재 승인"></div></div><section class="calc"><div class="calc-head">MRP 계산 결과</div><div class="calc-list" id="calcList"><div class="empty" style="margin:0;border:0">생산계획량 입력 후 MRP 계산을 누르세요.</div></div></section><div class="savebar"><button class="cancel" id="cancelBtn" type="button">취소</button><button class="calcbtn" id="calcBtn" type="button">MRP 계산</button><button class="save" id="saveBtn" type="submit">계획 저장</button></div></form></section></div>
<div class="modal" id="detailModal"><section class="sheet"><header class="sheet-head"><div><strong id="detailTitle">생산계획 통합상세</strong><span id="detailSub">-</span></div><button class="close" id="detailClose" type="button">×</button></header><div class="detail-body" id="detailBody"></div></section></div>
<script>
(()=>{'use strict';const VERSION='20260904-plan1',PRODUCT='절연슬러리(NBA20-HM01)',LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};const norm=v=>clean(v).toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');const first=(o,ks,f='')=>{for(const k of ks){const v=o?.[k];if(v!==undefined&&v!==null&&clean(v)!=='')return v}return f};const payload=r=>{let p=r?.payload;if(p&&typeof p==='object')return p;if(typeof p==='string'){try{return JSON.parse(p)}catch(_){}}return{}};const materialRows=o=>{for(const k of ['materials','materialRows','recipeMaterials','rawMaterials','ingredients','inputs'])if(Array.isArray(o?.[k]))return o[k];return[]};let state={plans:[],work:[],iqc:[],inv:[],purchases:[],mrp:[],selected:null,calc:[]};async function api(path,opt){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...(opt||{})});const p=await r.json().catch(()=>null);if(r.status===401){location.replace(LOGIN);throw new Error('AUTH')}if(!r.ok||p?.success===false)throw new Error(p?.message||`HTTP ${r.status}`);return p?.data!==undefined?p.data:p}function flat(records,type){const out=[];(Array.isArray(records)?records:[]).forEach(r=>{const p=payload(r);if(p.deleted)return;if(type==='workorder'){if(p.doc||p.batch){out.push({doc:p.doc||{},batch:p.batch||{},lotRecord:p.lotRecord||{},recordKey:r.record_key||r.recordKey||''})}return}for(const k of ['rows','items','list','inventory','stocks','data'])if(Array.isArray(p[k]))p[k].forEach(x=>out.push(x))});return out}function workProduct(w){return clean(first(w.batch,['item','product','itemName','productName'])||first(w.doc,['item','product','itemName','productName']))}function sameProduct(v){const n=norm(v);return n===norm(PRODUCT)||n.includes('NBA20HM01')||n.includes('절연슬러리')||n==='DBA1501'}function latestRecipe(){const ws=state.work.filter(w=>sameProduct(workProduct(w))&&materialRows(w.doc).length).sort((a,b)=>clean(first(b.batch,['date','prodDate','productionDate'])||first(b.doc,['date','prodDate','productionDate'])).localeCompare(clean(first(a.batch,['date','prodDate','productionDate'])||first(a.doc,['date','prodDate','productionDate']))));const w=ws[0];if(!w)return null;const mats=materialRows(w.doc);const plan=Math.max(0,num(first(w.batch,['plan','planQty','plannedQty','qty'])||first(w.doc,['plan','planQty','plannedQty','qty'])));const rows=mats.map(m=>{const qty=Math.max(0,num(first(m,['qty','amount','weight','planQty','plannedQty'])));const ratio=Math.max(0,num(first(m,['ratio','rate','percent']))||(plan>0?qty/plan*100:0));return{name:clean(first(m,['name','material','materialName','itemName'])),code:clean(first(m,['code','materialCode','itemCode'])),ratio}}).filter(m=>m.name&&m.ratio>0);return rows.length?{rows,revision:clean(first(w.doc,['revision','version','recipeVersion'])||'최근 작업지시 기준')}:null}function invRows(){return state.inv}function stockFor(m){return invRows().filter(x=>norm(first(x,['name','material','itemName','product','materialName']))===norm(m.name)|| (m.code&&norm(first(x,['code','materialCode','itemCode']))===norm(m.code))).reduce((s,x)=>s+Math.max(0,num(first(x,['currentQty','stockQty','remainingQty','availableQty','qty','amount','quantity']))),0)}function incomingFor(m){return state.purchases.filter(x=>{const s=JSON.stringify(x).toUpperCase();return s.includes(norm(m.name))||(m.code&&s.includes(norm(m.code))) }).filter(x=>!/입고완료|마감|취소/.test(clean(first(x,['status','state'])))).reduce((s,x)=>s+Math.max(0,num(first(x,['qty','orderQty','remainingQty','amount']))),0)}function iqcPendingFor(m){return state.iqc.filter(x=>{const s=JSON.stringify(x).toUpperCase();return s.includes(norm(m.name))||(m.code&&s.includes(norm(m.code)))}).filter(x=>/대기|미판정|검사대기/.test(clean(first(x,['status','judge','result'])))).length}function calculate(qty){const r=latestRecipe();if(!r)return[];return r.rows.map(m=>{const need=qty*m.ratio/100,stock=stockFor(m),incoming=incomingFor(m),pending=iqcPendingFor(m),short=Math.max(0,need-stock),after=Math.max(0,need-stock-incoming);return{...m,need,stock,incoming,pending,short,after,status:after>0?'부족':short>0?'입고예정 반영':'충족'}})}function renderMrp(rows){const el=document.getElementById('mrpTable');if(!rows.length){el.innerHTML='<div class="empty">MRP 계산 데이터가 없습니다.</div>';return}el.innerHTML=`<table><thead><tr><th>원료</th><th>비율</th><th>필요량</th><th>가용재고</th><th>입고예정</th><th>현재부족</th><th>입고후부족</th><th>IQC대기</th><th>상태</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small>${esc(r.code||'-')}</small></td><td>${num(r.ratio).toFixed(3)}%</td><td>${num(r.need).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</td><td>${num(r.stock).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</td><td>${num(r.incoming).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</td><td class="${r.short>0?'bad':''}">${num(r.short).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</td><td class="${r.after>0?'bad':''}">${num(r.after).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</td><td>${r.pending}건</td><td class="${r.after>0?'bad':''}">${esc(r.status)}</td></tr>`).join('')}</tbody></table>`}function render(){document.getElementById('planCount').textContent=state.plans.length;document.getElementById('planQty').textContent=state.plans.reduce((s,r)=>s+num(r.qty),0).toLocaleString('ko-KR',{maximumFractionDigits:1});document.getElementById('shortCount').textContent=state.mrp.filter(r=>r.short>0).length;document.getElementById('iqcCount').textContent=state.mrp.reduce((s,r)=>s+r.pending,0);const p=document.getElementById('plans');if(!state.plans.length){p.innerHTML='<div class="empty">저장된 생산계획이 없습니다.</div>'}else p.innerHTML=state.plans.map((r,i)=>`<article class="plan-card"><div class="plan-head"><div class="plan-no">${String(i+1).padStart(2,'0')}</div><div class="plan-title"><button type="button" data-plan="${i}">${esc(r.date||'계획일 미등록')}</button><small>${esc(r.product||PRODUCT)} · ${esc(r.productionType||'-')}</small></div><span class="badge ${state.mrp.some(x=>x.after>0)?'red':'green'}">${state.mrp.some(x=>x.after>0)?'자재확인':'계획'}</span></div><div class="fields"><div class="field"><label>계획일자</label><span>${esc(r.date||'-')}</span></div><div class="field"><label>생산구분</label><span>${esc(r.productionType||'-')}</span></div><div class="field"><label>제품</label><span>${esc(r.product||PRODUCT)}</span></div><div class="field"><label>계획량</label><span>${num(r.qty).toLocaleString('ko-KR',{maximumFractionDigits:3})} kg</span></div><div class="field"><label>Revision</label><span>${esc(r.revision||'-')}</span></div><div class="field"><label>저장일시</label><span>${esc(clean(r.savedAt).replace('T',' ').slice(0,16)||'-')}</span></div></div></article>`).join('');p.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>openDetail(state.plans[Number(b.dataset.plan)]));renderMrp(state.mrp)}function openForm(){const d=new Date(),off=d.getTimezoneOffset(),today=new Date(d.getTime()-off*60000).toISOString().slice(0,10);document.getElementById('planForm').reset();document.getElementById('fDate').value=today;document.getElementById('fProduct').value=PRODUCT;const rec=latestRecipe();document.getElementById('fRevision').value=rec?.revision||'';state.calc=[];renderCalc();document.getElementById('formModal').classList.add('show')}function renderCalc(){const el=document.getElementById('calcList');if(!state.calc.length){el.innerHTML='<div class="empty" style="margin:0;border:0">생산계획량 입력 후 MRP 계산을 누르세요.</div>';return}el.innerHTML=state.calc.map(r=>`<div class="calc-row"><b>${esc(r.name)} · 필요 ${num(r.need).toFixed(3)}kg</b><span style="color:${r.after>0?'#b13b48':'#277c49'}">${esc(r.status)}</span></div>`).join('')}function doCalc(){const qty=num(document.getElementById('fQty').value);if(qty<=0){alert('생산계획량을 입력하세요.');return}state.calc=calculate(qty);if(!state.calc.length)alert('실제 작업지시의 원료 계획을 찾지 못했습니다. Recipe/BOM 또는 최근 작업지시 원료정보를 확인하세요.');renderCalc()}async function savePlan(e){e.preventDefault();const qty=num(document.getElementById('fQty').value);if(qty<=0){alert('생산계획량을 입력하세요.');return}if(!state.calc.length)doCalc();if(!state.calc.length)return;const type=document.getElementById('fType').value;const row={date:document.getElementById('fDate').value,product:PRODUCT,qty,revision:clean(document.getElementById('fRevision').value)||latestRecipe()?.revision||'-',productionType:type,source:'MOBILE_LIVE_PRODUCTION_MRP_V1',savedAt:new Date().toISOString()};await api('/api/qmes-sync/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'erp:plan',payload:{module:'erp',schema:4,kind:'plan',stage:type,rows:[row],updatedAt:new Date().toISOString()}})});state.plans=[row];state.mrp=[...state.calc];document.getElementById('formModal').classList.remove('show');render();document.getElementById('sync').className='sync';document.getElementById('sync').querySelector('span').textContent='공용 DB 저장 완료'}function openDetail(row){const qty=num(row.qty),mrp=calculate(qty),work=state.work.filter(w=>sameProduct(workProduct(w))),active=work.filter(w=>!/완료|종료|취소/.test(clean(first(w.batch,['status','state','progress'])||first(w.doc,['status','state','progress']))));document.getElementById('detailTitle').textContent='생산계획 통합상세';document.getElementById('detailSub').textContent=`${row.date||'-'} · ${row.productionType||'-'} · ${qty.toLocaleString('ko-KR')} kg`;document.getElementById('detailBody').innerHTML=`<div class="detail-grid"><div class="detail-box"><label>계획일자</label><strong>${esc(row.date||'-')}</strong></div><div class="detail-box"><label>생산구분</label><strong>${esc(row.productionType||'-')}</strong></div><div class="detail-box"><label>제품</label><strong>${esc(row.product||PRODUCT)}</strong></div><div class="detail-box"><label>계획량</label><strong>${qty.toLocaleString('ko-KR')} kg</strong></div><div class="detail-box"><label>Recipe/BOM</label><strong>${esc(row.revision||'-')}</strong></div><div class="detail-box"><label>활성 작업지시</label><strong>${active.length}건</strong></div><div class="detail-box"><label>부족자재</label><strong>${mrp.filter(x=>x.after>0).length}건</strong></div><div class="detail-box"><label>IQC 대기</label><strong>${mrp.reduce((s,x)=>s+x.pending,0)}건</strong></div></div><div class="flow"><div class="step done"><b>수주확정</b><span>연동</span></div><div class="step done"><b>생산계획</b><span>${esc(row.productionType||'-')}</span></div><div class="step ${active.length?'current':''}"><b>작업지시</b><span>${active.length}건</span></div><div class="step ${mrp.some(x=>x.after>0)?'current':'done'}"><b>자재확보</b><span>${mrp.filter(x=>x.after>0).length} 부족</span></div></div><section class="panel"><h2>MRP 자재 상세</h2><div class="mrp">${mrp.length?`<table><thead><tr><th>원료</th><th>필요량</th><th>재고</th><th>입고예정</th><th>입고후 부족</th><th>상태</th></tr></thead><tbody>${mrp.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.need.toFixed(3)}kg</td><td>${x.stock.toFixed(3)}kg</td><td>${x.incoming.toFixed(3)}kg</td><td class="${x.after>0?'bad':''}">${x.after.toFixed(3)}kg</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">MRP 정보 없음</div>'}</div></section>`;document.getElementById('detailModal').classList.add('show');state.selected=row;state.mrp=mrp;render()}async function load(){const sync=document.getElementById('sync');sync.className='sync loading';sync.querySelector('span').textContent='조회 중';try{const [invRec,workRec,iqcRec,purchases]=await Promise.all([api('/api/qmes-sync/inventory'),api('/api/qmes-sync/workorder'),api('/api/qmes-sync/iqc'),api('/api/purchase-orders').catch(()=>[])]);const planRec=(Array.isArray(invRec)?invRec:[]).find(r=>clean(r.record_key||r.recordKey)==='erp:plan');state.plans=Array.isArray(payload(planRec).rows)?payload(planRec).rows:[];state.work=flat(workRec,'workorder');state.iqc=flat(iqcRec,'iqc');state.inv=flat(invRec,'inventory');state.purchases=Array.isArray(purchases)?purchases:[];state.mrp=state.plans[0]?calculate(num(state.plans[0].qty)):[];render();sync.className='sync';sync.querySelector('span').textContent='공용 DB 연동'}catch(e){if(e.message==='AUTH')return;const m=document.getElementById('message');m.textContent=`생산계획 데이터를 불러오지 못했습니다: ${e.message}`;m.className='message show error';sync.className='sync error';sync.querySelector('span').textContent='연결 실패'}}document.getElementById('backBtn').onclick=()=>location.assign(`/mobile.html?v=${VERSION}`);document.getElementById('refreshBtn').onclick=load;document.getElementById('newBtn').onclick=openForm;document.getElementById('formClose').onclick=()=>document.getElementById('formModal').classList.remove('show');document.getElementById('cancelBtn').onclick=()=>document.getElementById('formModal').classList.remove('show');document.getElementById('calcBtn').onclick=doCalc;document.getElementById('planForm').onsubmit=savePlan;document.getElementById('detailClose').onclick=()=>document.getElementById('detailModal').classList.remove('show');document.getElementById('shortBtn').onclick=()=>{if(!state.mrp.length){alert('현재 MRP 부족자재 정보가 없습니다.');return}renderMrp(state.mrp.filter(x=>x.short>0||x.after>0))};load()})();
</script>
