<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAMO QMES 모바일</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#17324b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #30a3db;outline-offset:2px}
header{height:62px;padding:0 16px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e4eaf0;position:relative;z-index:4}
.brand{font-size:18px;font-weight:850;letter-spacing:-.5px;flex:1}.brand span{color:#138bad}.icon{border:0;background:#eaf2f8;color:#214763;border-radius:13px;width:44px;height:44px;font-size:23px}
#home{padding:24px 18px 94px;min-height:calc(100dvh - 62px);background:linear-gradient(180deg,#e5f3fa,#f4f8fb 40%)}.greet{font-size:12px;color:#50718b;letter-spacing:1px;font-weight:700}.headline{font-size:27px;line-height:1.25;margin:12px 0 22px}.search{display:flex;align-items:center;background:white;border-radius:19px;box-shadow:0 10px 30px #15395416;padding:6px 7px 6px 17px;gap:8px}.search input{border:0;outline:0;min-width:0;flex:1;font-size:16px}.search button{border:0;border-radius:13px;background:#14537a;color:#fff;padding:13px 15px;font-weight:700}.section{margin:30px 0 13px;font-size:16px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-height:105px;border:1px solid #e2eaf0;background:#fff;border-radius:19px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;box-shadow:0 4px 12px #1d48600a;color:#21415b;font-size:13px;font-weight:750}.tile .symbol{font-size:27px}.tile:active{background:#e4f2fa}
#work{display:none;height:calc(100dvh - 62px);background:#fff}#work iframe{width:100%;height:100%;border:0;display:block}body.in-work #home{display:none}body.in-work #work{display:block}
#shade{display:none;position:fixed;inset:0;background:#061c30a8;z-index:8}#drawer{position:fixed;inset:0 auto 0 0;width:min(84vw,330px);background:white;z-index:9;transform:translateX(-105%);transition:transform .22s;box-shadow:10px 0 25px #0002;overflow:auto;padding:20px 14px 40px}body.menu-open #shade{display:block}body.menu-open #drawer{transform:none}.drawer-title{font-weight:900;font-size:20px;margin:4px 8px 20px}.drawer-title small{display:block;color:#668399;font-size:12px;margin-top:6px;font-weight:500}.nav{width:100%;border:0;background:transparent;padding:15px 14px;text-align:left;font-weight:700;color:#234762;border-radius:12px;font-size:15px}.nav:active{background:#e7f2f9}
.bottom{position:fixed;bottom:0;left:0;right:0;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid #e1e9ef;z-index:5}.bottom button{background:transparent;border:0;color:#365a75;font-size:12px;min-width:64px;display:grid;gap:4px;justify-items:center}.bottom b{font-size:23px}body.in-work .bottom{display:none}body.in-work #pc{min-height:100%;}body.in-work #work{overflow:hidden}
#status{display:none;padding:12px;background:#fff2cf;color:#65440d;font-size:12px}
</style></head><body>
<header><button class="icon" id="open" aria-label="전체 메뉴 열기" aria-expanded="false">☰</button><div class="brand">NAMO <span>QMES</span></div><button class="icon" id="homebtn" aria-label="홈으로">⌂</button></header>
<div id="status" role="status"></div>
<section id="home"><div class="greet">NAMO CHEMICAL · SMART WORKSPACE</div><h1 class="headline">업무를 더 간편하게,<br>어디서나 QMES</h1>
<form class="search" id="search"><input id="query" aria-label="업무 검색" placeholder="작업지시 · 검사 · LOT 검색"><button type="submit">검색</button></form>
<h2 class="section">빠른 업무</h2><div class="grid">
<button class="tile" data-find="작업지시"><span class="symbol">▤</span>작업지시서</button><button class="tile" data-find="수입검사"><span class="symbol">◉</span>수입검사</button><button class="tile" data-find="공정검사"><span class="symbol">▥</span>공정검사</button>
<button class="tile" data-find="출하검사"><span class="symbol">✓</span>출하검사</button><button class="tile" data-find="LOT"><span class="symbol">⌕</span>LOT 추적</button><button class="tile" data-find="재고"><span class="symbol">▣</span>재고관리</button>
<button class="tile" data-find="결재"><span class="symbol">✎</span>결재함</button><button class="tile" data-find="생산실적"><span class="symbol">▥</span>생산실적</button><button class="tile" data-find="설비"><span class="symbol">⚙</span>설비관리</button>
</div></section>
<section id="work" aria-label="QMES 업무 화면"><iframe id="pc" title="QMES 공통 업무 기능" src="/?desktop=1&pc=1"></iframe></section>
<div id="shade"></div><nav id="drawer" aria-label="모바일 전체 메뉴" inert><div class="drawer-title">NAMO QMES<small>전체 업무 메뉴</small></div><button class="nav" data-home="1">⌂ &nbsp; 홈</button><div id="dynamic-menu"></div></nav>
<div class="bottom"><button data-home="1"><b>⌂</b>홈</button><button data-open="1"><b>☰</b>업무</button><button data-find="작업지시"><b>▤</b>작업지시</button><button data-find="결재"><b>✎</b>결재함</button></div>
<script>
(function(){'use strict';var pc=document.getElementById('pc'),drawer=document.getElementById('drawer'),open=document.getElementById('open'),status=document.getElementById('status'),menu=document.getElementById('dynamic-menu');
function notice(t){status.textContent=t;status.style.display='block';setTimeout(function(){status.style.display='none'},5500)}
function setMenu(v){document.body.classList.toggle('menu-open',v);open.setAttribute('aria-expanded',String(v));drawer.inert=!v;if(v){build();drawer.querySelector('.nav').focus()}else open.focus()}
function home(){document.body.classList.remove('in-work');setMenu(false)}
function items(){try{var doc=pc.contentDocument;return Array.from(doc.querySelectorAll('.sidebar .menu[data-page],.sidebar .menu[data-tab],.sidebar a[href]')).filter(function(el){return !!(el.getAttribute('data-page')||el.getAttribute('data-tab')||el.getAttribute('href'))&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&!el.closest('[hidden],[aria-hidden="true"]')})}catch(e){return []}}
var aliases={'작업지시':['작업지시서','작업지시'],'수입검사':['수입검사','입고검사'],'공정검사':['공정검사'],'출하검사':['출하검사'],'LOT':['LOT 추적','LOT추적','LOT'],'재고':['재고관리','재고'],'결재':['결재함','전자결재','결재'],'생산실적':['생산실적','생산현황'],'설비':['설비관리','설비']};
function clean(el){var label=el.querySelector('.label');return (label?label.textContent:(el.innerText||el.textContent||'')).replace(/\s+/g,' ').trim()}
function findItem(label){var terms=aliases[label]||[label];var all=items();for(var i=0;i<terms.length;i++){var exact=all.find(function(el){return clean(el)===terms[i]});if(exact)return exact}for(var j=0;j<terms.length;j++){var partial=all.find(function(el){return clean(el).includes(terms[j])});if(partial)return partial}return null}
function activate(label){var found=findItem(label);if(!found){build();notice('해당 메뉴를 찾지 못했습니다: '+label+' · 전체 메뉴에서 선택해 주세요.');return}document.body.classList.add('in-work');setMenu(false);try{found.click()}catch(e){notice('업무 화면 연결을 확인해 주세요')}}
function build(){var all=items(),seen=new Set();menu.replaceChildren();all.forEach(function(el){var label=clean(el);if(!label||seen.has(label)||label.length>34)return;seen.add(label);var btn=document.createElement('button');btn.className='nav';btn.textContent=label;btn.onclick=function(){document.body.classList.add('in-work');setMenu(false);el.click()};menu.appendChild(btn)});if(!seen.size){var msg=document.createElement('p');msg.style.padding='14px';msg.textContent='업무 메뉴를 불러오는 중입니다.';menu.appendChild(msg)}}
pc.addEventListener('load',function(){try{var d=pc.contentDocument;if(!d||!d.head)return;var css=d.createElement('link');css.rel='stylesheet';css.href='/css/qmes-mobile-pc-unified-20261031.css?v=6';d.head.appendChild(css);var workflow=d.createElement('link');workflow.rel='stylesheet';workflow.href='/css/qmes-mobile-workflow-20261031.css?v=1';d.head.appendChild(workflow);var overrides=d.createElement('style');overrides.textContent='@media(max-width:768px){#qmes-mobile-menu-toggle,#qmes-mobile-backdrop{display:none!important}.sidebar{transform:translateX(-105%)!important;pointer-events:none!important}html.qmes-mobile-menu-open .sidebar{transform:translateX(-105%)!important;pointer-events:none!important}#main.namo-portal-shell{width:100%!important;min-width:0!important}body,html{max-width:100%!important;overflow-x:hidden!important}.topbar{min-width:0!important}.content{min-width:0!important;max-width:100%!important}.workspace-body,.module-shell{max-width:100%!important;min-width:0!important;padding:12px!important;box-sizing:border-box!important}.workspace-body input,.workspace-body select,.workspace-body textarea,.module-shell input,.module-shell select,.module-shell textarea{max-width:100%!important;min-width:0!important;font-size:16px!important;box-sizing:border-box!important}.workspace-body button,.module-shell button{min-height:42px}.workspace-body .toolbar,.module-shell .toolbar,.workspace-body .filter-bar,.module-shell .filter-bar{display:flex!important;flex-wrap:wrap!important;gap:8px!important}.workspace-body table,.module-shell table{max-width:none!important}.qmes-mobile-table-scroll{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}.modal-content,[role=dialog]{max-width:calc(100vw - 20px)!important;max-height:calc(100dvh - 20px)!important;overflow:auto!important}}';d.head.appendChild(overrides);setTimeout(build,1200);setTimeout(build,3200)}catch(e){notice('업무 화면 로딩 상태를 확인해 주세요')}});
document.getElementById('search').onsubmit=function(e){e.preventDefault();var q=document.getElementById('query').value.trim();if(q)activate(q)};
document.addEventListener('click',function(e){var b=e.target.closest('[data-find],[data-home],[data-open]');if(!b)return;if(b.dataset.find)activate(b.dataset.find);else if(b.dataset.home)home();else setMenu(true)});
open.onclick=function(){setMenu(!document.body.classList.contains('menu-open'))};document.getElementById('shade').onclick=function(){setMenu(false)};document.getElementById('homebtn').onclick=home;document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});window.addEventListener('pageshow',function(){if(document.body.classList.contains('menu-open'))build()});
})();
</script></body></html>
