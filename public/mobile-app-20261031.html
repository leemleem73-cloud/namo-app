document.addEventListener('click',function(e){var b=e.target.closest('[data-find],[data-home],[data-open]');if(!b)return;if(b.dataset.find)activate(b.dataset.find);else if(b.dataset.home)home();else setMenu(true)});
open.onclick=function(){setMenu(!document.body.classList.contains('menu-open'))};document.getElementById('shade').onclick=function(){setMenu(false)};document.getElementById('homebtn').onclick=home;document.getElementById('backhome').onclick=home;document.getElementById('workmenu').onclick=function(){setMenu(true)};document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});window.addEventListener('pageshow',function(){if(document.body.classList.contains('menu-open'))build()});
})();
