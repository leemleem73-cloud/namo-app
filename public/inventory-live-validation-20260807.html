<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QMES 실시간 재고 검증</title>
  <style>
    body{margin:0;font-family:Pretendard,Arial,sans-serif;background:#0f172a;color:#e2e8f0}
    .bar{padding:14px 18px;background:#111827;border-bottom:1px solid #334155;font-weight:800}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 50px)}
    iframe{width:100%;height:100%;border:0;background:#020617}
    aside{padding:16px;overflow:auto;border-left:1px solid #334155;background:#0b1220}
    .card{border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:10px;background:#111827}
    .ok{color:#34d399}.bad{color:#fb7185}.muted{color:#94a3b8}.num{font-variant-numeric:tabular-nums}
    button{width:100%;height:40px;border:0;border-radius:8px;background:#0284c7;color:white;font-weight:800;cursor:pointer;margin-bottom:12px}
    pre{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.5;color:#cbd5e1}
  </style>
</head>
<body>
  <div class="bar">나모케미칼 QMES · 실시간 재고 연동 검증</div>
  <div class="grid">
    <iframe id="qmes" src="./index.html" title="QMES"></iframe>
    <aside>
      <button id="run">검증 실행</button>
      <div id="summary" class="card muted">QMES 로그인 후 검증 실행을 누르세요.</div>
      <div id="results"></div>
    </aside>
  </div>
  <script>
    const frame=document.getElementById('qmes');
    const resultHost=document.getElementById('results');
    const summary=document.getElementById('summary');

    function inject(){
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        if(doc.querySelector('script[data-qmes-live-inventory-validation]'))return;
        const script=doc.createElement('script');
        script.src='./js/qmes-live-inventory-loader-20260807.js?v=20260807-1';
        script.async=false;
        script.dataset.qmesLiveInventoryValidation='true';
        doc.head.appendChild(script);
      }catch(error){ console.error(error); }
    }

    frame.addEventListener('load',()=>setTimeout(inject,300));

    function renderRow(name,ok,detail){
      const div=document.createElement('div');
      div.className='card';
      div.innerHTML=`<div class="${ok?'ok':'bad'}"><b>${ok?'PASS':'FAIL'}</b> · ${name}</div><div class="muted" style="margin-top:6px">${detail||''}</div>`;
      resultHost.appendChild(div);
    }

    document.getElementById('run').addEventListener('click',()=>{
      resultHost.innerHTML='';
      const win=frame.contentWindow;
      if(!win){ renderRow('QMES 프레임',false,'화면을 찾을 수 없습니다.'); return; }
      inject();
      setTimeout(()=>{
        const checks=[];
        const add=(name,ok,detail)=>{checks.push(Boolean(ok));renderRow(name,Boolean(ok),detail);};
        const db=win.DB||{};
        add('실시간 재고 API',typeof win.qmesBuildInventoryRows==='function','qmesBuildInventoryRows 함수 확인');
        add('LOT 재고 API',typeof win.qmesBuildInventoryLotRows==='function','LOT 단위 입고·사용·잔량 집계 함수 확인');
        add('IQC 데이터',Array.isArray(db.iqc),`${Array.isArray(db.iqc)?db.iqc.length:0}건`);
        add('작업지시 데이터',db.woDocs&&typeof db.woDocs==='object',`${db.woDocs?Object.keys(db.woDocs).length:0}건`);
        let rows=[];
        try{ rows=typeof win.qmesBuildInventoryRows==='function'?win.qmesBuildInventoryRows():[]; }
        catch(error){ add('재고 계산 실행',false,error.message); }
        if(Array.isArray(rows)){
          add('재고 계산 실행',true,`${rows.length}품목 계산`);
          const linked=rows.filter(r=>r.linked).length;
          add('IQC↔재고 연결',linked>0||!(db.iqc||[]).some(r=>String(r.judge||'')==='합격'),`${linked}/${rows.length}품목 실데이터 연결`);
          const negative=rows.filter(r=>Number(r.stock)<0||Number(r.availableStock)<0);
          add('마이너스 재고 방지',negative.length===0,negative.length?`${negative.length}건 오류`:'음수 재고 없음');
          const sample=rows.filter(r=>r.linked).slice(0,5).map(r=>`${r.name}: 현재 ${r.stock} / 가용 ${r.availableStock} / ${r.lotCount} LOT`).join('\n');
          if(sample){
            const pre=document.createElement('pre');pre.className='card';pre.textContent=sample;resultHost.appendChild(pre);
          }
        }
        const passed=checks.filter(Boolean).length;
        summary.className=`card ${passed===checks.length?'ok':'bad'}`;
        summary.innerHTML=`검증 결과 <b class="num">${passed}/${checks.length}</b> 통과`;
      },500);
    });
  </script>
</body>
</html>
