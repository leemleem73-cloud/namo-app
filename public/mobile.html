<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NAMO QMES Mobile</title>
<style>
:root{--ink:#15324b;--muted:#75869a;--line:#dbe4eb;--bg:#f4f7f9;--blue:#0b75c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}
body{padding-bottom:max(18px,env(safe-area-inset-bottom))}
.head{position:sticky;top:0;z-index:20;height:66px;padding:8px 14px;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brand img{width:48px;height:36px;object-fit:contain}.brand strong{display:block;font-size:18px;font-weight:900;letter-spacing:-.03em}.brand small{display:block;margin-top:2px;font-size:10px;color:#8794a2;font-weight:700}
.user{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#41586e;font-size:12px;font-weight:800;max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:14px 12px 22px}.title{margin:2px 2px 12px}.title h1{margin:0;font-size:25px;letter-spacing:-.04em}.title p{margin:6px 0 0;font-size:12px;color:var(--muted);font-weight:650;line-height:1.5}
.att{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#0875d2,#12a7c0);color:#fff;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 10px 26px rgba(17,112,166,.20)}
.att .ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.16);font-size:20px}.att strong{font-size:16px}.att small{display:block;margin-top:3px;color:#e5f8ff;font-size:11px}.att .go{margin-left:auto;font-size:26px}
.search{margin:12px 0 14px}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:14px;outline:0}
.group{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.group h2{margin:0;padding:10px 14px;background:#eaf2f7;border-bottom:1px solid var(--line);font-size:12px;color:#2a6488;letter-spacing:.02em}
.menu{width:100%;min-height:58px;padding:10px 14px;border:0;border-bottom:1px solid #edf1f4;background:#fff;display:flex;align-items:center;gap:12px;text-align:left;color:#213b51}.menu:last-child{border-bottom:0}.menu:active{background:#f5f8fa}
.menu .icon{width:38px;height:38px;flex:0 0 38px;border:1px solid #d6e2ea;border-radius:10px;background:#edf4f8;display:grid;place-items:center;color:#2a6d95;font-size:15px;font-weight:900}.menu .label{font-size:14px;font-weight:850;flex:1}.menu .chev{font-size:22px;color:#9aa7b2}
.empty{display:none;padding:24px;text-align:center;color:#7d8b98}
</style>
</head>
<body>
<header class="head">
  <div class="brand"><img src="/assets/namo-mobile-logo.svg" alt="NAMO"><div><strong>NAMO QMES</strong><small>MOBILE</small></div></div>
  <button class="user" id="userBtn" type="button">로그인 확인</button>
</header>
<main class="wrap">
  <section class="title"><h1>업무 메뉴</h1><p>PC QMES와 동일한 메뉴 순서로 구성했습니다.</p></section>
  <button class="att" id="attendanceBtn" type="button"><span class="ico">◷</span><span><strong>출퇴근</strong><small>출근 · 퇴근 · 연차 · 근태</small></span><span class="go">›</span></button>
  <div class="search"><input id="search" type="search" placeholder="업무 메뉴 검색" autocomplete="off"></div>
  <section class="group"><h2>QMES</h2><div id="menuRoot"></div><div class="empty" id="empty">검색 결과가 없습니다.</div></section>
</main>
<script>
(function(){
"use strict";
const items=[
["종합 대시보드","⌂","dash"],
["작업지시서","▤","woIssue"],
["수입검사","✓","iqc"],
["생산 진행","▥","prod"],
["공정검사","△","pqc"],
["출하검사","▣","oqc"],
["LOT 추적","◇","trace"],
["현장 입력","▶","pop"],
["설비관리","▧","eq"],
["기준서","⚙","standards"],
["회원관리","●","members",true]
];
let isAdmin=false;
const root=document.getElementById("menuRoot"),empty=document.getElementById("empty");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function render(q){
 q=String(q||"").trim().toLowerCase();let n=0,html="";
 items.forEach(([label,icon,tab,adminOnly])=>{
   if(adminOnly&&!isAdmin)return;
   if(q&&!label.toLowerCase().includes(q))return;
   n++;html+='<button class="menu" type="button" data-tab="'+esc(tab)+'"><span class="icon">'+esc(icon)+'</span><span class="label">'+esc(label)+'</span><span class="chev">›</span></button>';
 });
 root.innerHTML=html;empty.style.display=n?"none":"block";
 root.querySelectorAll(".menu").forEach(b=>b.onclick=()=>location.assign("/?desktop=1&mobileWork="+encodeURIComponent(b.dataset.tab)));
}
async function auth(){
 try{
   const r=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
   if(r.status===401){location.replace("/");return;}
   const j=await r.json();const u=j?.data?.user||j?.data||j?.user||j||{};
   const name=String(u.name||u.loginId||u.email||"").trim();document.getElementById("userBtn").textContent=name?name+"님":"사용자";
   isAdmin=String(u.role||"").toLowerCase()==="admin";render(document.getElementById("search").value);
 }catch(_){render("");}
}
document.getElementById("attendanceBtn").onclick=()=>location.assign("/attendance.html?mobile=1&source=qmes");
document.getElementById("search").oninput=e=>render(e.target.value);
render("");auth();
})();
</script>
</body></html>
