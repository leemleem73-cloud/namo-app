<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NAMO QMES Mobile</title>
<style>
:root{--ink:#15324b;--muted:#738498;--line:#dce5ec;--bg:#f3f6f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}
body{padding-bottom:max(18px,env(safe-area-inset-bottom))}
.header{position:sticky;top:0;z-index:30;height:68px;padding:8px 14px;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brand img{width:50px;height:36px;object-fit:contain}.brand strong{display:block;font-size:18px;font-weight:950;letter-spacing:-.04em}.brand small{display:block;margin-top:2px;font-size:9px;color:#8795a4;font-weight:800;letter-spacing:.08em}
.user{height:38px;max-width:110px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#41596f;font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:16px 12px 22px}.intro h1{margin:0;font-size:25px;font-weight:950;letter-spacing:-.045em}.intro p{margin:6px 0 0;color:var(--muted);font-size:12px;font-weight:700}
.att{width:100%;min-height:72px;margin-top:15px;padding:12px 15px;border:0;border-radius:17px;background:linear-gradient(135deg,#0b73d1,#12a8c1);color:#fff;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 10px 24px rgba(20,111,164,.20)}
.att .ico{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.16);font-size:20px}.att strong{display:block;font-size:17px;font-weight:950}.att small{display:block;margin-top:4px;color:#e5f7ff;font-size:11px;font-weight:750}.att .go{margin-left:auto;font-size:28px}
.search{margin:13px 0}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;outline:0;color:#203b52;font-size:14px}
.group{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden}.group-title{padding:10px 14px;background:#eaf2f7;border-bottom:1px solid var(--line);color:#2a6488;font-size:12px;font-weight:950;letter-spacing:.03em}
.menu{width:100%;min-height:60px;padding:10px 14px;border:0;border-bottom:1px solid #edf1f4;background:#fff;display:flex;align-items:center;gap:12px;text-align:left;color:#213b51}.menu:last-child{border-bottom:0}.menu:active{background:#f4f8fb}
.icon{width:39px;height:39px;flex:0 0 39px;border:1px solid #d6e2ea;border-radius:10px;background:#edf4f8;display:grid;place-items:center;color:#2b6d94;font-size:15px;font-weight:950}.label{flex:1;font-size:14px;font-weight:900}.chev{font-size:23px;color:#9aa7b2}.empty{display:none;padding:26px;text-align:center;color:#7d8c9a;font-size:12px}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><img src="/assets/namo-mobile-logo.svg" alt="NAMO"><div><strong>NAMO QMES</strong><small>MOBILE</small></div></div>
  <button class="user" id="userBtn" type="button">로그인 확인</button>
</header>
<main class="main">
  <section class="intro"><h1>업무 메뉴</h1><p>PC QMES와 동일한 메뉴 명칭과 순서입니다.</p></section>
  <button class="att" id="attendanceBtn" type="button"><span class="ico">◷</span><span><strong>출퇴근</strong><small>출근 · 퇴근 · 연차 · 근태</small></span><span class="go">›</span></button>
  <label class="search"><input id="menuSearch" type="search" placeholder="업무 메뉴 검색" autocomplete="off"></label>
  <section class="group"><div class="group-title">QMES</div><div id="menuRoot"></div><div class="empty" id="empty">검색 결과가 없습니다.</div></section>
</main>
<script>
(function(){
"use strict";
const items=[
 {label:"작업지시서",icon:"▤",tab:"woIssue"},
 {label:"수입검사",icon:"✓",tab:"iqc"},
 {label:"생산 진행",icon:"▥",tab:"prod"},
 {label:"공정검사",icon:"△",tab:"pqc"},
 {label:"출하검사",icon:"▣",tab:"oqc"},
 {label:"LOT 추적",icon:"◇",tab:"trace"},
 {label:"현장 입력",icon:"▶",tab:"pop"},
 {label:"설비관리",icon:"▧",tab:"eq"},
 {label:"기준서",icon:"⚙",tab:"standards"},
 {label:"회원관리",icon:"●",tab:"members",adminOnly:true}
];
let admin=false;
const root=document.getElementById("menuRoot"),empty=document.getElementById("empty"),search=document.getElementById("menuSearch");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function render(){
 const q=String(search.value||"").trim().toLowerCase();let html="",count=0;
 items.forEach(item=>{
   if(item.adminOnly&&!admin)return;
   if(q&&!item.label.toLowerCase().includes(q))return;
   count++;
   html+='<button class="menu" type="button" data-tab="'+esc(item.tab)+'"><span class="icon">'+esc(item.icon)+'</span><span class="label">'+esc(item.label)+'</span><span class="chev">›</span></button>';
 });
 root.innerHTML=html;empty.style.display=count?"none":"block";
 root.querySelectorAll(".menu").forEach(btn=>btn.onclick=()=>{
   const tab=btn.dataset.tab;
   const openMenu=tab==="woIssue"||tab==="prod"?"productionMenu":(tab==="iqc"||tab==="pqc"||tab==="oqc"||tab==="standards"?"qualityMenu":"");
   try{
     sessionStorage.setItem("qmes_current_tab",tab);
     if(openMenu)sessionStorage.setItem("qmes_open_menu",openMenu);else sessionStorage.removeItem("qmes_open_menu");
   }catch(_){}
   location.assign("/?desktop=1&mobile=1&mobileTab="+encodeURIComponent(tab)+(openMenu?"&mobileMenu="+encodeURIComponent(openMenu):""));
 });
}
async function auth(){
 try{
   const r=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
   if(r.status===401){location.replace("/");return;}
   const j=await r.json();const u=(j&&j.data&&j.data.user)||(j&&j.data)||(j&&j.user)||j||{};
   const name=String(u.name||u.loginId||u.email||"").trim();
   document.getElementById("userBtn").textContent=name?name+"님":"사용자";
   admin=String(u.role||"").toLowerCase()==="admin";
 }catch(_){}
 render();
}
document.getElementById("attendanceBtn").onclick=()=>location.assign("/attendance.html?mobile=1&source=qmes");
search.oninput=render;
render();auth();
})();
</script>
</body>
</html>
