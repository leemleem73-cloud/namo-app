<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6fd6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NAMO QMES" />
  <link rel="icon" href="/assets/namo-mobile-logo.svg?v=20260903-brand4" type="image/svg+xml" />
  <title>NAMO QMES Mobile</title>
  <style>
    :root{color-scheme:light;--blue:#0f6fd6;--blue2:#1486ed;--ink:#15243b;--muted:#7f8b9a;--line:#e5eaf0;--panel:#fff;--bg:#f2f5f9;--safe-bottom:max(14px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button{font:inherit}
    .phone{min-height:100dvh;max-width:900px;margin:0 auto;background:var(--bg);padding-bottom:calc(78px + var(--safe-bottom));box-shadow:0 0 36px rgba(15,35,65,.08)}
    .top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 16px 15px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 8px 24px rgba(15,111,214,.22)}
    .topline{display:flex;align-items:center;gap:9px}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:10px}.brand-symbol{flex:0 0 43px;width:43px;height:43px;object-fit:contain;display:block;filter:drop-shadow(0 3px 5px rgba(5,43,83,.18))}.brand-copy{min-width:0}.brand-copy strong{display:block;font-size:17px;font-weight:950;line-height:1.08;letter-spacing:-.035em;white-space:nowrap;color:#fff}.brand-copy span{display:block;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.01em;color:rgba(255,255,255,.80);white-space:nowrap}.top-actions{display:flex;align-items:center;gap:6px;flex:none}.icon-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.10);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:17px}.logout-btn{height:36px;padding:0 10px;border:1px solid rgba(255,255,255,.28);border-radius:12px;background:rgba(255,255,255,.13);color:#fff;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.logout-btn:disabled{opacity:.6}
    .hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:15px;min-height:42px}.hello .user{font-size:13px;font-weight:800;transition:opacity .12s ease}.hello .user.is-loading{opacity:0}.hello .user b{font-size:16px}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock strong{display:block;font-size:15px;font-weight:900}.clock span{display:block;margin-top:2px;font-size:10px;color:rgba(255,255,255,.78)}
    .content{padding:15px 13px 24px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 3px 10px}.section-title h1{margin:0;font-size:14px;font-weight:900}.section-title span{font-size:10px;color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{position:relative;min-height:94px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:13px 12px;display:flex;align-items:center;gap:11px;text-align:left;box-shadow:0 2px 9px rgba(24,39,75,.04);cursor:pointer;overflow:hidden}.card:active{transform:scale(.985);background:#f8fbff}.card::after{content:"";position:absolute;right:-18px;bottom:-22px;width:58px;height:58px;border-radius:50%;background:var(--tint,#eef6ff);opacity:.65}.tile{position:relative;z-index:1;flex:0 0 43px;width:43px;height:43px;border-radius:13px;background:var(--tile,#eaf4ff);display:grid;place-items:center;font-size:22px}.copy{position:relative;z-index:1;min-width:0}.copy strong{display:block;font-size:13px;font-weight:900;line-height:1.25}.copy span{display:block;margin-top:5px;color:var(--muted);font-size:9.5px;font-weight:650;line-height:1.35}.card[data-tone="purple"]{--tile:#f0e9ff;--tint:#f2ecff}.card[data-tone="green"]{--tile:#e6f8ef;--tint:#e8faf1}.card[data-tone="cyan"]{--tile:#e5f8fb;--tint:#e8fbfd}.card[data-tone="orange"]{--tile:#fff2df;--tint:#fff5e7}.card[data-tone="pink"]{--tile:#ffeaf1;--tint:#ffedf3}.card[data-tone="blue"]{--tile:#e8f2ff;--tint:#edf5ff}.card[data-tone="indigo"]{--tile:#ececff;--tint:#f0f0ff}.card[data-tone="lime"]{--tile:#eff9df;--tint:#f3fbe7}
    .hint{margin:14px 2px 0;padding:12px 13px;border:1px solid #dbe7f7;border-radius:13px;background:#f8fbff;color:#58708d;font-size:10.5px;font-weight:700;line-height:1.55}.bottom{position:fixed;left:50%;bottom:0;z-index:30;width:min(900px,100%);transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px var(--safe-bottom);border-top:1px solid #dfe5ec;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 -8px 25px rgba(18,35,56,.08)}.nav{border:0;background:transparent;color:#8a96a5;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:800;cursor:pointer}.nav i{font-style:normal;font-size:20px}.nav.active{color:var(--blue);background:#eef6ff}.login-note{display:none;margin:12px 13px 0;padding:11px 12px;border-radius:12px;background:#fff7e8;border:1px solid #f1d7a5;color:#825f1c;font-size:11px;font-weight:800}.login-note.show{display:flex;align-items:center;justify-content:space-between;gap:10px}.login-note a{color:#075fb8;text-decoration:none;white-space:nowrap}.opening{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,28,48,.28);backdrop-filter:blur(2px)}.opening.show{display:flex}.opening div{padding:14px 18px;border-radius:14px;background:#fff;color:#173353;font-size:12px;font-weight:900;box-shadow:0 12px 36px rgba(15,35,65,.22)}
    @media(max-width:430px){.brand-symbol{flex-basis:40px;width:40px;height:40px}.brand-copy strong{font-size:15px}.brand-copy span{font-size:9px}.logout-btn{padding:0 8px;font-size:9.5px}.top{padding-left:12px;padding-right:12px}}
    @media(max-width:360px){.brand{gap:7px}.brand-symbol{flex-basis:36px;width:36px;height:36px}.brand-copy strong{font-size:14px}.brand-copy span{font-size:8.5px}.content{padding-left:9px;padding-right:9px}.grid{gap:7px}.card{padding:10px 9px;gap:8px}.tile{width:39px;height:39px;flex-basis:39px}.copy strong{font-size:12px}.copy span{font-size:9px}}
    @media(min-width:700px) and (max-width:1100px){.top{padding-left:24px;padding-right:24px}.brand-symbol{flex-basis:54px;width:54px;height:54px}.brand-copy strong{font-size:20px}.brand-copy span{font-size:11px}.hello{margin-top:18px}.hello .user{font-size:15px}.hello .user b{font-size:19px}.clock strong{font-size:18px}.content{padding:20px 22px 32px}.section-title h1{font-size:18px}.section-title span{font-size:11px}.grid{gap:14px}.card{min-height:112px;padding:17px 16px;gap:14px;border-radius:18px}.tile{width:52px;height:52px;flex-basis:52px;font-size:26px}.copy strong{font-size:16px}.copy span{font-size:11px}.bottom{padding-left:22px;padding-right:22px}.nav{min-height:60px;font-size:10px}.nav i{font-size:23px}}
  </style>
</head>
<body>
  <div class="phone"><header class="top"><div class="topline"><div class="brand"><img class="brand-symbol" src="/assets/namo-mobile-logo.svg?v=20260903-brand4" alt="나모케미칼 NM 심볼" /><div class="brand-copy"><strong>나모케미칼</strong><span>NAMO Chemical</span></div></div><div class="top-actions"><button class="logout-btn" id="logoutBtn" type="button">로그아웃</button><button class="icon-btn" id="desktopBtn" type="button" aria-label="PC 화면 열기">☰</button></div></div><div class="hello"><div class="user is-loading" id="userGreeting">안녕하세요, <b id="userName"></b>님</div><div class="clock"><strong id="timeText">--:--</strong><span id="dateText">----</span></div></div></header>
  <div id="loginNote" class="login-note">로그인 세션을 확인할 수 없습니다. <a href="/index.html?desktop=1">로그인 화면으로</a></div>
  <main class="content"><div class="section-title"><h1>업무 바로가기</h1><span>모바일 · iPad 업무 화면</span></div><section class="grid" id="menuGrid"></section><div class="hint">휴대폰과 iPad 모두 동일한 모바일 업무 화면을 사용합니다. 각 메뉴는 모바일 전용 업무 프레임에서 열리며, 표는 필요한 경우 좌우 스크롤하고 입력·버튼은 터치 조작 크기로 표시됩니다.</div></main></div>
  <nav class="bottom"><button class="nav active" data-bottom="home"><i>⌂</i><span>홈</span></button><button class="nav" data-bottom="prod"><i>🏭</i><span>생산</span></button><button class="nav" data-bottom="pop"><i>🧪</i><span>검사</span></button><button class="nav" data-bottom="inv"><i>📦</i><span>재고</span></button><button class="nav" data-bottom="trace"><i>☷</i><span>추적</span></button></nav>
  <div class="opening" id="opening"><div id="openingText">화면을 여는 중입니다.</div></div>
<script>
(() => {
 const SESSION_KEY='qmes-current-user-v1';
 const items=[
  {tab:'dash',title:'종합현황',sub:'KPI · 생산 · 품질 현황',icon:'📊',tone:'blue'},
  {tab:'woIssue',title:'작업지시',sub:'작업지시 등록 · 조회',icon:'📝',tone:'purple'},
  {tab:'prod',title:'생산배치',sub:'생산 계획 · 배치 진행',icon:'🏭',tone:'orange'},
  {tab:'prodProcess',title:'생산공정',sub:'공정 진행 · 생산 실적',icon:'⚙️',tone:'cyan'},
  {tab:'iqc',title:'수입검사',sub:'원자재 입고 품질검사',icon:'🔎',tone:'green'},
  {tab:'pqc',title:'공정검사',sub:'공정 중 품질검사',icon:'🧪',tone:'purple'},
  {tab:'oqc',title:'출하검사',sub:'출하 전 최종 품질검사',icon:'✅',tone:'green'},
  {tab:'pop',title:'현장입력',sub:'모바일 · iPad POP',icon:'📱',tone:'pink'},
  {tab:'inv',title:'재고관리',sub:'원자재 · 완제품 재고',icon:'📦',tone:'blue'},
  {tab:'trace',title:'LOT 추적',sub:'원자재 → 생산 → 출하',icon:'🔗',tone:'indigo'},
  {tab:'eq',title:'설비관리',sub:'설비 점검 · 상태 관리',icon:'🛠️',tone:'orange'},
  {tab:'partners',title:'거래처',sub:'고객사 · 공급사 현황',icon:'🏢',tone:'cyan'},
  {tab:'spc',title:'SPC',sub:'공정능력 · Cpk 분석',icon:'📈',tone:'lime'},
  {tab:'lock',title:'품질 인터락',sub:'품질 차단 · 해제 관리',icon:'🔒',tone:'pink'}
 ];
 const grid=document.getElementById('menuGrid'), greeting=document.getElementById('userGreeting'), userName=document.getElementById('userName'), loginNote=document.getElementById('loginNote'), opening=document.getElementById('opening'), openingText=document.getElementById('openingText');
 const showUser=user=>{const name=String(user&&(user.name||user.loginId||user.email)||'').trim();if(!name)return false;userName.textContent=name;greeting.classList.remove('is-loading');return true;};
 try{showUser(JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'));}catch(_){}
 const go=(tab,label)=>{try{sessionStorage.setItem('qmes_current_tab',tab);sessionStorage.setItem('qmes_mobile_last_tab',tab);}catch(_){} openingText.textContent=`${label||'업무'} 모바일 화면을 여는 중입니다.`;opening.classList.add('show');location.assign(`/mobile-work.html?tab=${encodeURIComponent(tab)}&v=20260903-mobile-brand4`);};
 items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='card';b.dataset.tone=item.tone;b.innerHTML=`<span class="tile">${item.icon}</span><span class="copy"><strong>${item.title}</strong><span>${item.sub}</span></span>`;b.addEventListener('click',()=>go(item.tab,item.title));grid.appendChild(b);});
 document.querySelectorAll('[data-bottom]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.bottom;if(tab==='home'){scrollTo({top:0,behavior:'smooth'});return;}go(tab,{prod:'생산',pop:'검사',inv:'재고관리',trace:'LOT 추적'}[tab]);}));
 const tick=()=>{const now=new Date();document.getElementById('timeText').textContent=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('dateText').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});};tick();setInterval(tick,30000);
 fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(async r=>{const p=await r.json().catch(()=>null);if(!r.ok||!p||p.success===false)throw 0;return p.data&&p.data.user?p.data.user:(p.data||p);}).then(user=>{if(!showUser(user))throw 0;loginNote.classList.remove('show');}).catch(()=>{greeting.classList.add('is-loading');loginNote.classList.add('show');});
 document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});}catch(_){}try{[SESSION_KEY,'qmes_current_tab','qmes_mobile_last_tab','qmes_open_menu'].forEach(k=>sessionStorage.removeItem(k));}catch(_){}location.replace('/index.html?desktop=1&logout=1');});
 document.getElementById('desktopBtn').addEventListener('click',()=>location.assign('/index.html?desktop=1&v=20260903-mobile-brand4'));
})();
</script>
</body></html>
