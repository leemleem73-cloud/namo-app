<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NAMO QMES" />
  <link rel="icon" href="/assets/namo-mobile-logo.svg?v=20260903-pcmenu2" type="image/svg+xml" />
  <title>NAMO QMES Mobile</title>
  <style>
    :root{color-scheme:light;--ink:#152d42;--muted:#718195;--line:#dce4eb;--bg:#f5f7f9;--safe-top:env(safe-area-inset-top);--safe-bottom:max(12px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{touch-action:manipulation}.app{width:min(100%,760px);min-height:100dvh;margin:0 auto;background:var(--bg)}
    .head{position:sticky;top:0;z-index:50;height:calc(68px + var(--safe-top));padding:var(--safe-top) 12px 0;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.99);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:9px}.brand img{width:48px;height:34px;object-fit:contain}.brand strong{display:block;color:#102a42;font-size:16px;font-weight:950;letter-spacing:-.04em}.brand span{display:block;margin-top:2px;color:#81909e;font-size:7.5px;font-weight:850;letter-spacing:.06em}.pcmode{height:38px;padding:0 10px;border:1px solid #cfdce5;border-radius:9px;background:#edf4f8;color:#245f86;font-size:8.5px;font-weight:950;white-space:nowrap;cursor:pointer}.user{max-width:94px;height:38px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#3e566c;font-size:8.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logout{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#52687b;display:grid;place-items:center;cursor:pointer}.logout svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .intro{padding:17px 12px 12px;background:#fff;border-bottom:1px solid #e8edf1}.intro h1{margin:0;color:#112b42;font-size:21px;font-weight:950;letter-spacing:-.045em}.intro p{margin:5px 0 0;color:#738396;font-size:9.5px;font-weight:750;line-height:1.55}.search{margin-top:13px;height:45px;border:1px solid #d9e2e8;border-radius:10px;background:#f8fafc;display:flex;align-items:center;gap:8px;padding:0 11px}.search svg{flex:0 0 18px;width:18px;height:18px;fill:none;stroke:#6f8294;stroke-width:1.8}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#1a344b;font-size:14px}.search input::placeholder{color:#9aa6b1}
    .content{padding:10px 10px calc(24px + var(--safe-bottom))}.group{margin-top:11px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.group:first-child{margin-top:0}.group-title{padding:10px 12px;background:#eaf2f8;border-bottom:1px solid #d7e2ea;color:#276287;font-size:9px;font-weight:950;letter-spacing:.03em}.menu{width:100%;min-height:55px;padding:8px 10px;border:0;border-bottom:1px solid #edf1f4;background:#fff;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}.menu:last-child{border-bottom:0}.menu:active{background:#f4f8fb}.icon{flex:0 0 34px;width:34px;height:34px;border:1px solid #d4e1ea;border-radius:8px;background:#edf4f8;color:#2d6c93;display:grid;place-items:center;font-size:11px;font-weight:950}.label{min-width:0;flex:1;color:#223b51;font-size:11.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{flex:none;color:#9aa7b3;font-size:18px;line-height:1}.empty{display:none;margin:12px;padding:28px 12px;text-align:center;border:1px dashed #d5dee5;border-radius:11px;background:#fff;color:#7d8d9b;font-size:9px;font-weight:800}.empty.show{display:block}
    .opening{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.8);backdrop-filter:blur(2px)}.opening.show{display:flex}.opening-card{min-width:190px;padding:18px;border:1px solid #dce4eb;border-radius:12px;background:#fff;text-align:center;box-shadow:0 16px 44px rgba(12,38,60,.14)}.spinner{width:24px;height:24px;margin:0 auto 10px;border:2px solid #dce5ec;border-top-color:#0e64b8;border-radius:50%;animation:spin .75s linear infinite}.opening-card strong{font-size:9.5px;font-weight:900;color:#294157}@keyframes spin{to{transform:rotate(360deg)}}
    .notice{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;background:rgba(12,35,53,.32)}.notice.show{display:flex}.notice-card{width:min(100%,760px);margin:0 auto;padding:18px 16px calc(18px + var(--safe-bottom));border-radius:18px 18px 0 0;background:#fff;box-shadow:0 -18px 48px rgba(10,35,55,.15)}.notice-card strong{display:block;color:#18354d;font-size:15px;font-weight:950}.notice-card p{margin:8px 0 14px;color:#6d7f91;font-size:10px;font-weight:750;line-height:1.6}.notice-card button{width:100%;height:44px;border:0;border-radius:9px;background:#183f5c;color:#fff;font-size:11px;font-weight:950}
    @media(min-width:700px){.head{height:calc(78px + var(--safe-top));padding-left:22px;padding-right:22px}.brand img{width:62px;height:42px}.brand strong{font-size:20px}.brand span{font-size:9px}.pcmode{height:42px;padding:0 13px;font-size:10.5px}.user{max-width:150px;height:42px;font-size:10.5px}.logout{width:42px;height:42px}.intro{padding:24px 22px 16px}.intro h1{font-size:27px}.intro p{font-size:11px}.search{height:48px}.content{padding:15px 22px 35px}.group-title{font-size:10px;padding:11px 14px}.menu{min-height:62px;padding:10px 13px}.icon{width:38px;height:38px;flex-basis:38px}.label{font-size:13px}}
  </style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260903-pcmenu2" alt="NAMO"><div><strong>NAMO QMES</strong><span>PC · MOBILE SAME MENU</span></div></div>
    <button class="pcmode" id="pcBtn" type="button" aria-label="PC 버전으로 이동">PC 버전</button>
    <button class="user" id="userBtn" type="button">로그인 확인</button>
    <button class="logout" id="logoutBtn" type="button" aria-label="로그아웃"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/></svg></button>
  </header>
  <section class="intro"><h1>업무 메뉴</h1><p>현재 PC QMES와 동일한 메뉴 구분·명칭·순서로 구성했습니다.</p><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="menuSearch" type="search" placeholder="PC 메뉴와 동일하게 검색" autocomplete="off"></label></section>
  <main class="content" id="menuRoot"></main>
  <div class="empty" id="empty">검색 결과가 없습니다.</div>
</div>
<div class="opening" id="opening"><div class="opening-card"><div class="spinner"></div><strong id="openingText">업무 화면을 여는 중입니다.</strong></div></div>
<div class="notice" id="notice"><div class="notice-card"><strong id="noticeTitle">모바일 전용 화면</strong><p id="noticeText"></p><button type="button" id="noticeClose">확인</button></div></div>
<script>
(()=>{
  'use strict';
  const VERSION='20260903-pcmenu2';
  const LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;
  const groups=[
    {title:'WORKSPACE',items:[
      ['통합 대시보드','▦','home'],
      ['SPC 대시보드','⌁','spc']
    ]},
    {title:'ERP',items:[
      ['수주 · 납기관리','▤','pending:erpSales'],
      ['생산계획 · MRP','▥','pending:erpPlan'],
      ['구매 · 발주관리','□','pending:erpPurchase'],
      ['재고현황','▣','inv:stock'],
      ['입출고 관리','⇄','inv:tx'],
      ['LOT별 재고','L','inv:stock'],
      ['생산투입/완료','↳','inv:tx'],
      ['재고실사','✓','inv:stock'],
      ['거래처 현황','◇','partners']
    ]},
    {title:'MES · QMS',items:[
      ['생산 진행','▶','prod'],
      ['작업지시서','▧','woIssue'],
      ['생산공정 관리','⚙','prodProcess'],
      ['수입검사 (IQC)','Q','iqc'],
      ['공정검사 (PQC)','Q','pqc'],
      ['출하검사 (OQC)','Q','oqc'],
      ['SPC (Cpk)','C','spc'],
      ['품질 인터락','!','lock'],
      ['출하성적서','▤','docs:oqccert'],
      ['LOT 통합추적','⌕','trace'],
      ['출하 · 납품관리','⇢','inv:tx'],
      ['부적합 (8D)','8','docs:ncr'],
      ['고객불만 (GQMS)','G','docs:other:고객불만 보고서'],
      ['4M 변경관리','4','docs:change'],
      ['현장 입력 (iPad)','▱','pop'],
      ['설비 모니터링','◉','eq']
    ]}
  ];
  const root=document.getElementById('menuRoot');
  const opening=document.getElementById('opening');
  const openingText=document.getElementById('openingText');
  const notice=document.getElementById('notice');
  let authenticated=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showNotice(label){opening.classList.remove('show');document.getElementById('noticeTitle').textContent=label;document.getElementById('noticeText').textContent='PC 메뉴와 명칭·순서는 동일하게 맞췄습니다. 이 항목은 PC 화면을 모바일에 강제로 불러오지 않고 모바일 전용 화면으로 별도 연결할 예정입니다.';notice.classList.add('show')}
  function openWork(tab,extra=''){location.assign(`/mobile-work.html?tab=${encodeURIComponent(tab)}${extra}&v=${VERSION}`)}
  function route(code,label){
    if(!authenticated){location.assign(LOGIN);return}
    if(code==='home'){scrollTo({top:0,behavior:'smooth'});return}
    openingText.textContent=`${label} 화면을 여는 중입니다.`;opening.classList.add('show');
    if(code.startsWith('pending:')){showNotice(label);return}
    if(code.startsWith('inv:')){const view=code.split(':')[1]||'stock';try{sessionStorage.setItem('qmes_mobile_inventory_view',view)}catch(_){}openWork('inv',`&view=${encodeURIComponent(view)}`);return}
    if(code.startsWith('docs:')){const parts=code.split(':'),type=parts[1]||'other',title=parts.slice(2).join(':');let extra=`&new=1&doctype=${encodeURIComponent(type)}`;if(title)extra+=`&title=${encodeURIComponent(title)}`;openWork('docs',extra);return}
    openWork(code)
  }
  function render(query=''){
    const q=String(query||'').trim().toLowerCase();let visible=0;
    root.innerHTML=groups.map(group=>{const items=group.items.filter(item=>!q||item[0].toLowerCase().includes(q)||group.title.toLowerCase().includes(q));if(!items.length)return'';visible+=items.length;return`<section class="group"><div class="group-title">${esc(group.title)}</div>${items.map(([label,icon,code])=>`<button class="menu" type="button" data-code="${esc(code)}" data-label="${esc(label)}"><span class="icon">${esc(icon)}</span><span class="label">${esc(label)}</span><span class="chev">›</span></button>`).join('')}</section>`}).join('');
    document.getElementById('empty').classList.toggle('show',visible===0);
    root.querySelectorAll('.menu').forEach(btn=>btn.addEventListener('click',()=>route(btn.dataset.code,btn.dataset.label)));
  }
  async function init(){
    render();document.getElementById('menuSearch').addEventListener('input',e=>render(e.target.value));
    try{
      const response=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const payload=await response.json().catch(()=>null);
      if(response.status===401){location.replace(LOGIN);return}
      const user=payload?.data?.user||payload?.data||payload?.user||payload;const name=String(user?.name||user?.loginId||user?.email||'').trim();authenticated=Boolean(name);document.getElementById('userBtn').textContent=name?`${name}님`:'로그인';if(!authenticated)location.replace(LOGIN)
    }catch(_){document.getElementById('userBtn').textContent='로그인'}
  }
  document.getElementById('noticeClose').addEventListener('click',()=>notice.classList.remove('show'));notice.addEventListener('click',e=>{if(e.target===notice)notice.classList.remove('show')});
  document.getElementById('pcBtn').addEventListener('click',()=>location.assign('/index.html?desktop=1'));
  document.getElementById('userBtn').addEventListener('click',()=>{if(!authenticated)location.assign(LOGIN)});
  document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'})}catch(_){}location.replace(`/mobile-login.html?logout=1&v=${VERSION}`)});
  init();
})();
</script>
</body>
</html>
