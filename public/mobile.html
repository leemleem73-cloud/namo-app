<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NAMO QMES" />
  <link rel="icon" href="/assets/namo-mobile-logo.svg?v=20260904-force7" type="image/svg+xml" />
  <title>NAMO QMES Mobile</title>
  <style>
    :root{color-scheme:light;--ink:#152d42;--muted:#718195;--line:#dce4eb;--bg:#f5f7f9;--safe-top:env(safe-area-inset-top);--safe-bottom:max(12px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{touch-action:manipulation}.app{width:min(100%,760px);min-height:100dvh;margin:0 auto;background:var(--bg)}
    .head{position:sticky;top:0;z-index:50;height:calc(68px + var(--safe-top));padding:var(--safe-top) 12px 0;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.99);border-bottom:1px solid var(--line)}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:9px}.brand img{width:48px;height:34px;object-fit:contain}.brand strong{display:block;color:#102a42;font-size:16px;font-weight:950;letter-spacing:-.04em}.brand span{display:block;margin-top:2px;color:#81909e;font-size:7.5px;font-weight:850;letter-spacing:.06em}.pcmode,.user,.logout{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#3e566c;font-size:8.5px;font-weight:900}.pcmode{padding:0 10px;background:#edf4f8;color:#245f86}.user{max-width:94px;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logout{width:38px}.intro{padding:17px 12px 12px;background:#fff;border-bottom:1px solid #e8edf1}.intro h1{margin:0;color:#112b42;font-size:21px;font-weight:950;letter-spacing:-.045em}.intro p{margin:5px 0 0;color:#738396;font-size:9.5px;font-weight:750;line-height:1.55}.attendance-launch{width:100%;min-height:64px;margin-top:14px;padding:0 15px;border:0;border-radius:14px;background:linear-gradient(135deg,#0a6ed1,#11a4c8);color:#fff;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 10px 26px rgba(19,113,165,.2);cursor:pointer}.attendance-launch:active{transform:translateY(1px)}.attendance-launch .att-ico{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.16);font-size:18px}.attendance-launch strong{display:block;font-size:14px;font-weight:950;letter-spacing:-.03em}.attendance-launch small{display:block;margin-top:4px;color:#dff4ff;font-size:8.5px;font-weight:800}.attendance-launch .go{margin-left:auto;font-size:21px;font-weight:700}.search{margin-top:13px;height:45px;border:1px solid #d9e2e8;border-radius:10px;background:#f8fafc;display:flex;align-items:center;padding:0 11px}.search input{width:100%;border:0;outline:0;background:transparent;color:#1a344b;font-size:14px}.content{padding:10px 10px calc(24px + var(--safe-bottom))}.group{margin-top:11px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.group:first-child{margin-top:0}.group-title{padding:10px 12px;background:#eaf2f8;border-bottom:1px solid #d7e2ea;color:#276287;font-size:9px;font-weight:950;letter-spacing:.03em}.menu{width:100%;min-height:55px;padding:8px 10px;border:0;border-bottom:1px solid #edf1f4;background:#fff;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}.menu:last-child{border-bottom:0}.menu:active{background:#f4f8fb}.icon{flex:0 0 34px;width:34px;height:34px;border:1px solid #d4e1ea;border-radius:8px;background:#edf4f8;color:#2d6c93;display:grid;place-items:center;font-size:11px;font-weight:950}.label{min-width:0;flex:1;color:#223b51;font-size:11.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#9aa7b3;font-size:18px}.empty{display:none;margin:12px;padding:28px 12px;text-align:center;border:1px dashed #d5dee5;border-radius:11px;background:#fff;color:#7d8d9b;font-size:9px;font-weight:800}.empty.show{display:block}.notice{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;background:rgba(12,35,53,.32)}.notice.show{display:flex}.notice-card{width:min(100%,760px);margin:0 auto;padding:18px 16px calc(18px + var(--safe-bottom));border-radius:18px 18px 0 0;background:#fff}.notice-card strong{display:block;color:#18354d;font-size:15px;font-weight:950}.notice-card p{margin:8px 0 14px;color:#6d7f91;font-size:10px;font-weight:750;line-height:1.6}.notice-card button{width:100%;height:44px;border:0;border-radius:9px;background:#183f5c;color:#fff;font-size:11px;font-weight:950}
  </style>
</head>
<body>
<div class="app">
  <header class="head"><div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-force7" alt="NAMO"><div><strong>NAMO QMES</strong><span>PC · MOBILE SAME MENU</span></div></div><button class="pcmode" id="pcBtn" type="button">PC 버전</button><button class="user" id="userBtn" type="button">로그인 확인</button><button class="logout" id="logoutBtn" type="button">↪</button></header>
  <section class="intro"><h1>업무 메뉴</h1><p>현재 PC QMES와 동일한 메뉴 구분·명칭·순서로 구성했습니다.</p><button class="attendance-launch" id="attendanceLaunch" type="button"><span class="att-ico">◷</span><span><strong>출퇴근 모바일 열기</strong><small>출근 · 퇴근 · 연차 · 승인 · 생체인증</small></span><span class="go">›</span></button><label class="search"><input id="menuSearch" type="search" placeholder="PC 메뉴와 동일하게 검색" autocomplete="off"></label></section>
  <main class="content" id="menuRoot"></main><div class="empty" id="empty">검색 결과가 없습니다.</div>
</div>
<div class="notice" id="notice"><div class="notice-card"><strong id="noticeTitle">모바일 전용 화면</strong><p id="noticeText"></p><button type="button" id="noticeClose">확인</button></div></div>
<script>
(()=>{'use strict';
const VERSION='20260904-attendance-mobile2',LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;
const groups=[
 {title:'WORKSPACE',items:[['통합 대시보드','▦','home'],['SPC 대시보드','⌁','spc']]},
 {title:'ERP',items:[['수주 · 납기관리','▤','erpSales'],['생산계획 · MRP','▥','erpPlan'],['구매 · 발주관리','□','erpPurchase'],['재고현황','▣','inv:stock'],['입출고 관리','⇄','inv:tx'],['LOT별 재고','L','inv:stock'],['생산투입/완료','↳','inv:tx'],['재고실사','✓','inv:stock'],['거래처 현황','◇','partners']]},
 {title:'MES · QMS',items:[['생산 진행','▶','prod'],['작업지시서','▧','woIssue'],['생산공정 관리','⚙','prodProcess'],['수입검사 (IQC)','Q','iqc'],['공정검사 (PQC)','Q','pqc'],['출하검사 (OQC)','Q','oqc'],['SPC (Cpk)','C','spc'],['품질 인터락','!','lock'],['출하성적서','▤','docs:oqccert'],['LOT 통합추적','⌕','trace'],['출하 · 납품관리','⇢','inv:tx'],['부적합 (8D)','8','docs:ncr'],['고객불만 (GQMS)','G','docs:other:고객불만 보고서'],['4M 변경관리','4','docs:change'],['현장 입력 (iPad)','▱','pop'],['설비 모니터링','◉','eq']]}
];
const root=document.getElementById('menuRoot'),notice=document.getElementById('notice');let authenticated=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function goPlan(){location.assign('/mobile-plan.html?v=20260904-plan3')}
function goSales(){location.assign('/mobile-sales.html?v=20260904-sales6')}
function goPurchase(){location.assign('/mobile-work.html?tab=erpPurchase&mobile=1&v=20260904-purchase1')}
function showNotice(label){const text=String(label||'');if(/생산계획|MRP/i.test(text)){goPlan();return}if(/수주|납기/i.test(text)){goSales();return}if(/구매|발주/i.test(text)){goPurchase();return}document.getElementById('noticeTitle').textContent=label;document.getElementById('noticeText').textContent='이 항목은 모바일 전용 화면 연결을 준비 중입니다.';notice.classList.add('show')}
function openWork(tab,extra=''){location.assign(`/mobile-work.html?tab=${encodeURIComponent(tab)}${extra}&v=${VERSION}`)}
function route(code,label){if(!authenticated){location.assign(LOGIN);return}if(code==='home'){scrollTo({top:0,behavior:'smooth'});return}if(code==='spc'){location.assign('/mobile-spc.html?v=20260904-spc3');return}if(code==='erpSales'||code==='pending:erpSales'){goSales();return}if(code==='erpPlan'||code==='pending:erpPlan'){goPlan();return}if(code==='erpPurchase'||code==='pending:erpPurchase'){goPurchase();return}if(/생산계획|MRP/i.test(String(label||''))){goPlan();return}if(/수주|납기/i.test(String(label||''))){goSales();return}if(/구매|발주/i.test(String(label||''))){goPurchase();return}if(code.startsWith('pending:')){showNotice(label);return}if(code.startsWith('inv:')){const view=code.split(':')[1]||'stock';try{sessionStorage.setItem('qmes_mobile_inventory_view',view)}catch(_){}openWork('inv',`&view=${encodeURIComponent(view)}`);return}if(code.startsWith('docs:')){const parts=code.split(':'),type=parts[1]||'other',title=parts.slice(2).join(':');let extra=`&new=1&doctype=${encodeURIComponent(type)}`;if(title)extra+=`&title=${encodeURIComponent(title)}`;openWork('docs',extra);return}openWork(code)}
function render(query=''){const q=String(query||'').trim().toLowerCase();let visible=0;root.innerHTML=groups.map(group=>{const items=group.items.filter(item=>!q||item[0].toLowerCase().includes(q)||group.title.toLowerCase().includes(q));if(!items.length)return'';visible+=items.length;return`<section class="group"><div class="group-title">${esc(group.title)}</div>${items.map(([label,icon,code])=>`<button class="menu" type="button" data-code="${esc(code)}" data-label="${esc(label)}"><span class="icon">${esc(icon)}</span><span class="label">${esc(label)}</span><span class="chev">›</span></button>`).join('')}</section>`}).join('');document.getElementById('empty').classList.toggle('show',visible===0);root.querySelectorAll('.menu').forEach(btn=>btn.addEventListener('click',()=>route(btn.dataset.code,btn.dataset.label)))}
async function init(){render();document.getElementById('menuSearch').addEventListener('input',e=>render(e.target.value));try{const response=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}),payload=await response.json().catch(()=>null);if(response.status===401){location.replace(LOGIN);return}const user=payload?.data?.user||payload?.data||payload?.user||payload,name=String(user?.name||user?.loginId||user?.email||'').trim();authenticated=Boolean(name);document.getElementById('userBtn').textContent=name?`${name}님`:'로그인';if(!authenticated){location.replace(LOGIN);return}}catch(_){location.replace(LOGIN);return}}
document.getElementById('attendanceLaunch').onclick=()=>location.assign('/attendance.html?mobile=1&source=qmes&v=20260904-mobile2');
document.getElementById('noticeClose').onclick=()=>notice.classList.remove('show');
document.getElementById('logoutBtn').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch(_){}location.replace(`/mobile-login.html?logout=1&v=${VERSION}`)};
document.getElementById('pcBtn').onclick=()=>location.assign('/?desktop=1&view=desktop');
init();
})();
</script>
</body>
</html>
