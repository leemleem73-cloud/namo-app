<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6fd6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NAMO QMES" />
  <title>NAMO QMES Mobile</title>
  <style>
    :root{
      color-scheme:light;
      --blue:#0f6fd6;
      --blue2:#1486ed;
      --ink:#15243b;
      --muted:#7f8b9a;
      --line:#e5eaf0;
      --panel:#ffffff;
      --bg:#f2f5f9;
      --safe-bottom:max(14px,env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}
    button{font:inherit}
    .phone{min-height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);padding-bottom:calc(78px + var(--safe-bottom));box-shadow:0 0 36px rgba(15,35,65,.08)}
    .top{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 8px 24px rgba(15,111,214,.22)}
    .topline{display:flex;align-items:center;gap:12px}
    .brand{min-width:0;flex:1}
    .brand strong{display:block;font-size:18px;font-weight:900;letter-spacing:-.3px}
    .brand span{display:block;margin-top:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
    .top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.10);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:17px}
    .hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:17px}
    .hello .user{font-size:13px;font-weight:800}
    .hello .user b{font-size:16px}
    .hello .clock{text-align:right;font-variant-numeric:tabular-nums}
    .hello .clock strong{display:block;font-size:15px;font-weight:900}
    .hello .clock span{display:block;margin-top:2px;font-size:10px;color:rgba(255,255,255,.78)}
    .content{padding:15px 13px 24px}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 3px 10px}
    .section-title h1{margin:0;font-size:14px;font-weight:900;letter-spacing:-.2px}
    .section-title span{font-size:10px;color:var(--muted);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .card{position:relative;min-height:94px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:13px 12px;display:flex;align-items:center;gap:11px;text-align:left;box-shadow:0 2px 9px rgba(24,39,75,.04);cursor:pointer;overflow:hidden}
    .card:active{transform:scale(.985);background:#f8fbff}
    .card::after{content:"";position:absolute;right:-18px;bottom:-22px;width:58px;height:58px;border-radius:50%;background:var(--tint,#eef6ff);opacity:.65}
    .tile{position:relative;z-index:1;flex:0 0 43px;width:43px;height:43px;border-radius:13px;background:var(--tile,#eaf4ff);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.72)}
    .copy{position:relative;z-index:1;min-width:0}
    .copy strong{display:block;font-size:13px;font-weight:900;line-height:1.25;letter-spacing:-.25px}
    .copy span{display:block;margin-top:5px;color:var(--muted);font-size:9.5px;font-weight:650;line-height:1.35}
    .card[data-tone="purple"]{--tile:#f0e9ff;--tint:#f2ecff}
    .card[data-tone="green"]{--tile:#e6f8ef;--tint:#e8faf1}
    .card[data-tone="cyan"]{--tile:#e5f8fb;--tint:#e8fbfd}
    .card[data-tone="orange"]{--tile:#fff2df;--tint:#fff5e7}
    .card[data-tone="pink"]{--tile:#ffeaf1;--tint:#ffedf3}
    .card[data-tone="blue"]{--tile:#e8f2ff;--tint:#edf5ff}
    .card[data-tone="indigo"]{--tile:#ececff;--tint:#f0f0ff}
    .card[data-tone="lime"]{--tile:#eff9df;--tint:#f3fbe7}
    .hint{margin:14px 2px 0;padding:12px 13px;border:1px solid #dbe7f7;border-radius:13px;background:#f8fbff;color:#58708d;font-size:10.5px;font-weight:700;line-height:1.55}
    .bottom{position:fixed;left:50%;bottom:0;z-index:30;width:min(560px,100%);transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px var(--safe-bottom);border-top:1px solid #dfe5ec;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 -8px 25px rgba(18,35,56,.08)}
    .nav{border:0;background:transparent;color:#8a96a5;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:800;cursor:pointer}
    .nav i{font-style:normal;font-size:20px;line-height:1}
    .nav.active{color:var(--blue);background:#eef6ff}
    .login-note{display:none;margin:0 13px 12px;padding:11px 12px;border-radius:12px;background:#fff7e8;border:1px solid #f1d7a5;color:#825f1c;font-size:11px;font-weight:800}
    .login-note.show{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .login-note a{color:#075fb8;text-decoration:none;white-space:nowrap}
    @media (max-width:360px){.content{padding-left:9px;padding-right:9px}.grid{gap:7px}.card{padding:10px 9px;gap:8px}.tile{width:39px;height:39px;flex-basis:39px}.copy strong{font-size:12px}.copy span{font-size:9px}}
    @media (min-width:700px){body{padding:24px}.phone{min-height:calc(100dvh - 48px);border-radius:26px;overflow:hidden}.bottom{width:560px;bottom:24px;border-radius:0 0 26px 26px}.top{padding-top:18px}}
  </style>
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="topline">
        <div class="brand">
          <strong>NAMO QMES</strong>
          <span>나모케미칼 생산 · 품질 통합관리</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" id="refreshBtn" aria-label="새로고침">↻</button>
          <button class="icon-btn" type="button" id="desktopBtn" aria-label="PC 화면 열기">☰</button>
        </div>
      </div>
      <div class="hello">
        <div class="user">안녕하세요, <b id="userName">사용자</b>님</div>
        <div class="clock"><strong id="timeText">--:--</strong><span id="dateText">----</span></div>
      </div>
    </header>

    <div id="loginNote" class="login-note">로그인 정보가 없습니다. <a href="/">로그인 화면으로</a></div>

    <main class="content">
      <div class="section-title">
        <h1>업무 바로가기</h1>
        <span>터치하여 바로 이동</span>
      </div>
      <section class="grid" id="menuGrid" aria-label="QMES 모바일 메뉴"></section>
      <div class="hint">휴대폰에서는 이 화면을 홈으로 사용하고, 각 업무 화면은 기존 QMES 데이터와 같은 계정·세션을 사용합니다. 브라우저의 ‘홈 화면에 추가’를 사용하면 앱처럼 실행할 수 있습니다.</div>
    </main>
  </div>

  <nav class="bottom" aria-label="하단 메뉴">
    <button class="nav active" type="button" data-bottom="home"><i>⌂</i><span>홈</span></button>
    <button class="nav" type="button" data-bottom="prod"><i>🏭</i><span>생산</span></button>
    <button class="nav" type="button" data-bottom="pop"><i>🧪</i><span>검사</span></button>
    <button class="nav" type="button" data-bottom="inv"><i>📦</i><span>재고</span></button>
    <button class="nav" type="button" data-bottom="trace"><i>☷</i><span>추적</span></button>
  </nav>

  <script>
    (() => {
      const items = [
        {tab:'dash',       title:'종합현황',  sub:'KPI · 생산 · 품질 현황', icon:'📊', tone:'blue'},
        {tab:'woIssue',    title:'작업지시',  sub:'작업지시 등록 · 조회', icon:'📝', tone:'purple'},
        {tab:'prod',       title:'생산배치',  sub:'생산 계획 · 배치 진행', icon:'🏭', tone:'orange'},
        {tab:'prodProcess',title:'생산공정',  sub:'공정 진행 · 생산 실적', icon:'⚙️', tone:'cyan'},
        {tab:'iqc',        title:'수입검사',  sub:'원자재 입고 품질검사', icon:'🔎', tone:'green'},
        {tab:'pqc',        title:'공정검사',  sub:'공정 중 품질검사', icon:'🧪', tone:'purple'},
        {tab:'oqc',        title:'출하검사',  sub:'출하 전 최종 품질검사', icon:'✅', tone:'green'},
        {tab:'pop',        title:'현장입력',  sub:'모바일 · iPad POP', icon:'📱', tone:'pink'},
        {tab:'inv',        title:'재고관리',  sub:'원자재 · 완제품 재고', icon:'📦', tone:'blue'},
        {tab:'trace',      title:'LOT 추적',  sub:'원자재 → 생산 → 출하', icon:'🔗', tone:'indigo'},
        {tab:'eq',         title:'설비관리',  sub:'설비 점검 · 상태 관리', icon:'🛠️', tone:'orange'},
        {tab:'partners',   title:'거래처',    sub:'고객사 · 공급사 현황', icon:'🏢', tone:'cyan'},
        {tab:'spc',        title:'SPC',       sub:'공정능력 · Cpk 분석', icon:'📈', tone:'lime'},
        {tab:'lock',       title:'품질 인터락',sub:'품질 차단 · 해제 관리', icon:'🔒', tone:'pink'}
      ];

      const grid = document.getElementById('menuGrid');
      const go = (tab) => {
        try {
          sessionStorage.setItem('qmes_current_tab', tab);
          sessionStorage.setItem('qmes_mobile_last_tab', tab);
        } catch (_) {}
        location.href = '/';
      };

      items.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card';
        button.dataset.tone = item.tone;
        button.innerHTML = `<span class="tile" aria-hidden="true">${item.icon}</span><span class="copy"><strong>${item.title}</strong><span>${item.sub}</span></span>`;
        button.addEventListener('click', () => go(item.tab));
        grid.appendChild(button);
      });

      document.querySelectorAll('[data-bottom]').forEach(button => {
        button.addEventListener('click', () => {
          const tab = button.dataset.bottom;
          if (tab === 'home') {
            window.scrollTo({top:0, behavior:'smooth'});
            return;
          }
          go(tab);
        });
      });

      const updateClock = () => {
        const now = new Date();
        document.getElementById('timeText').textContent = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
        document.getElementById('dateText').textContent = now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
      };
      updateClock();
      setInterval(updateClock, 30000);

      fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'})
        .then(response => response.ok ? response.json() : Promise.reject(new Error('unauthorized')))
        .then(payload => {
          const user = payload && payload.data ? payload.data : payload;
          const name = String(user && (user.name || user.loginId || user.email) || '사용자').trim();
          document.getElementById('userName').textContent = name || '사용자';
        })
        .catch(() => document.getElementById('loginNote').classList.add('show'));

      document.getElementById('refreshBtn').addEventListener('click', () => location.reload());
      document.getElementById('desktopBtn').addEventListener('click', () => location.href = '/');
    })();
  </script>
</body>
</html>
