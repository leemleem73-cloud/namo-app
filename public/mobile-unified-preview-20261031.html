<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAMO QMES</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f7fa}
header{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#123c5a;color:white}
header strong{flex:1;font-size:15px}button{border:1px solid #b8c9d7;background:#fff;color:#17354d;border-radius:7px;padding:9px;font-size:13px}
#workspace{display:block;width:100%;height:100dvh;border:0;background:white}
#notice{position:absolute;top:8px;left:8px;right:8px;background:#fff4d9;border:1px solid #e7cb8d;border-radius:8px;padding:10px;font-size:12px;display:none}
</style></head><body>

<div id="notice" role="status"></div>
<iframe id="workspace" title="QMES PC 공통 업무 화면" src="/?desktop=1&pc=1" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('workspace'),notice=document.getElementById('notice');
var lastCheck={status:'loading',timestamp:new Date().toISOString()};
window.qmesMobileDiagnostics=function(){return Object.assign({},lastCheck);};
function check(){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.body){lastCheck={status:'not-ready'};return;}
  var tables=doc.querySelectorAll('.workspace-body table,.module-shell table,.content table').length;
  var wrapped=doc.querySelectorAll('.qmes-mobile-table-scroll').length;
  var sidebar=!!doc.querySelector('.sidebar');
  var menu=!!doc.getElementById('qmes-mobile-menu-toggle');
  var css=!!doc.getElementById('qmes-unified-mobile-css');
  var style=doc.getElementById('qmes-unified-mobile-css');
  var script=doc.getElementById('qmes-unified-mobile-js');
  var sidebarNode=doc.querySelector('.sidebar');
  var menuItems=sidebarNode?sidebarNode.querySelectorAll('a,button,.menu').length:0;
  var activeMenus=sidebarNode?sidebarNode.querySelectorAll('.active,[aria-current="page"]').length:0;
  var scrollWidth=doc.documentElement.scrollWidth;
  var viewport=doc.documentElement.clientWidth;
  var cssLoaded=!!(style&&style.sheet);
  var jsLoaded=!!(script&&script.dataset.qmesLoaded==='1');
  lastCheck={status:'loaded',timestamp:new Date().toISOString(),sidebar:sidebar,menu:menu,css:css,cssLoaded:cssLoaded,jsLoaded:jsLoaded,menuItems:menuItems,activeMenus:activeMenus,tables:tables,scrollContainers:wrapped,viewportWidth:viewport,documentScrollWidth:scrollWidth,horizontalOverflow:scrollWidth>viewport+2};
 }catch(e){lastCheck={status:'blocked',reason:String(e)};}
}

function show(msg){notice.textContent=msg;notice.style.display='block';}


frame.addEventListener('load',function(){
 try {
  var doc=frame.contentDocument;
  if(!doc||!doc.head)throw Error('no access');
  if(!doc.getElementById('qmes-unified-mobile-css')){
   var link=doc.createElement('link');link.id='qmes-unified-mobile-css';
   link.rel='stylesheet';link.href='/css/qmes-mobile-pc-unified-20261031.css?v=3';
   link.onerror=function(){show('모바일 화면 스타일을 불러오지 못했습니다. 새로고침하세요.');};
   doc.head.appendChild(link);
  }
  if(!doc.getElementById('qmes-unified-mobile-js')){
   var script=doc.createElement('script');script.id='qmes-unified-mobile-js';
   script.onload=function(){script.dataset.qmesLoaded='1';};
   script.src='/js/qmes-mobile-pc-unified-20261031.js?v=4';
   script.onerror=function(){show('모바일 메뉴 스크립트를 불러오지 못했습니다. 새로고침하세요.');};
   doc.head.appendChild(script);
  }
  notice.style.display='none';
  setTimeout(function(){
   check();
   if(lastCheck.status==='loaded'&&(!lastCheck.cssLoaded||!lastCheck.jsLoaded||!lastCheck.menu)){
    show('모바일 메뉴가 준비되지 않았습니다. 새로고침 후 다시 확인하세요.');
   }
  },1600);
 } catch(e){show('통합 화면 스타일을 적용하지 못했습니다. 로그인 또는 접근 정책을 확인하세요.');}
});
})();
</script></body></html>
