 <g font-size="24" font-weight="900"><text x="48" y="148">실시간 모니터링</text><text x="40" y="395">원자재 관리</text><text x="1118" y="168">품질관리</text><text x="1182" y="420">생산관리</text><text x="44" y="824">통합 데이터</text><text x="1138" y="823">출하 및 공급망</text></g>
