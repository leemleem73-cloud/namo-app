<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f7f9" />
<title>NAMO QMES Mobile Sales</title>
<style>
:root{color-scheme:light;--ink:#173249;--muted:#7c8b99;--line:#dce4eb;--bg:#f5f7f9;--blue:#176da1;--green:#2a824c;--orange:#a96c08;--red:#b33d4a;--safe-top:env(safe-area-inset-top);--safe-bottom:max(12px,env(safe-area-inset-bottom))}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.app{width:min(100%,760px);min-height:100dvh;margin:0 auto;padding-bottom:calc(24px + var(--safe-bottom))}.head{position:sticky;top:0;z-index:30;height:calc(66px + var(--safe-top));padding:var(--safe-top) 10px 0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.99);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.back,.refresh{height:38px;border:1px solid #d7e0e7;border-radius:9px;background:#fff;color:#35516a;font-weight:950}.back{width:42px;font-size:18px}.refresh{padding:0 10px;font-size:9px}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:8px}.brand img{width:46px;height:32px}.brand small{display:block;color:#8693a0;font-size:7px;font-weight:850;letter-spacing:.07em}.brand strong{display:block;margin-top:2px;color:#112d45;font-size:14px;font-weight:950}.hero{padding:16px 12px 13px;background:#fff;border-bottom:1px solid #e7edf1}.hero-row{display:flex;justify-content:space-between;gap:10px}.hero h1{margin:0;font-size:22px;font-weight:950;letter-spacing:-.045em}.hero p{margin:5px 0 0;color:#748496;font-size:9px;font-weight:750}.sync{flex:none;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid #cce2d3;border-radius:999px;background:#f4fbf6;color:#357b50;font-size:7px;font-weight:900}.sync i{width:6px;height:6px;border-radius:50%;background:#43ad68}.sync.loading{border-color:#eadcaf;background:#fffaf0;color:#84691f}.sync.loading i{background:#d29a2e}.sync.error{border-color:#ecd1d5;background:#fff8f9;color:#9c3d49}.sync.error i{background:#c95462}.content{padding:10px}.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.kpi span{display:block;color:#8492a0;font-size:7.7px;font-weight:850}.kpi strong{display:block;margin-top:5px;color:#173249;font-size:20px;font-weight:950;font-variant-numeric:tabular-nums}.kpi small{display:block;margin-top:3px;color:#8a97a3;font-size:7.3px;font-weight:750}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}.search{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff;display:flex;align-items:center;gap:7px}.search input{width:100%;border:0;outline:0;background:transparent;color:#1e374d;font-size:13px}.filter{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff;color:#35516a;font-size:9px;font-weight:900}.list{display:grid;gap:9px;margin-top:9px}.card{border:1px solid #dde5eb;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(18,42,64,.025)}.card-head{display:flex;align-items:flex-start;gap:9px;padding:11px;border-bottom:1px solid #edf1f4}.no{flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#edf5fa;color:#176b9c;display:grid;place-items:center;font-size:9px;font-weight:950}.title{min-width:0;flex:1}.title strong{display:block;color:#19354c;font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;margin-top:4px;color:#7e8c99;font-size:8px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{flex:none;padding:5px 7px;border-radius:7px;background:#eef2f5;color:#536577;font-size:7.5px;font-weight:950}.badge.green{background:#e7f7e9;color:#237a42}.badge.blue{background:#e8f2fb;color:#176496}.badge.orange{background:#fff2dc;color:#9d6406}.badge.red{background:#fde8eb;color:#a83240}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 11px 8px}.field{min-width:0;padding:8px 5px;border-bottom:1px solid #f0f3f5}.field:nth-child(odd){padding-left:0}.field:nth-child(even){padding-right:0}.field label{display:block;color:#929daa;font-size:7.2px;font-weight:800}.field span{display:block;margin-top:4px;color:#344c61;font-size:9.3px;font-weight:850;word-break:break-word}.risk{color:#aa3542!important}.empty,.message{margin-top:9px;padding:28px 14px;border:1px dashed #d5dee5;border-radius:12px;background:#fff;text-align:center;color:#81909e;font-size:9px;font-weight:750;line-height:1.6}.message{display:none;padding:11px;border-style:solid;text-align:left}.message.show{display:block}.message.error{border-color:#edcfd4;background:#fff8f9;color:#9e3c49}@media(min-width:700px){.head{height:calc(76px + var(--safe-top));padding-left:18px;padding-right:18px}.brand img{width:58px;height:40px}.brand strong{font-size:17px}.hero{padding:21px 20px 16px}.hero h1{font-size:28px}.content{padding:14px 20px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="head"><button class="back" id="backBtn" type="button">‹</button><div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-sales1" alt="NAMO"><div><small>NAMO CHEMICAL · QMES MOBILE</small><strong>수주 · 납기관리</strong></div></div><button class="refresh" id="refreshBtn" type="button">새로고침</button></header>
<section class="hero"><div class="hero-row"><div><h1>수주 · 납기관리</h1><p>PC ERP와 동일한 공용 수주 데이터를 모바일에서 조회합니다.</p></div><div class="sync loading" id="sync"><i></i><span>조회 중</span></div></div></section>
<main class="content"><section class="kpis"><article class="kpi"><span>전체 수주</span><strong id="allCount">0</strong><small>등록 건수</small></article><article class="kpi"><span>총 수주량</span><strong id="totalQty">0</strong><small>kg</small></article><article class="kpi"><span>7일 내 납기</span><strong id="dueSoon">0</strong><small>확인 필요</small></article><article class="kpi"><span>납기 위험</span><strong id="riskCount">0</strong><small>지연 · 위험</small></article></section><div class="toolbar"><label class="search"><input id="search" type="search" placeholder="수주번호 · 고객사 · 제품 검색"></label><button class="filter" id="riskBtn" type="button">전체</button></div><div class="message" id="message"></div><section class="list" id="list"></section></main>
</div>
<script>
(()=>{'use strict';const LOGIN='/mobile-login.html?mobile=1&v=20260904-sales1';const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>{const n=Number(String(v??0).replace(/,/g,''));return Number.isFinite(n)?n:0};let rows=[],riskOnly=false;async function api(path){const r=await fetch(path,{credentials:'same-origin',cache:'no-store'});const p=await r.json().catch(()=>null);if(r.status===401){location.replace(LOGIN);throw new Error('AUTH')}if(!r.ok||p?.success===false)throw new Error(p?.message||`HTTP ${r.status}`);return p?.data!==undefined?p.data:p}function payload(record){let p=record?.payload;if(p&&typeof p==='object')return p;if(typeof p==='string'){try{return JSON.parse(p)}catch(_){}}return{}}function tone(v){const s=clean(v);if(/위험|지연|불합격|차단/.test(s))return'red';if(/대기|확인/.test(s))return'orange';if(/생산중|배차|출고|예정/.test(s))return'blue';if(/완료|반영|합격|납품/.test(s))return'green';return''}function dueRisk(row){const status=[row.shipping,row.plan,row.status].map(clean).join(' ');if(/위험|지연/.test(status))return true;const due=clean(row.due).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return false;const end=/완료|납품완료|출하완료/.test(status);return !end&&new Date(due+'T23:59:59').getTime()<Date.now()}function dueSoonRow(row){const due=clean(row.due).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return false;const diff=new Date(due+'T23:59:59').getTime()-Date.now();return diff>=0&&diff<=7*86400000}function render(){const q=clean(document.getElementById('search').value).toLowerCase();const filtered=rows.filter(r=>(!riskOnly||dueRisk(r))&&(!q||[r.id,r.customer,r.po,r.product,r.due,r.plan,r.shipping].join(' ').toLowerCase().includes(q)));document.getElementById('allCount').textContent=rows.length.toLocaleString('ko-KR');document.getElementById('totalQty').textContent=rows.reduce((s,r)=>s+num(r.qty),0).toLocaleString('ko-KR');document.getElementById('dueSoon').textContent=rows.filter(dueSoonRow).length.toLocaleString('ko-KR');document.getElementById('riskCount').textContent=rows.filter(dueRisk).length.toLocaleString('ko-KR');const list=document.getElementById('list');if(!filtered.length){list.innerHTML='<div class="empty">표시할 수주 데이터가 없습니다.</div>';return}list.innerHTML=filtered.map((r,i)=>{const risk=dueRisk(r),status=clean(r.shipping||r.plan||r.status||'-');return`<article class="card"><div class="card-head"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="title"><strong>${esc(r.id||'수주번호 미등록')}</strong><small>${esc(r.customer||'-')} · ${esc(r.product||'-')}</small></div><span class="badge ${tone(status)}">${esc(status)}</span></div><div class="fields"><div class="field"><label>고객사</label><span>${esc(r.customer||'-')}</span></div><div class="field"><label>고객 PO</label><span>${esc(r.po||'-')}</span></div><div class="field"><label>제품</label><span>${esc(r.product||'-')}</span></div><div class="field"><label>수주량</label><span>${num(r.qty).toLocaleString('ko-KR')} kg</span></div><div class="field"><label>납기</label><span class="${risk?'risk':''}">${esc(r.due||'-')}</span></div><div class="field"><label>생산계획</label><span>${esc(r.plan||'-')}</span></div><div class="field"><label>출하상태</label><span>${esc(r.shipping||'-')}</span></div><div class="field"><label>납기상태</label><span class="${risk?'risk':''}">${risk?'확인 필요':'정상'}</span></div></div></article>`}).join('')}async function load(){const sync=document.getElementById('sync');sync.className='sync loading';sync.querySelector('span').textContent='조회 중';document.getElementById('message').className='message';try{const records=await api('/api/qmes-sync/inventory');const found=(Array.isArray(records)?records:[]).find(r=>clean(r.record_key||r.recordKey)==='erp:sales');const p=payload(found);rows=Array.isArray(p.rows)?p.rows:[];if(!rows.length){try{const local=JSON.parse(localStorage.getItem('qmes-erp-sales-v1')||'[]');if(Array.isArray(local))rows=local}catch(_){}}render();sync.className='sync';sync.querySelector('span').textContent='공용 DB 연동'}catch(e){if(e.message==='AUTH')return;rows=[];render();const m=document.getElementById('message');m.textContent=`수주 데이터를 불러오지 못했습니다: ${e.message}`;m.className='message show error';sync.className='sync error';sync.querySelector('span').textContent='연결 실패'}}document.getElementById('backBtn').addEventListener('click',()=>location.assign('/mobile.html?v=20260904-sales1'));document.getElementById('refreshBtn').addEventListener('click',load);document.getElementById('search').addEventListener('input',render);document.getElementById('riskBtn').addEventListener('click',e=>{riskOnly=!riskOnly;e.currentTarget.textContent=riskOnly?'위험만':'전체';render()});load()})();
</script>
</body>
</html>
