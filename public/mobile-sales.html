<style>

f8f9;color:#9c3d49}.sync.error i{background:#c95462}.content{padding:10px}.actionbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:9px}.primary{height:44px;border:0;border-radius:10px;background:#176da1;color:#fff;padding:0 15px;font-size:10px;font-weight:950;box-shadow:0 5px 14px rgba(23,109,161,.18)}.secondary{height:44px;border:1px solid #d7e0e7;border-radius:10px;background:#fff;color:#35516a;padding:0 12px;font-size:9px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.kpi span{display:block;color:#8492a0;font-size:7.7px;font-weight:850}.kpi strong{display:block;margin-top:5px;color:#173249;font-size:20px;font-weight:950;font-variant-numeric:tabular-nums}.kpi small{display:block;margin-top:3px;color:#8a97a3;font-size:7.3px;font-weight:750}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}.search{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff;display:flex;align-items:center;gap:7px}.search input{width:100%;border:0;outline:0;background:transparent;color:#1e374d;font-size:13px}.filter{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff;color:#35516a;font-size:9px;font-weight:900}.list{display:grid;gap:9px;margin-top:9px}.card{border:1px solid #dde5eb;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(18,42,64,.025)}.card-head{display:flex;align-items:flex-start;gap:9px;padding:11px;border-bottom:1px solid #edf1f4}.no{flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#edf5fa;color:#176b9c;display:grid;place-items:center;font-size:9px;font-weight:950}.title{min-width:0;flex:1}.title strong{display:block;color:#19354c;font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;margin-top:4px;color:#7e8c99;font-size:8px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{flex:none;padding:5px 7px;border-radius:7px;background:#eef2f5;color:#536577;font-size:7.5px;font-weight:950}.badge.green{background:#e7f7e9;color:#237a42}.badge.blue{background:#e8f2fb;color:#176496}.badge.orange{background:#fff2dc;color:#9d6406}.badge.red{background:#fde8eb;color:#a83240}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 11px 8px}.field{min-width:0;padding:8px 5px;border-bottom:1px solid #f0f3f5}.field:nth-child(odd){padding-left:0}.field:nth-child(even){padding-right:0}.field label{display:block;color:#929daa;font-size:7.2px;font-weight:800}.field span{display:block;margin-top:4px;color:#344c61;font-size:9.3px;font-weight:850;word-break:break-word}.risk{color:#aa3542!important}.empty,.message{margin-top:9px;padding:28px 14px;border:1px dashed #d5dee5;border-radius:12px;background:#fff;text-align:center;color:#81909e;font-size:9px;font-weight:750;line-height:1.6}.message{display:none;padding:11px;border-style:solid;text-align:left}.message.show{display:block}.message.error{border-color:#edcfd4;background:#fff8f9;color:#9e3c49}.message.ok{border-color:#cce6d4;background:#f5fbf6;color:#2d7650}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(14,34,51,.38)}.modal.show{display:flex}.sheet{width:min(100%,760px);max-height:94dvh;margin:0 auto;background:#f7f9fb;border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 -20px 60px rgba(15,35,50,.2)}.sheet-head{display:flex;align-items:center;gap:10px;padding:15px 14px;background:#fff;border-bottom:1px solid var(--line)}.sheet-head div{min-width:0;flex:1}.sheet-head strong{display:block;color:#173249;font-size:16px;font-weight:950}.sheet-head span{display:block;margin-top:3px;color:#7e8c99;font-size:8px;font-weight:750}.close{width:36px;height:36px;border:1px solid #dce4eb;border-radius:9px;background:#fff;color:#607387;font-size:20px}.form{overflow:auto;max-height:calc(94dvh - 68px);padding:12px 12px calc(18px + var(--safe-bottom))}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.form-field{min-width:0}.form-field.full{grid-column:1/-1}.form-field label{display:block;margin-bottom:5px;color:#53687b;font-size:8px;font-weight:900}.req{color:#c5404c}.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid #d4dee6;border-radius:9px;background:#fff;color:#18344a;outline:0;font-size:12px}.form-field input,.form-field select{height:43px;padding:0 10px}.form-field textarea{min-height:72px;padding:10px;resize:vertical}.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:#67a8cf;box-shadow:0 0 0 2px rgba(57,133,180,.12)}.hint{margin-top:4px;color:#8a98a4;font-size:7px;font-weight:700}.savebar{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:13px}.cancel,.save{height:46px;border-radius:10px;font-size:10px;font-weight:950}.cancel{border:1px solid #d6e0e7;background:#fff;color:#52687b}.save{border:0;background:#176da1;color:#fff}.save:disabled{opacity:.55}.form-error{display:none;margin-top:10px;padding:10px;border:1px solid #eccfd4;border-radius:9px;background:#fff8f9;color:#9d3946;font-size:8.5px;font-weight:800}.form-error.show{display:block}@media(min-width:700px){.head{height:calc(76px + var(--safe-top));padding-left:18px;padding-right:18px}.brand img{width:58px;height:40px}.brand strong{font-size:17px}.hero{padding:21px 20px 16px}.hero h1{font-size:28px}.content{padding:14px 20px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.form-field.full{grid-column:1/-1}}
</style>

<body>
<div class="app">
<header class="head"><button class="back" id="backBtn" type="button">‹</button><div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-sales3" alt="NAMO"><div><small>NAMO CHEMICAL · QMES MOBILE</small><strong>수주 · 납기관리</strong></div></div><button class="refresh" id="refreshBtn" type="button">새로고침</button></header>
<section class="hero"><div class="hero-row"><div><h1>수주 · 납기관리</h1><p>PC ERP 공용 수주 데이터 조회 · 신규 수주 등록</p></div><div class="sync loading" id="sync"><i></i><span>조회 중</span></div></div></section>
<main class="content"><div class="actionbar"><button class="primary" id="newBtn" type="button">＋ 신규 수주 등록</button><button class="secondary" id="riskTopBtn" type="button">납기위험 보기</button></div><section class="kpis"><article class="kpi"><span>전체 수주</span><strong id="allCount">0</strong><small>등록 건수</small></article><article class="kpi"><span>총 수주량</span><strong id="totalQty">0</strong><small>kg</small></article><article class="kpi"><span>7일 내 납기</span><strong id="dueSoon">0</strong><small>확인 필요</small></article><article class="kpi"><span>납기 위험</span><strong id="riskCount">0</strong><small>지연 · 위험</small></article></section><div class="toolbar"><label class="search"><input id="search" type="search" placeholder="수주번호 · 고객사 · 제품 검색"></label><button class="filter" id="riskBtn" type="button">전체</button></div><div class="message" id="message"></div><section class="list" id="list"></section></main>
</div>
<div class="modal" id="modal" aria-hidden="true"><section class="sheet"><header class="sheet-head"><div><strong>신규 수주 등록</strong><span>PC ERP 수주 데이터와 동일한 공용 DB에 저장됩니다.</span></div><button class="close" id="closeBtn" type="button">×</button></header><form class="form" id="salesForm"><div class="form-grid"><div class="form-field"><label>수주번호</label><input id="fId" name="id" placeholder="자동 생성"><div class="hint">미입력 시 SO-YYMMDD-번호 자동 생성</div></div><div class="form-field"><label>수주일자 <span class="req">*</span></label><input id="fOrderDate" name="orderDate" type="date" required></div><div class="form-field"><label>고객사 <span class="req">*</span></label><input id="fCustomer" name="customer" required placeholder="예: 현대자동차"></div><div class="form-field"><label>고객 PO</label><input id="fPo" name="po" placeholder="고객 발주번호"></div><div class="form-field"><label>제품군</label><input id="fProductGroup" name="productGroup" placeholder="수기 입력"></div><div class="form-field"><label>제품명 <span class="req">*</span></label><input id="fProduct" name="product" required placeholder="제품명"></div><div class="form-field"><label>수주량(kg) <span class="req">*</span></label><input id="fQty" name="qty" type="number" min="0.001" step="0.001" inputmode="decimal" required placeholder="0"></div><div class="form-field"><label>요청 납기일 <span class="req">*</span></label><input id="fDue" name="due" type="date" required></div><div class="form-field"><label>긴급 여부</label><select id="fUrgent" name="urgent"><option value="일반">일반</option><option value="긴급">긴급</option></select></div><div class="form-field"><label>생산구분</label><select id="fProductionType" name="productionType"><option value="D-양산">D-양산</option><option value="C-Pilot">C-Pilot</option><option value="B-Lab">B-Lab</option></select></div><div class="form-field"><label>생산계획 상태</label><select id="fPlan" name="plan"><option value="계획대기">계획대기</option><option value="반영완료">반영완료</option></select></div><div class="form-field"><label>출하 상태</label><select id="fShipping" name="shipping"><option value="-">-</option><option value="생산중">생산중</option><option value="출하대기">출하대기</option><option value="출하완료">출하완료</option></select></div><div class="form-field full"><label>비고</label><textarea id="fNote" name="note" placeholder="특이사항 및 고객 요청사항"></textarea></div></div><div class="form-error" id="formError"></div><div class="savebar"><button class="cancel" id="cancelBtn" type="button">취소</button><button class="save" id="saveBtn" type="submit">수주 저장</button></div></form></section></div>
<script>
(()=>{'use strict';const VERSION='20260904-sales3';const LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>{const n=Number(String(v??0).replace(/,/g,''));return Number.isFinite(n)?n:0};let rows=[],riskOnly=false;async function api(path,options){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...(options||{})});const p=await r.json().catch(()=>null);if(r.status===401){location.replace(LOGIN);throw new Error('AUTH')}if(!r.ok||p?.success===false)throw new Error(p?.message||`HTTP ${r.status}`);return p?.data!==undefined?p.data:p}function payload(record){let p=record?.payload;if(p&&typeof p==='object')return p;if(typeof p==='string'){try{return JSON.parse(p)}catch(_){}}return{}}function tone(v){const s=clean(v);if(/위험|지연|불합격|차단|긴급/.test(s))return'red';if(/대기|확인/.test(s))return'orange';if(/생산중|배차|출고|예정/.test(s))return'blue';if(/완료|반영|합격|납품/.test(s))return'green';return''}function dueRisk(row){const status=[row.shipping,row.plan,row.status].map(clean).join(' ');if(/위험|지연/.test(status))return true;const due=clean(row.due).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return false;const end=/완료|납품완료|출하완료/.test(status);return !end&&new Date(due+'T23:59:59').getTime()<Date.now()}function dueSoonRow(row){const due=clean(row.due).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return false;const diff=new Date(due+'T23:59:59').getTime()-Date.now();return diff>=0&&diff<=7*86400000}function render(){const q=clean(document.getElementById('search').value).toLowerCase();const filtered=rows.filter(r=>(!riskOnly||dueRisk(r))&&(!q||[r.id,r.customer,r.po,r.productGroup,r.product,r.due,r.plan,r.shipping,r.productionType].join(' ').toLowerCase().includes(q)));document.getElementById('allCount').textContent=rows.length.toLocaleString('ko-KR');document.getElementById('totalQty').textContent=rows.reduce((s,r)=>s+num(r.qty),0).toLocaleString('ko-KR');document.getElementById('dueSoon').textContent=rows.filter(dueSoonRow).length.toLocaleString('ko-KR');document.getElementById('riskCount').textContent=rows.filter(dueRisk).length.toLocaleString('ko-KR');const list=document.getElementById('list');if(!filtered.length){list.innerHTML='<div class="empty">표시할 수주 데이터가 없습니다.</div>';return}list.innerHTML=filtered.map((r,i)=>{const risk=dueRisk(r),status=clean(r.shipping||r.plan||r.status||'-');return`<article class="card"><div class="card-head"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="title"><strong>${esc(r.id||'수주번호 미등록')}</strong><small>${esc(r.customer||'-')} · ${esc(r.product||'-')}</small></div><span class="badge ${tone(r.urgent==='긴급'?'긴급':status)}">${esc(r.urgent==='긴급'?'긴급':status)}</span></div><div class="fields"><div class="field"><label>수주일자</label><span>${esc(r.orderDate||'-')}</span></div><div class="field"><label>고객사</label><span>${esc(r.customer||'-')}</span></div><div class="field"><label>고객 PO</label><span>${esc(r.po||'-')}</span></div><div class="field"><label>제품군</label><span>${esc(r.productGroup||'-')}</span></div><div class="field"><label>제품</label><span>${esc(r.product||'-')}</span></div><div class="field"><label>생산구분</label><span>${esc(r.productionType||'-')}</span></div><div class="field"><label>수주량</label><span>${num(r.qty).toLocaleString('ko-KR')} kg</span></div><div class="field"><label>요청 납기일</label><span class="${risk?'risk':''}">${esc(r.due||'-')}</span></div><div class="field"><label>생산계획</label><span>${esc(r.plan||'-')}</span></div><div class="field"><label>출하상태</label><span>${esc(r.shipping||'-')}</span></div><div class="field"><label>납기상태</label><span class="${risk?'risk':''}">${risk?'확인 필요':'정상'}</span></div><div class="field"><label>비고</label><span>${esc(r.note||'-')}</span></div></div></article>`}).join('')}function today(){const d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}function makeId(){const d=today().replace(/-/g,'').slice(2);const prefix=`SO-${d}-`;let max=0;rows.forEach(r=>{const id=clean(r.id);if(id.startsWith(prefix)){const n=Number(id.slice(prefix.length));if(Number.isFinite(n))max=Math.max(max,n)}});return prefix+String(max+1).padStart(2,'0')}function openForm(){const t=today();document.getElementById('salesForm').reset();document.getElementById('fId').value=makeId();document.getElementById('fOrderDate').value=t;document.getElementById('fDue').value=t;document.getElementById('fUrgent').value='일반';document.getElementById('fProductionType').value='D-양산';document.getElementById('fPlan').value='계획대기';document.getElementById('fShipping').value='-';document.getElementById('formError').className='form-error';document.getElementById('modal').classList.add('show');document.getElementById('modal').setAttribute('aria-hidden','false')}function closeForm(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').setAttribute('aria-hidden','true')}async function saveRows(nextRows){return api('/api/qmes-sync/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'erp:sales',payload:{module:'erp',schema:1,kind:'sales',rows:nextRows,updatedAt:new Date().toISOString()}})})}async function onSubmit(e){e.preventDefault();const err=document.getElementById('formError'),save=document.getElementById('saveBtn');err.className='form-error';const row={id:clean(document.getElementById('fId').value)||makeId(),orderDate:document.getElementById('fOrderDate').value,customer:clean(document.getElementById('fCustomer').value),po:clean(document.getElementById('fPo').value),productGroup:clean(document.getElementById('fProductGroup').value),product:clean(document.getElementById('fProduct').value),qty:num(document.getElementById('fQty').value),due:document.getElementById('fDue').value,urgent:document.getElementById('fUrgent').value,productionType:document.getElementById('fProductionType').value,plan:document.getElementById('fPlan').value,shipping:document.getElementById('fShipping').value,note:clean(document.getElementById('fNote').value),createdAt:new Date().toISOString()};if(!row.customer||!row.product||!row.orderDate||!row.due||row.qty<=0){err.textContent='수주일자, 고객사, 제품명, 수주량, 요청 납기일을 확인하세요.';err.className='form-error show';return}if(rows.some(r=>clean(r.id)===row.id)){err.textContent='이미 존재하는 수주번호입니다. 수주번호를 변경하세요.';err.className='form-error show';return}save.disabled=true;save.textContent='저장 중...';try{const next=[row,...rows];await saveRows(next);rows=next;try{localStorage.setItem('qmes-erp-sales-v1',JSON.stringify(rows))}catch(_){}closeForm();render();const m=document.getElementById('message');m.textContent=`${row.id} 신규 수주가 공용 DB에 저장되었습니다.`;m.className='message show ok';document.getElementById('sync').className='sync';document.getElementById('sync').querySelector('span').textContent='공용 DB 저장 완료'}catch(ex){if(ex.message==='AUTH')return;err.textContent=`저장 실패: ${ex.message}`;err.className='form-error show'}finally{save.disabled=false;save.textContent='수주 저장'}}async function load(){const sync=document.getElementById('sync');sync.className='sync loading';sync.querySelector('span').textContent='조회 중';document.getElementById('message').className='message';try{const records=await api('/api/qmes-sync/inventory');const found=(Array.isArray(records)?records:[]).find(r=>clean(r.record_key||r.recordKey)==='erp:sales');const p=payload(found);rows=Array.isArray(p.rows)?p.rows:[];if(!rows.length){try{const local=JSON.parse(localStorage.getItem('qmes-erp-sales-v1')||'[]');if(Array.isArray(local))rows=local}catch(_){}}render();sync.className='sync';sync.querySelector('span').textContent='공용 DB 연동'}catch(e){if(e.message==='AUTH')return;rows=[];render();const m=document.getElementById('message');m.textContent=`수주 데이터를 불러오지 못했습니다: ${e.message}`;m.className='message show error';sync.className='sync error';sync.querySelector('span').textContent='연결 실패'}}document.getElementById('backBtn').addEventListener('click',()=>location.assign(`/mobile.html?v=${VERSION}`));document.getElementById('refreshBtn').addEventListener('click',load);document.getElementById('search').addEventListener('input',render);document.getElementById('riskBtn').addEventListener('click',e=>{riskOnly=!riskOnly;e.currentTarget.textContent=riskOnly?'위험만':'전체';render()});document.getElementById('riskTopBtn').addEventListener('click',()=>{riskOnly=true;document.getElementById('riskBtn').textContent='위험만';render()});document.getElementById('newBtn').addEventListener('click',openForm);document.getElementById('closeBtn').addEventListener('click',closeForm);document.getElementById('cancelBtn').addEventListener('click',closeForm);document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeForm()});document.getElementById('salesForm').addEventListener('submit',onSubmit);load()})();
</script>
