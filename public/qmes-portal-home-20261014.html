<head>

<title>NAMO QMES | 통합 업무 포털</title>
<style>
:root { --ink:#15324b;--navy:#0a2438;--muted:#6e8296;--brand:#138cab;--sky:#cde5ee;--round:20px;--shadow:0 18px 54px rgba(7,35,56,.19);}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #54cced;outline-offset:3px}
svg{display:block}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.small{width:16px;height:16px}.icon.large{width:24px;height:24px}
.page{min-height:100vh;display:flex;overflow:hidden;background:#0b2a3b}
.rail{width:72px;min-width:72px;min-height:100vh;z-index:11;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 14px;background:linear-gradient(180deg,#0a2a41 0%,#0c2940 55%,#102d3e 100%);border-right:1px solid rgba(255,255,255,.11);box-shadow:9px 0 26px rgba(0,16,30,.13)}
.rail button{width:48px;height:46px;background:transparent;border:0;display:grid;place-items:center;color:#9db2c2;border-radius:13px;transition:background .2s,color .2s,transform .2s;position:relative}
.rail button:hover{background:rgba(255,255,255,.13);color:white;transform:translateY(-1px)}
.rail button.active{color:white;background:linear-gradient(150deg,#2994bc,#1d668e);box-shadow:0 7px 18px rgba(2,20,39,.24)}
.rail button.active::before{content:"";position:absolute;left:-8px;top:13px;bottom:13px;width:3px;border-radius:0 4px 4px 0;background:#77dbf1}
.rail-brand{height:55px;display:grid;place-items:center;margin-bottom:8px}
.rail-brand span{display:grid;place-items:center;width:41px;height:41px;border:1px solid rgba(190,233,245,.37);border-radius:13px;color:#effaff;font-size:22px;letter-spacing:-3px;font-weight:900;background:rgba(43,152,174,.2);padding-right:4px}
.rail-label{display:none}
.rail-line{height:1px;width:29px;background:rgba(255,255,255,.17);margin:9px 0}
.rail-spacer{flex:1}
.workspace{min-width:0;flex:1;display:flex;flex-direction:column;position:relative;min-height:100vh}
.notice{height:53px;min-height:53px;display:flex;align-items:center;gap:12px;padding:0 30px 0 35px;background:linear-gradient(90deg,#e3f6ff 0%,#d2ecfc 65%,#eaf5fc 100%);color:#205a81;font-size:12px;white-space:nowrap;overflow:hidden;border-bottom:1px solid #ffffff75;z-index:4}
.notice .announce-icon{height:31px;width:31px;display:grid;place-items:center;color:#1978ae;background:white;border-radius:10px;box-shadow:0 2px 12px #95c6e365}
.notice strong{font-size:13px;color:#17466d}
.notice .tag{font-size:10px;border-radius:5px;padding:5px 8px;background:#328bc7;color:white;font-weight:750;margin-left:5px}
.notice .message{opacity:.86;overflow:hidden;text-overflow:ellipsis}
.notice .spacer{flex:1}
.notice .notice-close{color:#668cab;border:0;background:transparent;display:flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:7px}
.notice .notice-close:hover{background:#bbddf2}
.stage{flex:1;min-height:660px;position:relative;overflow:hidden;background:#123651;isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,32,55,.71) 0%,rgba(10,47,72,.48) 43%,rgba(12,46,72,.24) 74%,rgba(10,34,54,.43) 100%),linear-gradient(0deg,rgba(4,32,46,.74) 0%,transparent 32%,rgba(4,30,49,.13) 75%,rgba(1,26,47,.34) 100%);z-index:-1}
.scene{position:absolute;inset:0;height:100%;width:100%;z-index:-2;pointer-events:none}
.scene #ambient{transition:opacity .3s}
.stage.light-mode::before{background:linear-gradient(90deg,rgba(9,53,73,.57) 0%,rgba(17,70,93,.37) 55%,rgba(27,66,85,.3) 100%),linear-gradient(0deg,rgba(6,36,47,.66),transparent 42%,rgba(17,36,59,.1))}
.topbar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:28px 33px 0 45px;color:#fff;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{height:38px;width:38px;border:1.2px solid rgba(255,255,255,.56);border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;box-shadow:inset 0 0 13px rgba(255,255,255,.05)}
.brand-mark svg{width:26px;height:26px}
.brand-name{font-size:24px;line-height:1;letter-spacing:-.045em;font-weight:850}
.brand-name span{color:#d9f9ff}
.brand-sub{font-size:10px;letter-spacing:.22em;margin-top:5px;opacity:.73;font-weight:700}
.bar-right{display:flex;align-items:center;gap:15px}
.today{font-size:12px;opacity:.9;letter-spacing:.015em;font-weight:500}
.top-divider{width:1px;height:23px;background:rgba(255,255,255,.24)}
.top-btn{width:37px;height:37px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.19);border-radius:11px;display:grid;place-items:center;color:white;backdrop-filter:blur(5px);position:relative;transition:.2s}
.top-btn:hover{background:rgba(255,255,255,.24)}
.top-btn.has-dot::after{position:absolute;top:7px;right:7px;width:6px;height:6px;background:#76edcf;border-radius:100%;content:"";box-shadow:0 0 0 2px #234964}
.account{display:flex;align-items:center;gap:10px;padding-left:3px}
.avatar{height:36px;width:36px;background:linear-gradient(145deg,#f0fbff,#cbe8f1);border-radius:50%;display:grid;place-items:center;color:#447d95;border:2px solid #ffffff65}
.user-info{line-height:1.45;text-align:left}
.user-info b{font-size:12px;font-weight:730}
.user-info span{display:block;font-size:10px;opacity:.72}
.mockup-tag{font-size:10px;letter-spacing:.01em;border:1px solid #ffffff5c;padding:6px 10px;border-radius:30px;background:#ffffff26;white-space:nowrap}
.hero{position:absolute;left:50%;top:42%;transform:translate(-55%,-50%);width:min(850px,calc(100% - 420px));z-index:2;color:#fff;text-align:center;padding-top:60px}
.hero .eyebrow{font-weight:750;font-size:12px;letter-spacing:.24em;color:#c6ecf4;display:flex;align-items:center;justify-content:center;gap:11px;text-shadow:0 1px 10px rgba(0,0,0,.1)}
.hero .eyebrow::before,.hero .eyebrow::after{content:"";width:22px;height:1px;background:rgba(199,231,239,.65)}
.hero h1{margin:21px 0 16px;font-weight:800;font-size:clamp(35px,3.45vw,58px);line-height:1.33;letter-spacing:-.074em;text-shadow:0 8px 28px rgba(4,29,46,.24);white-space:nowrap}
.hero h1 em{font-style:normal;color:#e5fbff;position:relative}
.hero-desc{margin:0 auto;color:#e5f3f8;letter-spacing:-.02em;font-size:14px;line-height:1.85;font-weight:450;text-shadow:0 3px 15px #0e304886}
.search-box{margin:33px auto 0;width:min(690px,100%);height:61px;display:flex;align-items:center;padding:7px 7px 7px 22px;border:1px solid #ffffffd9;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 15px 37px rgba(7,29,46,.23);position:relative}
.search-box:focus-within{box-shadow:0 15px 37px rgba(7,29,46,.23),0 0 0 4px rgba(117,227,238,.2)}
.search-box>svg{color:#6893aa;height:22px;width:22px}
.search-box input{flex:1;min-width:0;height:100%;padding:0 15px;background:none;border:0;outline:none!important;color:#1b455c;font-size:14px}
.search-box input::placeholder{color:#859dad}
.search-box .search-submit{height:46px;min-width:100px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;background:linear-gradient(128deg,#188bb3,#146c9f);color:white;font-weight:760;font-size:13px;box-shadow:0 6px 14px rgba(35,122,161,.19)}
.search-box .search-submit:hover{background:linear-gradient(128deg,#137aa8,#0e608f)}
.suggest-wrap{width:min(690px,100%);margin:auto;position:relative}
.search-dropdown{position:absolute;z-index:10;left:0;right:0;top:7px;background:#fff;border:1px solid #dceaf2;border-radius:15px;box-shadow:0 20px 44px rgba(0,22,39,.26);padding:9px;display:none;text-align:left;color:#1b4057;max-height:290px;overflow:auto}
.search-dropdown.open{display:block}
.search-dropdown-title{font-size:11px;font-weight:750;color:#93a6b2;padding:10px 12px 7px}
.search-result{display:flex;align-items:center;gap:10px;width:100%;padding:11px;border:0;background:#fff;color:#1f4357;border-radius:10px;text-align:left}
.search-result:hover,.search-result:focus-visible{background:#eff7fc}
.search-result span{flex:1;font-size:13px;font-weight:650}
.search-result small{font-size:10px;color:#8ca0af}
.search-result .icon{color:#197ead}
.quick-search{margin-top:15px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;color:#d9edf4;font-size:11px}
.quick-search strong{font-weight:600;opacity:.85;margin-right:4px}
.quick-search button{border:1px solid rgba(246,255,255,.28);color:#effbff;background:rgba(255,255,255,.13);border-radius:40px;padding:6px 12px;font-size:11px;transition:background .15s}
.quick-search button:hover{background:rgba(255,255,255,.28)}
.right-side{z-index:3;position:absolute;right:30px;top:111px;width:287px;display:flex;flex-direction:column;gap:12px}
.side-card{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:17px;padding:20px 20px 15px;color:#20445d;box-shadow:0 14px 36px rgba(10,32,53,.13);backdrop-filter:blur(10px)}
.card-heading{display:flex;align-items:center;gap:11px;margin-bottom:17px}
.card-heading>.bubble{height:38px;width:38px;display:grid;place-items:center;background:#e8f5ff;color:#1987b3;border-radius:12px}
.card-heading>div:nth-child(2){flex:1}
.card-heading h2{font-size:14px;letter-spacing:-.05em;margin:0 0 3px}
.card-heading p{margin:0;font-size:10px;color:#8597a4}
.card-heading .more{height:27px;width:27px;display:grid;place-items:center;border:0;background:#f2f7f9;border-radius:8px;color:#7e96a5}
.task-row{padding:11px 0;display:flex;align-items:center;gap:10px;border-top:1px solid #edf1f4;text-align:left}
.task-icon{height:31px;width:31px;display:grid;place-items:center;color:#398cb3;border-radius:9px;background:#f1f8fc}
.task-row .detail{flex:1;min-width:0}
.task-row .detail b{font-size:11.5px;display:block;margin-bottom:4px;letter-spacing:-.025em}
.task-row .detail small{display:block;font-size:10px;color:#93a3af}
.task-row .placeholder{font-size:10px;color:#79a2b2;background:#edf7fb;border-radius:7px;padding:5px 7px;white-space:nowrap}
.notice-card{background:rgba(12,43,66,.61);color:#f8fdff;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.24);border-radius:15px;padding:19px 19px 15px;box-shadow:0 12px 30px rgba(8,30,46,.15)}
.notice-card .head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:750}
.notice-card .head .mini-pill{font-size:9px;color:#c5f5f2;border:1px solid #ffffff50;border-radius:30px;padding:3px 8px;font-weight:550}
.notice-card p{font-size:11px;color:#d0e4ed;line-height:1.8;margin:13px 0 5px;letter-spacing:-.018em}
.notice-card button{background:transparent;border:0;padding:6px 0;color:#adeef2;font-size:11px;display:flex;align-items:center;gap:6px}
.dock-wrap{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:32px;width:max-content;max-width:calc(100% - 340px);display:flex;flex-direction:column;align-items:center;gap:9px}
.dock-caption{font-size:10px;font-weight:750;letter-spacing:.14em;color:rgba(238,255,255,.82);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.dock{display:flex;align-items:end;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.37);padding:13px 17px 12px;border-radius:23px;background:linear-gradient(100deg,rgba(235,246,252,.91),rgba(239,251,251,.88));box-shadow:0 19px 51px rgba(5,23,38,.32), inset 0 1px rgba(255,255,255,.7);backdrop-filter:blur(15px)}
.app{width:73px;min-width:65px;padding:2px 0;border:0;border-radius:13px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#3b5669;transition:transform .18s,background .18s}
.app:hover{transform:translateY(-7px);background:rgba(255,255,255,.51)}
.app .tile{height:51px;width:51px;display:grid;place-items:center;color:white;border-radius:14px;box-shadow:inset 0 1px 1px #ffffff60,0 7px 12px rgba(32,69,96,.14)}
.app .tile svg{width:27px;height:27px;stroke-width:1.7}
.app .title{font-size:10.5px;font-weight:800;white-space:nowrap;letter-spacing:-.05em}
.tile.t1{background:linear-gradient(140deg,#25a4c6,#1e6ea1)}
.tile.t2{background:linear-gradient(140deg,#6782e9,#465dc6)}
.tile.t3{background:linear-gradient(140deg,#29b8a8,#138e95)}
.tile.t4{background:linear-gradient(140deg,#eab962,#e68d43)}
.tile.t5{background:linear-gradient(140deg,#aa84db,#7f60c2)}
.tile.t6{background:linear-gradient(140deg,#65adcc,#3d88c2)}
.tile.t7{background:linear-gradient(140deg,#288fc5,#2b66a4)}
.tile.t8{background:linear-gradient(140deg,#54ad9d,#258e84)}
.tile.t9{background:linear-gradient(140deg,#d690ae,#b36694)}
.tile.t10{background:linear-gradient(140deg,#8695a6,#5a7d98)}
.stage-foot{position:absolute;bottom:12px;right:27px;color:#ffffff8f;font-size:10px;letter-spacing:.02em;z-index:2}
.view-only{position:absolute;bottom:17px;left:30px;color:#d1e7ed;z-index:2;font-size:10px;opacity:.9}
.scene-note{position:absolute;left:43px;bottom:116px;color:rgba(241,250,252,.8);font-size:11px;font-weight:550;z-index:2;display:flex;align-items:center;gap:10px}
.scene-note .line{height:1px;width:25px;background:#d8ebed80}
.toast{position:fixed;bottom:154px;left:50%;transform:translate(-50%,15px);background:rgba(9,39,62,.94);border:1px solid #ffffff35;color:white;padding:13px 18px;border-radius:12px;z-index:40;font-size:12px;box-shadow:0 14px 30px rgba(7,30,46,.2);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.float-panel{position:absolute;z-index:12;display:none;background:#fff;color:#183e55;box-shadow:0 20px 48px rgba(4,27,48,.27);border-radius:16px;border:1px solid #e4edf2;overflow:hidden}
.float-panel.visible{display:block}
.notification-panel{right:188px;top:80px;width:312px}
.float-panel .fp-head{display:flex;justify-content:space-between;align-items:center;background:#f6fbfd;padding:17px 19px;border-bottom:1px solid #e5eff5;font-size:13px;font-weight:800}
.fp-head button{background:transparent;border:0;color:#7c95a4}
.float-panel .fp-body{padding:17px 19px;color:#536d80;font-size:12px;line-height:1.8}
.float-panel .fp-body b{color:#245c77}
.nav-panel{top:93px;left:13px;width:251px}
.nav-panel .fp-body{padding:5px}
.nav-row{padding:10px 13px;border:0;width:100%;text-align:left;background:#fff;color:#315972;display:flex;align-items:center;gap:9px;border-radius:8px;font-size:12px;font-weight:600}
.nav-row:hover{background:#eef7fb;color:#187fa9}
.nav-row .icon{width:17px;height:17px}
@media(min-width:1750px){.right-side{right:43px;width:312px;top:126px}.hero{top:42%;transform:translate(-54%,-50%)}.dock{gap:10px;padding:16px 24px}.app{width:79px}.stage-foot{right:37px}}

/* Operational QMES portal: the real left sidebar is rendered by the parent app. */
.page{width:100%;min-height:100dvh}
.workspace{width:100%;min-width:0}
.stage{min-height:calc(100dvh - 53px)}
.task-row[data-action]{width:100%;background:transparent;border:0;border-top:1px solid #edf1f4;padding:11px 0;font:inherit;color:inherit;cursor:pointer}
.task-row[data-action]:hover{background:#f4faff}
.task-row[data-action]:focus-visible{outline:2px solid #3db0d6;outline-offset:2px}

   Keep DOM hooks so the existing portal palette and notification actions work. */

   ?data:data.filter(x=>x.name!=='직원관리');
 const date=byId('today-date');
 date.textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
 let toastTimeout;
 const toast=(msg)=>{const el=byId('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2900)};
 function action(name){
  closeAll();
  if(name==='직원관리' && byId('namo-portal-root')?.dataset.portalAdmin!=='1'){
    toast('관리자 권한이 필요합니다.');return;
  }
  const routes={'종합현황':'dashboard','작업지시':'work','생산관리':'work',
    '수입검사':'incoming','공정검사':'process','출하검사':'outgoing','품질관리':'quality',
    'LOT 추적':'lotTrace','재고관리':'inventory','설비관리':'equipment','직원관리':'adminEmployees'};
  if(name==='공지사항'||name==='나의 업무 현황'){
    window.parent.postMessage({channel:'NAMO_QMES_PORTAL_20261014',type:'notify'},location.origin);
    return;
  }
  const page=routes[name];
  if(!page){toast('왼쪽 메뉴에서 업무를 선택해주세요.');return;}
  window.parent.postMessage({channel:'NAMO_QMES_PORTAL_20261014',type:'navigate',page:page},location.origin);
}
 document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>action(btn.dataset.action)));
 byId('close-notice').addEventListener('click',()=>{byId('notice').style.display='none'});
 byId('change-scene').addEventListener('click',()=>{byId('stage').classList.toggle('light-mode');toast(byId('stage').classList.contains('light-mode')?'밝은 배경 톤으로 전환했습니다.':'기본 배경 톤으로 전환했습니다.')});
 function closeAll(){byId('notification-panel').classList.remove('visible');byId('nav-panel').classList.remove('visible');byId('search-dropdown').classList.remove('open')}
 byId('notify-toggle').addEventListener('click',()=>action('공지사항'));
 document.querySelectorAll('.panel-close').forEach(btn=>btn.addEventListener('click',closeAll));
 const nav=byId('nav-panel'),navBody=byId('nav-panel-body');
 document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{
   const name=btn.dataset.nav;
   if(name==='메인 홈'){closeAll();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b===btn));toast('현재 메인 포털 화면입니다.');return;}
   const on=nav.classList.contains('visible')&&byId('nav-panel-title').textContent===name;
   closeAll();if(on)return;
   document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b===btn));
   byId('nav-panel-title').textContent=name;
   const options=(name==='전체 메뉴'||name==='품질관리')?
    (name==='품질관리'?visibleMenuData().filter(x=>['수입검사','공정검사','출하검사','LOT 추적'].includes(x.name)):visibleMenuData()):
    visibleMenuData().filter(x=>x.name===name||name==='종합 대시보드'&&x.name==='종합현황');
   navBody.replaceChildren();
   options.forEach(item=>{const b=document.createElement('button');b.className='nav-row';b.type='button';b.innerHTML='<svg class="icon" aria-hidden="true"><use href="#ico-'+item.icon+'"></use></svg><span></span>';b.querySelector('span').textContent=item.name;b.addEventListener('click',()=>action(item.name));navBody.append(b)});
   if(!options.length)navBody.textContent='메뉴 연결 예정';
   nav.classList.add('visible');
 }));
 const input=byId('search-input'),dropdown=byId('search-dropdown');
 function renderResults(q){dropdown.replaceChildren();const normalized=q.trim().toLocaleLowerCase();if(!normalized){dropdown.classList.remove('open');return}
   const results=visibleMenuData().filter(x=>(x.name+' '+x.hint).toLocaleLowerCase().includes(normalized)).slice(0,6);
   const label=document.createElement('div');label.className='search-dropdown-title';label.textContent=results.length?'메뉴 검색 결과':'검색 결과 없음';dropdown.append(label);
   if(results.length){results.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='search-result';b.innerHTML='<svg class="icon" aria-hidden="true"><use href="#ico-'+item.icon+'"></use></svg><span></span><small></small>';b.querySelector('span').textContent=item.name;b.querySelector('small').textContent=item.hint;b.addEventListener('click',()=>{input.value=item.name;action(item.name)});dropdown.append(b)})}
   else{const p=document.createElement('div');p.style.cssText='padding:10px 12px 17px;font-size:12px;color:#8298a5';p.textContent='현재 시안에서는 업무 메뉴명만 검색할 수 있습니다. 실제 LOT·작업지시 검색은 연동이 필요합니다.';dropdown.append(p)}
   dropdown.classList.add('open');
 }
 input.addEventListener('input',()=>renderResults(input.value));input.addEventListener('focus',()=>{if(input.value.trim())renderResults(input.value)});
 byId('search-form').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q){input.focus();toast('검색할 업무명을 입력해주세요.');return}const found=visibleMenuData().find(x=>x.name.toLocaleLowerCase()===q.toLocaleLowerCase());if(found)action(found.name);else{renderResults(q);toast('현재 시안은 메뉴 검색만 제공합니다. 실제 조회는 QMES 연동 후 가능합니다.')}});
 document.querySelectorAll('[data-query]').forEach(btn=>btn.addEventListener('click',()=>{input.value=btn.dataset.query;input.focus();renderResults(input.value)}));
 document.addEventListener('namo-portal-auth-change',()=>{closeAll();if(input.value.trim()==='직원관리')input.value='';});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();input.blur()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus()}});
 document.addEventListener('click',e=>{if(!e.target.closest('.search-box')&&!e.target.closest('.search-dropdown')&&!e.target.closest('.quick-search'))dropdown.classList.remove('open')});
})();
</script>
<script id="namo-portal-child-bridge-20261014" data-relocation="namo-topbar-relocation-20261014">
(function(){
  'use strict';
  const channel='NAMO_QMES_PORTAL_20261014';
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin || e.source!==window.parent || !e.data || e.data.channel!==channel)return;
    if(e.data.type==='profile'){
      const name=document.getElementById('portal-account-name');
      if(name)name.textContent=String(e.data.name||'QMES 사용자').slice(0,50);
      const root=document.getElementById('namo-portal-root');
      if(root){
        const next=e.data.isAdmin===true?'1':'0';
        if(root.dataset.portalAdmin!==next){
          root.dataset.portalAdmin=next;
          document.dispatchEvent(new Event('namo-portal-auth-change'));
        }
      }
    }
    if(e.data.type==='toggle-scene'){
      document.getElementById('change-scene')?.click();
    }
  });
  if(window.parent!==window)window.parent.postMessage({channel:channel,type:'ready'},location.origin);
})();
</script>
