0px}.actionbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.primary,.secondary{height:44px;border-radius:10px;font-size:10px;font-weight:950}.primary{border:0;background:#176da1;color:#fff}.secondary{border:1px solid #d7e0e7;background:#fff;color:#35516a;padding:0 12px}.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.kpi{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.kpi span{display:block;color:#8492a0;font-size:7.7px;font-weight:850}.kpi strong{display:block;margin-top:5px;color:#173249;font-size:20px;font-weight:950}.kpi small{display:block;margin-top:3px;color:#8a97a3;font-size:7.3px;font-weight:750}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}.search{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#1e374d;font-size:13px}.filter{height:43px;padding:0 11px;border:1px solid #d9e2e8;border-radius:10px;background:#fff;color:#35516a;font-size:9px;font-weight:900}.list{display:grid;gap:9px;margin-top:9px}.card{border:1px solid #dde5eb;border-radius:12px;background:#fff;overflow:hidden}.card-head{display:flex;align-items:flex-start;gap:9px;padding:11px;border-bottom:1px solid #edf1f4}.no{flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#edf5fa;color:#176b9c;display:grid;place-items:center;font-size:9px;font-weight:950}.title{min-width:0;flex:1}.title button{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:#176da1;font-size:12px;font-weight:950;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;margin-top:4px;color:#7e8c99;font-size:8px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{flex:none;padding:5px 7px;border-radius:7px;background:#eef2f5;color:#536577;font-size:7.5px;font-weight:950}.badge.green{background:#e7f7e9;color:#237a42}.badge.orange{background:#fff2dc;color:#9d6406}.badge.red{background:#fde8eb;color:#a83240}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 11px 8px}.field{min-width:0;padding:8px 5px;border-bottom:1px solid #f0f3f5}.field label{display:block;color:#929daa;font-size:7.2px;font-weight:800}.field span{display:block;margin-top:4px;color:#344c61;font-size:9.2px;font-weight:850;word-break:break-word}.empty,.message{margin-top:9px;padding:28px 14px;border:1px dashed #d5dee5;border-radius:12px;background:#fff;text-align:center;color:#81909e;font-size:9px;font-weight:750;line-height:1.6}.message{display:none;padding:10px;border-style:solid;text-align:left}.message.show{display:block}.message.error{border-color:#edcfd4;background:#fff8f9;color:#9e3c49}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(14,34,51,.38)}.modal.show{display:flex}.sheet{width:min(100%,760px);max-height:95dvh;margin:0 auto;background:#f7f9fb;border-radius:18px 18px 0 0;overflow:hidden}.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:15px 14px;background:#fff;border-bottom:1px solid var(--line)}.sheet-head div{min-width:0;flex:1}.sheet-head strong{display:block;font-size:16px;font-weight:950}.sheet-head span{display:block;margin-top:3px;color:#7e8c99;font-size:8px;font-weight:750}.close{width:36px;height:36px;border:1px solid #dce4eb;border-radius:9px;background:#fff;color:#607387;font-size:20px}.form,.detail{overflow:auto;max-height:calc(95dvh - 68px);padding:12px 12px calc(18px + var(--safe-bottom))}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ff label{display:block;margin-bottom:5px;color:#53687b;font-size:8px;font-weight:900}.ff input,.ff select,.ff textarea{width:100%;border:1px solid #d4dee6;border-radius:9px;background:#fff;color:#18344a;outline:0;font-size:12px}.ff input,.ff select{height:43px;padding:0 10px}.ff textarea{min-height:72px;padding:10px}.ff.full{grid-column:1/-1}.savebar{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:13px}.cancel,.save{height:46px;border-radius:10px;font-size:10px;font-weight:950}.cancel{border:1px solid #d6e0e7;background:#fff;color:#52687b}.save{border:0;background:#176da1;color:#fff}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.detail-box{padding:9px;border:1px solid #dce4eb;border-radius:9px;background:#fff}.detail-box label{display:block;color:#8d9aa6;font-size:7px;font-weight:850}.detail-box strong{display:block;margin-top:4px;color:#30495f;font-size:9px;font-weight:900;word-break:break-word}.receipts{margin-top:9px;border:1px solid #dce4eb;border-radius:10px;background:#fff;overflow:hidden}.receipts h3{margin:0;padding:10px 11px;border-bottom:1px solid #edf1f4;background:#f8fafb;font-size:10px}.receipt{padding:9px 11px;border-bottom:1px solid #eef2f4}.receipt:last-child{border-bottom:0}.receipt b{display:block;font-size:8.8px}.receipt span{display:block;margin-top:3px;color:#7d8b98;font-size:7.5px;font-weight:750}@media(min-width:700px){.content{padding:14px 20px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.detail-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

<body>
<div class="app"><header class="head"><button class="back" id="backBtn" type="button">‹</button><div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-purchase2" alt="NAMO"><div><small>NAMO CHEMICAL · QMES MOBILE</small><strong>구매 · 발주관리</strong></div></div><button class="refresh" id="refreshBtn" type="button">새로고침</button></header><section class="hero"><div class="hero-row"><div><h1>구매 · 발주관리</h1><p>PC 구매발주 DB와 동일한 데이터 조회 · 신규 발주 등록</p></div><div class="sync loading" id="sync"><i></i><span>조회 중</span></div></div></section><main class="content"><div class="actionbar"><button class="primary" id="newBtn" type="button">＋ 신규 구매발주</button><button class="secondary" id="pendingBtn" type="button">미입고 보기</button></div><section class="kpis"><article class="kpi"><span>전체 발주</span><strong id="allCount">0</strong><small>구매발주 건수</small></article><article class="kpi"><span>총 발주량</span><strong id="totalQty">0</strong><small>kg</small></article><article class="kpi"><span>미입고</span><strong id="pendingCount">0</strong><small>입고 확인 필요</small></article><article class="kpi"><span>IQC 대기</span><strong id="iqcCount">0</strong><small>수입검사 연동</small></article></section><div class="toolbar"><label class="search"><input id="search" type="search" placeholder="발주번호 · 협력사 · 품목 검색"></label><button class="filter" id="filterBtn" type="button">전체</button></div><div class="message" id="message"></div><section class="list" id="list"></section></main></div>
<div class="modal" id="formModal"><section class="sheet"><header class="sheet-head"><div><strong>신규 구매발주</strong><span>PC 구매발주 DB에 직접 저장됩니다.</span></div><button class="close" id="formClose" type="button">×</button></header><form class="form" id="purchaseForm"><div class="grid"><div class="ff"><label>발주일</label><input id="fOrderDate" type="date" required></div><div class="ff"><label>납기 요청일</label><input id="fDue" type="date" required></div><div class="ff"><label>협력사</label><input id="fSupplier" required></div><div class="ff"><label>품목</label><input id="fItem" required></div><div class="ff"><label>품목코드</label><input id="fItemCode"></div><div class="ff"><label>규격</label><input id="fSpec"></div><div class="ff"><label>발주수량</label><input id="fQty" type="number" min="0.001" step="0.001" required></div><div class="ff"><label>단위</label><input id="fUnit" value="kg"></div><div class="ff"><label>단가</label><input id="fUnitPrice" type="number" min="0" step="0.01" value="0"></div><div class="ff"><label>생산구분</label><select id="fProductionType"><option>D-양산</option><option>C-Pilot</option><option>B-Lab</option></select></div><div class="ff"><label>발주유형</label><select id="fPurchaseType"><option>정기발주</option><option>긴급발주</option><option>샘플발주</option></select></div><div class="ff"><label>우선순위</label><select id="fPriority"><option>일반</option><option>긴급</option></select></div><div class="ff"><label>입고창고</label><input id="fWarehouse" placeholder="수기입력"></div><div class="ff"><label>납품장소</label><input id="fDelivery" placeholder="수기입력"></div><div class="ff"><label>MRP 번호</label><input id="fMrp"></div><div class="ff"><label>작업지시번호</label><input id="fWork"></div><div class="ff full"><label>비고</label><textarea id="fNotes"></textarea></div></div><div class="savebar"><button class="cancel" id="cancelBtn" type="button">취소</button><button class="save" type="submit">발주 저장</button></div></form></section></div>
<div class="modal" id="detailModal"><section class="sheet"><header class="sheet-head"><div><strong id="detailTitle">구매발주 상세</strong><span id="detailSub">-</span></div><button class="close" id="detailClose" type="button">×</button></header><div class="detail" id="detailBody"></div></section></div>
<script>
(()=>{'use strict';const VERSION='20260904-purchase2',LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};let rows=[],pendingOnly=false;async function api(path,opt){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...(opt||{})});const p=await r.json().catch(()=>null);if(r.status===401){location.replace(LOGIN);throw new Error('AUTH')}if(!r.ok||p?.success===false)throw new Error(p?.message||`HTTP ${r.status}`);return p?.data!==undefined?p.data:p}function status(r){return clean(r.status||r.receiptStatus||r.receiving||'-')}function isPending(r){return !/입고완료|완료|취소/.test(`${status(r)} ${clean(r.receiptStatus)}`)}function tone(s){s=clean(s);if(/완료|합격/.test(s))return'green';if(/불합격|지연|취소/.test(s))return'red';return'orange'}function render(){const q=clean(document.getElementById('search').value).toLowerCase();const filtered=rows.filter(r=>(!pendingOnly||isPending(r))&&(!q||[r.purchaseNo,r.no,r.id,r.supplier,r.item,r.material,r.itemCode,r.materialCode].join(' ').toLowerCase().includes(q)));document.getElementById('allCount').textContent=rows.length;document.getElementById('totalQty').textContent=rows.reduce((s,r)=>s+num(r.qty),0).toLocaleString('ko-KR',{maximumFractionDigits:2});document.getElementById('pendingCount').textContent=rows.filter(isPending).length;document.getElementById('iqcCount').textContent=rows.filter(r=>/대기|미연결|미판정/.test(clean(r.iqcStatus||r.iqc))).length;const list=document.getElementById('list');if(!filtered.length){list.innerHTML='<div class="empty">표시할 구매발주가 없습니다.</div>';return}list.innerHTML=filtered.map((r,i)=>`<article class="card"><div class="card-head"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="title"><button type="button" data-id="${esc(r.purchaseNo||r.no||r.id)}">${esc(r.purchaseNo||r.no||r.id||'발주번호 없음')}</button><small>${esc(r.supplier||'-')} · ${esc(r.item||r.material||'-')}</small></div><span class="badge ${tone(status(r))}">${esc(status(r))}</span></div><div class="fields"><div class="field"><label>발주일</label><span>${esc(r.orderDate||r.date||'-')}</span></div><div class="field"><label>납기요청일</label><span>${esc(r.requestedDueDate||r.due||r.dueDate||'-')}</span></div><div class="field"><label>협력사</label><span>${esc(r.supplier||'-')}</span></div><div class="field"><label>품목</label><span>${esc(r.item||r.material||'-')}</span></div><div class="field"><label>수량</label><span>${num(r.qty).toLocaleString('ko-KR',{maximumFractionDigits:3})} ${esc(r.unit||'kg')}</span></div><div class="field"><label>입고</label><span>${num(r.receivedQty??r.received).toLocaleString('ko-KR',{maximumFractionDigits:3})} ${esc(r.unit||'kg')}</span></div><div class="field"><label>IQC</label><span>${esc(r.iqcStatus||r.iqc||'-')}</span></div><div class="field"><label>창고</label><span>${esc(r.warehouse||'-')}</span></div></div></article>`).join('');list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function openForm(){document.getElementById('purchaseForm').reset();const t=today();document.getElementById('fOrderDate').value=t;document.getElementById('fDue').value=t;document.getElementById('fUnit').value='kg';document.getElementById('fUnitPrice').value='0';document.getElementById('fProductionType').value='D-양산';document.getElementById('fPurchaseType').value='정기발주';document.getElementById('fPriority').value='일반';document.getElementById('formModal').classList.add('show')}async function save(e){e.preventDefault();const body={orderDate:document.getElementById('fOrderDate').value,requestedDueDate:document.getElementById('fDue').value,supplier:clean(document.getElementById('fSupplier').value),item:clean(document.getElementById('fItem').value),itemCode:clean(document.getElementById('fItemCode').value),spec:clean(document.getElementById('fSpec').value),qty:num(document.getElementById('fQty').value),unit:clean(document.getElementById('fUnit').value)||'kg',unitPrice:num(document.getElementById('fUnitPrice').value),productionType:document.getElementById('fProductionType').value,purchaseType:document.getElementById('fPurchaseType').value,priority:document.getElementById('fPriority').value,warehouse:clean(document.getElementById('fWarehouse').value),deliveryAddress:clean(document.getElementById('fDelivery').value),mrpNo:clean(document.getElementById('fMrp').value),workOrderNo:clean(document.getElementById('fWork').value),notes:clean(document.getElementById('fNotes').value),iqcRequired:true,coaRequired:true,lotRequired:true};if(!body.supplier||!body.item||body.qty<=0){alert('협력사, 품목, 발주수량을 확인하세요.');return}try{await api('/api/purchase-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('formModal').classList.remove('show');await load()}catch(e){if(e.message!=='AUTH')alert(e.message)}}async function openDetail(id){document.getElementById('detailModal').classList.add('show');document.getElementById('detailBody').innerHTML='<div class="empty">상세정보를 불러오는 중입니다.</div>';try{const r=await api(`/api/purchase-orders/${encodeURIComponent(id)}`);document.getElementById('detailTitle').textContent=`${r.purchaseNo||r.no||r.id||'발주'} 상세`;document.getElementById('detailSub').textContent=`${r.supplier||'-'} · ${r.item||r.material||'-'}`;const box=(l,v)=>`<div class="detail-box"><label>${esc(l)}</label><strong>${esc(v==null||v===''?'-':v)}</strong></div>`;const receipts=Array.isArray(r.receipts)?r.receipts:[];document.getElementById('detailBody').innerHTML=`<div class="detail-grid">${box('발주번호',r.purchaseNo||r.no||r.id)}${box('발주유형',r.purchaseType||r.type)}${box('생산구분',r.productionType)}${box('협력사',r.supplier)}${box('품목',r.item||r.material)}${box('품목코드',r.itemCode||r.materialCode)}${box('규격',r.spec)}${box('발주수량',`${num(r.qty).toLocaleString('ko-KR')} ${r.unit||'kg'}`)}${box('단가',num(r.unitPrice).toLocaleString('ko-KR'))}${box('금액',num(r.amount).toLocaleString('ko-KR'))}${box('발주일',r.orderDate||r.date)}${box('납기요청일',r.requestedDueDate||r.due)}${box('확정납기',r.confirmedDueDate||r.expected)}${box('우선순위',r.priority)}${box('MRP 번호',r.mrpNo||r.mrp)}${box('작업지시번호',r.workOrderNo||r.workOrder)}${box('입고창고',r.warehouse)}${box('납품장소',r.deliveryAddress||r.address)}${box('결재상태',r.approvalStatus||r.approval)}${box('입고상태',r.receiptStatus||r.receiving)}${box('입고수량',`${num(r.receivedQty??r.received).toLocaleString('ko-KR')} ${r.unit||'kg'}`)}${box('IQC 상태',r.iqcStatus||r.iqc)}${box('상태',r.status)}${box('비고',r.notes||r.note)}</div><section class="receipts"><h3>입고 · IQC 이력</h3>${receipts.length?receipts.map(x=>`<div class="receipt"><b>${esc(x.receiptDate||'-')} · ${num(x.qty).toLocaleString('ko-KR')} ${esc(r.unit||'kg')}</b><span>LOT ${esc(x.materialLot||'-')} · IQC ${esc(x.iqcStatus||'-')} · 검사번호 ${esc(x.inspectionNo||'-')}</span></div>`).join(''):'<div class="empty" style="margin:0;border:0">입고 이력이 없습니다.</div>'}</section>`}catch(e){document.getElementById('detailBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function load(){const sync=document.getElementById('sync');sync.className='sync loading';sync.querySelector('span').textContent='조회 중';try{const data=await api('/api/purchase-orders');rows=Array.isArray(data)?data:[];render();sync.className='sync';sync.querySelector('span').textContent='PC DB 연동'}catch(e){if(e.message==='AUTH')return;rows=[];render();sync.className='sync error';sync.querySelector('span').textContent='연결 실패';const m=document.getElementById('message');m.textContent=e.message;m.className='message show error'}}document.getElementById('backBtn').onclick=()=>location.assign(`/mobile.html?v=${VERSION}`);document.getElementById('refreshBtn').onclick=load;document.getElementById('newBtn').onclick=openForm;document.getElementById('formClose').onclick=()=>document.getElementById('formModal').classList.remove('show');document.getElementById('cancelBtn').onclick=()=>document.getElementById('formModal').classList.remove('show');document.getElementById('purchaseForm').onsubmit=save;document.getElementById('detailClose').onclick=()=>document.getElementById('detailModal').classList.remove('show');document.getElementById('search').oninput=render;document.getElementById('filterBtn').onclick=e=>{pendingOnly=!pendingOnly;e.currentTarget.textContent=pendingOnly?'미입고만':'전체';render()};document.getElementById('pendingBtn').onclick=()=>{pendingOnly=true;document.getElementById('filterBtn').textContent='미입고만';render()};load()})();
</script>
