<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나모케미칼 QMES · 재고 3단계 적용본</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020617;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#020617}
  </style>
</head>
<body>
  <iframe id="qmes" src="./index.html" title="나모케미칼 QMES"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('qmes');
      frame.addEventListener('load',()=>{
        try{
          const doc=frame.contentDocument;
          if(!doc)return;
          if(doc.querySelector('script[data-qmes-inventory-stage3-entry]'))return;
          const script=doc.createElement('script');
          script.src='./js/qmes-inventory-stage3-loader-20260807.js?v=20260807-1';
          script.async=false;
          script.dataset.qmesInventoryStage3Entry='true';
          script.onload=()=>console.info('[QMES] 재고 3단계 적용 완료');
          script.onerror=()=>console.error('[QMES] 재고 3단계 로드 실패');
          doc.head.appendChild(script);
        }catch(error){
          console.error('[QMES] 재고 3단계 적용 실패',error);
        }
      });
    })();
  </script>
</body>
</html>
