<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>NAMO QMES Mobile Login</title>
  <style>
    :root{color-scheme:light;--ink:#142e44;--muted:#728497;--line:#d8e2e9;--blue:#0d5eb8;--bg:#f4f7f9;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}body{min-height:100dvh}.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));background:linear-gradient(180deg,#f7f9fb 0%,#eef4f7 100%)}.card{width:min(100%,430px);padding:28px 22px 24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 46px rgba(26,56,80,.10)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px}.brand img{width:58px;height:42px;object-fit:contain}.brand strong{display:block;font-size:22px;font-weight:950;letter-spacing:-.04em}.brand span{display:block;margin-top:3px;color:#8795a3;font-size:9px;font-weight:850;letter-spacing:.06em}.title{margin:0 0 5px;text-align:center;font-size:18px;font-weight:950;letter-spacing:-.035em}.desc{margin:0 0 22px;text-align:center;color:var(--muted);font-size:10px;font-weight:750;line-height:1.55}.field{display:block;margin-top:13px}.field span{display:block;margin-bottom:6px;color:#455c70;font-size:10px;font-weight:900}.field input{width:100%;height:48px;padding:0 12px;border:1px solid #cbd8e1;border-radius:10px;background:#fff;color:#173047;font-size:16px;outline:0}.field input:focus{border-color:#6aa8d2;box-shadow:0 0 0 3px rgba(31,119,180,.08)}.error{display:none;margin-top:12px;padding:10px 11px;border:1px solid #ecd0d5;border-radius:9px;background:#fff7f8;color:#a23443;font-size:9px;font-weight:850;line-height:1.5}.error.show{display:block}.primary,.secondary{width:100%;height:49px;margin-top:18px;border:0;border-radius:10px;font-size:14px;font-weight:950;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{margin-top:8px;background:#eef3f6;color:#51687a}.primary:disabled{opacity:.65;cursor:wait}.foot{margin-top:16px;text-align:center;color:#8b98a5;font-size:8.5px;font-weight:750;line-height:1.55}.hidden{display:none!important}@media(min-width:700px){.card{padding:34px 34px 30px}.brand img{width:68px;height:48px}.brand strong{font-size:25px}.title{font-size:21px}.field span{font-size:11px}.desc{font-size:11px}}
  </style>
</head>
<body>
<div class="page">
  <main class="card">
    <div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260903-mobile-login1" alt="NAMO"><div><strong>NAMO QMES</strong><span>MOBILE · iPad</span></div></div>
    <section id="loginPanel">
      <h1 class="title">로그인</h1>
      <p class="desc">모바일/iPad 전용 로그인 화면입니다.</p>
      <form id="loginForm" method="post" action="/api/auth/login">
        <label class="field"><span>아이디 또는 사번</span><input name="loginId" autocomplete="username" placeholder="아이디 또는 사번" required></label>
        <label class="field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required></label>
        <div class="error" id="loginError"></div>
        <button class="primary" id="loginBtn" type="submit">로그인</button>
      </form>
      <div class="foot">로그인 후 모바일 QMES 업무 메뉴로 이동합니다.</div>
    </section>
    <section id="passwordPanel" class="hidden">
      <h1 class="title">초기 비밀번호 변경</h1>
      <p class="desc" id="passwordDesc">안전한 사용을 위해 새 비밀번호를 설정해 주세요.</p>
      <form id="passwordForm" method="post" action="/api/auth/password">
        <label class="field"><span>현재 비밀번호</span><input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label class="field"><span>새 비밀번호</span><input name="newPassword" type="password" autocomplete="new-password" minlength="4" required></label>
        <label class="field"><span>새 비밀번호 확인</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="4" required></label>
        <div class="error" id="passwordError"></div>
        <button class="primary" id="passwordBtn" type="submit">비밀번호 변경</button>
        <button class="secondary" id="passwordLogout" type="button">로그아웃</button>
      </form>
    </section>
  </main>
</div>
<script>
(function(){
  "use strict";
  var HOME="/mobile.html?v=20260921-pad-login-es5";
  var currentUser=null;
  var loginPanel=document.getElementById("loginPanel");
  var passwordPanel=document.getElementById("passwordPanel");

  function showError(id,text){
    var el=document.getElementById(id);
    if(!el)return;
    el.textContent=text||"";
    if(text)el.className="error show";
    else el.className="error";
  }
  function setBusy(id,busy,text){
    var btn=document.getElementById(id);
    if(!btn)return;
    btn.disabled=!!busy;
    if(text)btn.textContent=text;
  }
  function normalizeUser(user){
    user=user||{};
    return {
      id:user.id||"",
      uid:user.uid||"",
      name:user.name||"",
      email:user.email||"",
      department:user.department||user.dept||"",
      title:user.title||user.position||"",
      role:user.role||"user",
      mustChangePassword:!!user.mustChangePassword
    };
  }
  function goHome(){window.location.replace(HOME);}
  function showPassword(user){
    currentUser=normalizeUser(user);
    loginPanel.className="hidden";
    passwordPanel.className="";
    document.getElementById("passwordDesc").textContent=(currentUser.name||"사용자")+"님, 안전한 사용을 위해 새 비밀번호를 설정해 주세요.";
  }
  function request(method,url,payload,done){
    var xhr=new XMLHttpRequest();
    xhr.open(method,url,true);
    xhr.withCredentials=true;
    xhr.setRequestHeader("Accept","application/json");
    if(payload!==null)xhr.setRequestHeader("Content-Type","application/json;charset=UTF-8");
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;
      var body=null;
      try{body=JSON.parse(xhr.responseText||"{}");}catch(_e){body=null;}
      done(xhr.status,body);
    };
    xhr.onerror=function(){done(0,null);};
    xhr.send(payload===null?null:JSON.stringify(payload));
  }
  function responseUser(p){
    if(!p)return null;
    if(p.data&&p.data.user)return p.data.user;
    if(p.data&&p.data.name)return p.data;
    if(p.user)return p.user;
    return null;
  }
  function checkSession(){
    request("GET","/api/auth/me",null,function(status,p){
      if(status<200||status>=300||!p||p.success===false)return;
      var user=responseUser(p);
      if(!user||!user.name)return;
      if(user.mustChangePassword)showPassword(user);
      else goHome();
    });
  }

  var loginForm=document.getElementById("loginForm");
  loginForm.onsubmit=function(event){
    if(event&&event.preventDefault)event.preventDefault();
    showError("loginError","");
    var loginInput=loginForm.elements["loginId"];
    var passwordInput=loginForm.elements["password"];
    var loginId=String(loginInput&&loginInput.value||"").replace(/^\s+|\s+$/g,"");
    var password=String(passwordInput&&passwordInput.value||"");
    if(!loginId||!password){
      showError("loginError","아이디와 비밀번호를 입력해 주세요.");
      return false;
    }
    setBusy("loginBtn",true,"로그인 확인 중...");
    request("POST","/api/auth/login",{loginId:loginId,password:password},function(status,p){
      setBusy("loginBtn",false,"로그인");
      var user=responseUser(p);
      if(status>=200&&status<300&&p&&p.success&&user){
        if(user.mustChangePassword){
          showPassword(user);
          loginForm.reset();
        }else{
          goHome();
        }
        return;
      }
      showError("loginError",(p&&p.message)||"로그인에 실패했습니다.");
    });
    return false;
  };

  var passwordForm=document.getElementById("passwordForm");
  passwordForm.onsubmit=function(event){
    if(event&&event.preventDefault)event.preventDefault();
    showError("passwordError","");
    var currentPassword=String(passwordForm.elements["currentPassword"].value||"");
    var newPassword=String(passwordForm.elements["newPassword"].value||"");
    var confirmPassword=String(passwordForm.elements["confirmPassword"].value||"");
    if(newPassword.length<4){
      showError("passwordError","새 비밀번호는 4자 이상 입력해 주세요.");
      return false;
    }
    if(newPassword!==confirmPassword){
      showError("passwordError","새 비밀번호 확인이 일치하지 않습니다.");
      return false;
    }
    setBusy("passwordBtn",true,"변경 중...");
    request("PUT","/api/auth/password",{currentPassword:currentPassword,newPassword:newPassword},function(status,p){
      setBusy("passwordBtn",false,"비밀번호 변경");
      if(status>=200&&status<300&&p&&p.success){
        goHome();
        return;
      }
      showError("passwordError",(p&&p.message)||"비밀번호 변경에 실패했습니다.");
    });
    return false;
  };

  document.getElementById("passwordLogout").onclick=function(){
    request("POST","/api/auth/logout",{},function(){
      window.location.replace("/mobile-login.html?logout=1");
    });
  };

  try{
    if(window.history&&window.history.replaceState&&(/[?&](loginId|password)=/i.test(window.location.search))){
      window.history.replaceState(null,document.title,"/mobile-login.html?v=20260921-pad-login-es5");
    }
  }catch(_e){}
  checkSession();
})();
</script>
</body>
</html>
