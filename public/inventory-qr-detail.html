<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#0f5d8f" />
  <title>나모케미칼 입출고 상세</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,'Noto Sans KR',sans-serif;background:#eef3f8;color:#101828}
    body{padding:18px 14px 30px}
    .page{width:min(760px,100%);margin:0 auto}
    .card{overflow:hidden;border:1px solid #d0d5dd;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(15,23,42,.12)}
    .head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 22px 18px;border-bottom:1px solid #e4e7ec}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .brand img{display:block;width:auto;height:38px;max-width:230px;object-fit:contain;object-position:left center}
    .brand-copy{min-width:0}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#0575b8}
    h1{margin:5px 0 0;font-size:24px;line-height:1.2}
    .readonly{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:#e8f8f0;color:#067647;font-size:11px;font-weight:900}
    .status{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 20px 0;padding:14px 16px;border:1px solid #86efc0;border-radius:12px;background:#ecfdf3}
    .status b{color:#067647;font-size:14px}
    .status span{color:#475467;font-size:13px;text-align:right}
    .grid{display:grid;grid-template-columns:1fr 1fr;margin:20px;border-top:1px solid #dbe2ea;border-left:1px solid #dbe2ea;border-radius:12px;overflow:hidden}
    .field{min-height:86px;padding:15px 16px;border-right:1px solid #dbe2ea;border-bottom:1px solid #dbe2ea;background:#f8fafc}
    .field.wide{grid-column:1/-1;min-height:76px}
    .field small{display:block;margin-bottom:8px;color:#667085;font-size:12px;font-weight:800}
    .field strong{display:block;font-size:18px;line-height:1.35;overflow-wrap:anywhere}
    .notice{margin:0 20px 20px;padding:14px 16px;border-radius:12px;background:#f2f4f7;color:#475467;font-size:12px;line-height:1.6}
    .error{display:none;margin:20px;padding:18px;border:1px solid #fda29b;border-radius:12px;background:#fef3f2;color:#b42318;font-weight:800;line-height:1.6}
    .footer{padding:0 20px 22px;color:#667085;font-size:11px;text-align:center}
    @media(max-width:560px){
      body{padding:0;background:#fff}
      .page{width:100%}
      .card{min-height:100vh;border:0;border-radius:0;box-shadow:none}
      .head{padding:18px 16px 15px}
      .brand img{height:31px;max-width:180px}
      h1{font-size:20px}
      .readonly{padding:6px 8px;font-size:10px}
      .status{margin:16px 14px 0;padding:12px 13px}
      .grid{margin:16px 14px;grid-template-columns:1fr 1fr}
      .field{min-height:77px;padding:13px 12px}
      .field small{font-size:11px;margin-bottom:6px}
      .field strong{font-size:16px}
      .notice{margin:0 14px 16px}
      .footer{padding:0 14px 18px}
    }
    @media(max-width:380px){
      .grid{grid-template-columns:1fr}
      .field.wide{grid-column:auto}
      .brand-copy .eyebrow{font-size:9px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="head">
        <div class="brand">
          <img src="https://namochemical.com/img/svg/img_logo.svg" alt="NAMO Chemical" onerror="this.onerror=null;this.src='/assets/namo-header-logo.svg'" />
          <div class="brand-copy">
            <div class="eyebrow">INVENTORY TRANSACTION</div>
            <h1>입출고 처리 상세</h1>
          </div>
        </div>
        <div class="readonly">읽기 전용</div>
      </header>

      <div class="status">
        <b>처리 완료</b>
        <span id="processedAt">-</span>
      </div>

      <div id="detailGrid" class="grid" aria-live="polite"></div>
      <div id="errorBox" class="error"></div>

      <div class="notice">
        이 화면은 부착된 QR 라벨에 저장된 입출고 정보를 보여주는 읽기 전용 화면입니다. 수정·삭제 기능은 제공하지 않습니다.
      </div>
      <div class="footer">NAMO Chemical QMES · QR 용기 추적</div>
    </section>
  </main>

  <script>
    (function(){
      'use strict';
      const grid=document.getElementById('detailGrid');
      const errorBox=document.getElementById('errorBox');
      const processedAt=document.getElementById('processedAt');
      const clean=value=>String(value==null?'':value).trim()||'-';

      function decodePayload(){
        const raw=location.hash.replace(/^#/, '');
        const encoded=raw.startsWith('d=')?raw.slice(2):raw;
        if(!encoded)throw new Error('QR 상세정보가 없습니다. QR을 다시 스캔해 주세요.');
        const normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');
        const padded=normalized+'='.repeat((4-normalized.length%4)%4);
        const binary=atob(padded);
        const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
        const data=JSON.parse(new TextDecoder().decode(bytes));
        if(!data||data.v!==1)throw new Error('지원하지 않는 QR 형식입니다. QR 라벨을 다시 발행해 주세요.');
        return data;
      }

      function field(label,value,wide){
        const div=document.createElement('div');
        div.className='field'+(wide?' wide':'');
        const small=document.createElement('small');
        const strong=document.createElement('strong');
        small.textContent=label;
        strong.textContent=clean(value);
        div.append(small,strong);
        return div;
      }

      try{
        const data=decodePayload();
        processedAt.textContent=clean(data.at);
        const packageNumber=data.total>1?`${clean(data.n)} / ${clean(data.total)}`:`${clean(data.n)} / ${clean(data.total||1)}`;
        [
          ['원료명',data.m,false],
          ['구분',data.t,false],
          ['LOT',data.l,false],
          ['포장형태',data.p,false],
          ['입고일자',data.rd,false],
          ['검사일자',data.id,false],
          ['총 수량',data.q,false],
          ['입고 포장수량',data.pc,false],
          ['용기번호',packageNumber,false],
          ['보관 위치',data.loc,false],
          ['이동 방향',data.d,true],
          ['비고',data.r,true]
        ].forEach(item=>grid.appendChild(field(item[0],item[1],item[2])));
      }catch(error){
        grid.style.display='none';
        errorBox.style.display='block';
        errorBox.textContent=error&&error.message?error.message:'QR 상세정보를 표시할 수 없습니다.';
      }
    })();
  </script>
</body>
</html>
