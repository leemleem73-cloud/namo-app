<!doctype html>
<html lang="ko" data-attendance-ui="v5">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9fd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="나모케미칼 출퇴근">
  <title>나모케미칼 출퇴근</title>
  <link rel="manifest" href="/attendance-manifest.webmanifest">
  <link rel="icon" href="/attendance-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/attendance-v5.css?v=20260918-v5-37">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button class="header-btn" id="menuBtn" aria-label="메뉴">☰</button>
      <div class="header-title">나모케미칼 출퇴근</div>
      <button class="header-btn bell-btn" id="noticeBtn" aria-label="알림"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notice-dot" id="noticeDot"></span></button>
    </header>

    <main>
      <section class="view active" data-view="home">
        <div id="homeRoot"></div>
      </section>

      <section class="view" data-view="records">
        <div class="page-head">
          <div>
            <h1>근무내역</h1>
            <p>실제 출퇴근 기록을 확인합니다.</p>
          </div>
          <input type="month" id="recordsMonth">
        </div>
        <div id="recordsRoot"></div>
      </section>

      <section class="view" data-view="requests">
        <div class="page-head">
          <div>
            <h1>신청</h1>
            <p>휴가와 근태 관련 요청을 등록합니다.</p>
          </div>
        </div>
        <div id="requestsRoot"></div>
      </section>

      <section class="view" data-view="leave">
        <div class="page-head">
          <div>
            <h1>휴가현황</h1>
            <p>전체 직원 휴가 현황을 확인합니다.</p>
          </div>
        </div>
        <div id="leaveRoot"></div>
      </section>

      <section class="view" data-view="profile">
        <div class="page-head">
          <div>
            <h1>내정보</h1>
            <p>계정과 근무 정보를 확인합니다.</p>
          </div>
        </div>
        <div id="profileRoot"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home"><span class="nav-ico">⌂</span><span>홈</span></button>
      <button class="nav-btn" data-nav="records"><span class="nav-ico">▣</span><span>근무내역</span></button>
      <button class="nav-btn" data-nav="requests"><span class="nav-ico">▤</span><span>신청</span></button>
      <button class="nav-btn" data-nav="profile"><span class="nav-ico">♙</span><span>내정보</span></button>
    </nav>
  </div>

  <div class="sheet" id="detailSheet" aria-hidden="true">
    <div class="sheet-panel detail-panel">
      <header class="detail-header">
        <button class="detail-back" id="detailBack" aria-label="뒤로">←</button>
        <div>근무 상세내역</div>
        <div></div>
      </header>
      <div id="detailRoot"></div>
    </div>
  </div>

  <div class="sheet" id="noticeSheet" aria-hidden="true">
    <div class="sheet-panel compact-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <h2>알림</h2>
        <button class="text-btn" id="noticeClose">닫기</button>
      </div>
      <div id="noticeRoot"></div>
    </div>
  </div>

  <div class="sheet" id="workplaceSheet" aria-hidden="true">
    <div class="sheet-panel compact-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <h2>근무지 변경</h2>
        <button class="text-btn" id="workplaceClose">닫기</button>
      </div>
      <div class="workplace-note" id="workplaceNote">출근 전에 근무지를 선택해 주세요.</div>
      <div id="workplaceRoot" class="workplace-list"></div>
    </div>
  </div>

  <div class="sheet" id="leaveDetailSheet" aria-hidden="true">
    <div class="sheet-panel detail-panel">
      <header class="detail-header">
        <button class="detail-back" id="leaveDetailBack" aria-label="뒤로">←</button>
        <div>신청 상세</div>
        <div></div>
      </header>
      <div id="leaveDetailRoot"></div>
    </div>
  </div>

  <div class="sheet" id="distributionSheet" aria-hidden="true">
    <div class="sheet-panel compact-panel distribution-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <h2>사내 배포</h2>
        <button class="text-btn" id="distributionClose">닫기</button>
      </div>
      <div class="distribution-note">최종 승인 내용을 PDF로 작성하여 배포할 사내 직원을 선택합니다.</div>
      <input type="search" id="distributionSearch" class="distribution-search" placeholder="직원명 또는 부서명으로 검색">
      <div class="distribution-toolbar">
        <label><input type="checkbox" id="distributionAll"> 전체 선택</label>
        <span id="distributionCount">0명 선택</span>
      </div>
      <div id="distributionRoot" class="distribution-list"></div>
      <button type="button" id="distributionSendBtn" class="primary-btn">승인 PDF 작성 후 배포</button>
    </div>
  </div>

  <div class="sheet" id="requestSheet" aria-hidden="true">
    <div class="sheet-panel compact-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <h2 id="requestSheetTitle">신청하기</h2>
        <button class="text-btn" id="requestClose">닫기</button>
      </div>
      <form id="requestForm" class="request-form">
        <label>유형
          <select id="requestType">
            <option value="annual">연차</option>
            <option value="am_half">오전 반차</option>
            <option value="pm_half">오후 반차</option>
            <option value="sick">병가</option>
            <option value="bereavement">경조휴가</option>
            <option value="outside">외근/출장</option>
            <option value="overtime">연장근무</option>
          </select>
        </label>
        <label>검토자
          <select id="requestReviewer" required>
            <option value="">검토자를 선택해 주세요.</option>
          </select>
          <span class="request-help" id="requestReviewerHelp">연차/근태 신청 전 검토자를 선택합니다.</span>
        </label>
        <div class="form-grid">
          <label>시작일<input type="date" id="requestStart" required></label>
          <label>종료일<input type="date" id="requestEnd" required></label>
        </div>
        <label>사유<textarea id="requestReason" rows="4" placeholder="신청 사유를 입력하세요."></textarea></label>
        <button type="submit" class="primary-btn">신청하기</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/attendance-v5.js?v=20260918-v5-37"></script>
</body>
</html>
