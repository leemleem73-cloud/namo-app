<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/assets/namo-mobile-logo.svg?v=20260904-spc1" type="image/svg+xml" />
  <title>NAMO QMES Mobile SPC</title>
  <style>
    :root{color-scheme:light;--ink:#142d42;--muted:#768698;--line:#dce4eb;--bg:#f5f7f9;--blue:#176da1;--green:#27834d;--orange:#a96d0b;--red:#b63d4b;--safe-top:env(safe-area-inset-top);--safe-bottom:max(12px,env(safe-area-inset-bottom))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.app{width:min(100%,760px);min-height:100dvh;margin:0 auto;padding-bottom:calc(22px + var(--safe-bottom));background:var(--bg)}
    .head{position:sticky;top:0;z-index:50;height:calc(64px + var(--safe-top));padding:var(--safe-top) 10px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.985);backdrop-filter:blur(16px)}.back,.refresh{height:38px;border:1px solid #d6e0e7;border-radius:9px;background:#fff;color:#355169;font-size:9px;font-weight:950;cursor:pointer}.back{width:42px;font-size:18px}.refresh{padding:0 10px}.brand{min-width:0;flex:1;display:flex;align-items:center;gap:8px}.brand img{width:45px;height:31px;object-fit:contain}.brand small{display:block;color:#84919e;font-size:7px;font-weight:850;letter-spacing:.08em}.brand strong{display:block;margin-top:2px;color:#102b43;font-size:14px;font-weight:950;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hero{padding:16px 12px 13px;border-bottom:1px solid #e7edf1;background:#fff}.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero h1{margin:0;color:#102840;font-size:22px;font-weight:950;letter-spacing:-.045em}.hero p{margin:5px 0 0;color:#738396;font-size:9px;font-weight:750;line-height:1.5}.live{flex:none;display:inline-flex;align-items:center;gap:5px;margin-top:3px;padding:6px 8px;border:1px solid #cae4d3;border-radius:999px;background:#f4fbf6;color:#34794e;font-size:7px;font-weight:900}.live i{width:6px;height:6px;border-radius:50%;background:#43ad68}.live.loading{border-color:#eadcaf;background:#fffaf0;color:#84691f}.live.loading i{background:#d29a2e}.live.error{border-color:#ecd1d5;background:#fff8f9;color:#9c3d49}.live.error i{background:#c95462}
    .selectors{display:flex;gap:7px;padding:10px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid #e7edf1}.selectors::-webkit-scrollbar{display:none}.metric{flex:0 0 auto;min-width:105px;padding:9px 10px;border:1px solid #dce4eb;border-radius:10px;background:#fff;color:#29465e;text-align:left;cursor:pointer}.metric strong{display:block;font-size:9.5px;font-weight:950}.metric small{display:block;margin-top:4px;color:#82909d;font-size:7px;font-weight:750;white-space:nowrap}.metric.active{border-color:#2f7dab;background:#edf6fb;color:#0f5f92;box-shadow:inset 0 0 0 1px #9ac5df}.metric.active small{color:#337aa4}
    .content{padding:10px}.spec-card{padding:11px 12px;border:1px solid #dce4eb;border-radius:12px;background:#fff}.spec-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.spec-top span{display:block;color:#84929f;font-size:7.5px;font-weight:850}.spec-top strong{display:block;margin-top:4px;color:#19354d;font-size:14px;font-weight:950}.stage{flex:none;padding:5px 7px;border-radius:6px;background:#eef5f9;color:#356982;font-size:7px;font-weight:900}.method{margin-top:8px;color:#768698;font-size:8px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.stat{min-width:0;padding:11px;border:1px solid #dfe6eb;border-radius:11px;background:#fff}.stat span{display:block;color:#84919e;font-size:7.6px;font-weight:850}.stat strong{display:block;margin-top:5px;color:#173249;font-size:19px;font-weight:950;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.stat strong small{margin-left:3px;color:#7b8996;font-size:8px}.stat.wide{grid-column:1/-1}.grade{display:flex;align-items:center;justify-content:space-between;gap:10px}.grade b{font-size:12px;font-weight:950}.grade .pill{padding:6px 9px;border-radius:999px;background:#eef2f5;color:#536577;font-size:8px;font-weight:950}.grade .pill.green{background:#e8f7ec;color:#247847}.grade .pill.blue{background:#e8f2fb;color:#176595}.grade .pill.orange{background:#fff2dc;color:#9d6406}.grade .pill.red{background:#fde8eb;color:#a83240}
    .panel{margin-top:9px;border:1px solid #dce4eb;border-radius:12px;background:#fff;overflow:hidden}.panel-head{padding:10px 11px;border-bottom:1px solid #edf1f4;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h2{margin:0;color:#213b52;font-size:10.5px;font-weight:950}.panel-head span{color:#8895a1;font-size:7px;font-weight:800}.chart-wrap{padding:8px 7px 4px;overflow:hidden}.chart{display:block;width:100%;height:240px}.chart text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#798895;font-size:8px}.chart .grid{stroke:#e8edf1;stroke-width:1}.chart .axis{stroke:#cbd5dc;stroke-width:1}.chart .line{fill:none;stroke:#2478aa;stroke-width:2}.chart .mean{stroke:#d28b22;stroke-width:1.3;stroke-dasharray:5 4}.chart .spec{stroke:#bd4a58;stroke-width:1.3;stroke-dasharray:4 4}.chart .dot{fill:#2478aa;stroke:#fff;stroke-width:1.5}.chart .dot.out{fill:#c64b59}.legend{display:flex;flex-wrap:wrap;gap:9px;padding:0 11px 11px;color:#7a8996;font-size:7px;font-weight:800}.legend i{display:inline-block;width:13px;height:2px;margin-right:4px;vertical-align:middle;background:#2478aa}.legend i.spec{background:#bd4a58}.legend i.mean{background:#d28b22}
    .table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid #eef2f4;text-align:left;font-size:7.8px}.table th{background:#f8fafb;color:#718193;font-weight:900;white-space:nowrap}.table td{color:#334d63;font-weight:750}.table td.num{text-align:right;font-variant-numeric:tabular-nums}.table tr:last-child td{border-bottom:0}.table .ng{color:#aa3442;font-weight:950}.empty{padding:30px 14px;text-align:center;color:#82909d;font-size:9px;font-weight:750;line-height:1.6}.message{display:none;margin-top:9px;padding:10px 11px;border:1px solid #e4d7b9;border-radius:10px;background:#fffaf2;color:#795f24;font-size:8.3px;font-weight:800;line-height:1.55}.message.show{display:block}.message.error{border-color:#edd0d5;background:#fff8f9;color:#9c3b48}
    @media(min-width:700px){.head{height:calc(74px + var(--safe-top));padding-left:18px;padding-right:18px}.brand img{width:58px;height:40px}.brand strong{font-size:17px}.hero{padding:21px 20px 16px}.hero h1{font-size:28px}.selectors{padding-left:20px;padding-right:20px}.content{padding:14px 20px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.stat.wide{grid-column:auto}.chart{height:300px}}
  </style>
</head>
<body>
<div class="app">
  <header class="head">
    <button class="back" id="backBtn" type="button" aria-label="모바일 메뉴로 돌아가기">‹</button>
    <div class="brand"><img src="/assets/namo-mobile-logo.svg?v=20260904-spc1" alt="NAMO"><div><small>NAMO CHEMICAL · MOBILE QMES</small><strong>SPC · Cpk</strong></div></div>
    <button class="refresh" id="refreshBtn" type="button">새로고침</button>
  </header>
  <section class="hero"><div class="hero-row"><div><h1>SPC 대시보드</h1><p>PQC · OQC 실제 측정값 기준 공정능력 분석</p></div><div class="live loading" id="liveState"><i></i><span>조회 중</span></div></div></section>
  <nav class="selectors" id="selectors" aria-label="SPC 품질특성"></nav>
  <main class="content">
    <section class="spec-card"><div class="spec-top"><div><span>관리 규격</span><strong id="specText">-</strong></div><div class="stage" id="stageText">-</div></div><div class="method" id="methodText">측정방법: -</div></section>
    <div class="stats">
      <article class="stat"><span>평균 (x̄)</span><strong id="meanValue">—</strong></article>
      <article class="stat"><span>표준편차 (σ)</span><strong id="sdValue">—</strong></article>
      <article class="stat"><span>Cp</span><strong id="cpValue">—</strong></article>
      <article class="stat"><span>Cpk</span><strong id="cpkValue">—</strong></article>
      <article class="stat wide"><span>공정능력 판정</span><div class="grade"><b id="sampleCount">측정 0개</b><span class="pill" id="gradePill">데이터 없음</span></div></article>
    </div>
    <div class="message" id="message"></div>
    <section class="panel"><div class="panel-head"><h2>측정값 추이</h2><span id="chartMeta">최근 측정값</span></div><div class="chart-wrap" id="chartWrap"></div><div class="legend"><span><i></i>측정값</span><span><i class="mean"></i>평균</span><span><i class="spec"></i>USL / LSL</span></div></section>
    <section class="panel"><div class="panel-head"><h2>최근 측정 이력</h2><span id="historyMeta">0건</span></div><div id="history"></div></section>
  </main>
</div>
<script>
(()=>{
  'use strict';
  const VERSION='20260904-spc1';
  const LOGIN=`/mobile-login.html?mobile=1&v=${VERSION}`;
  const CONFIG={
    '입도':{aliases:['입도','입도(Dmax)'],spec:'Dmax ≤ 10 µm',lsl:null,usl:10,target:null,unit:'µm',method:'입도분석기',stage:'PQC / OQC'},
    '점도':{aliases:['점도'],spec:'1,500 ± 300 cP',lsl:1200,usl:1800,target:1500,unit:'cP',method:'점도계',stage:'PQC / OQC'},
    '고형분':{aliases:['고형분'],spec:'20.0 ± 1.0 wt%',lsl:19,usl:21,target:20,unit:'wt%',method:'Drying Oven',stage:'PQC / OQC'},
    '접착력':{aliases:['접착력'],spec:'≥ 0.4 kgf',lsl:0.4,usl:null,target:null,unit:'kgf',method:'인장시험기',stage:'OQC',normalize:v=>Math.abs(v)>=50?v/1000:v},
    '수분율':{aliases:['수분','수분율'],spec:'< 2,000 ppm',lsl:null,usl:2000,target:null,unit:'ppm',method:'수분측정기',stage:'OQC'},
    '절연저항':{aliases:['절연저항'],spec:'≥ 200 MΩ',lsl:200,usl:null,target:null,unit:'MΩ',method:'절연저항계',stage:'OQC'},
    '전해액 팽윤성':{aliases:['전해액 팽윤성','팽윤성'],spec:'< 120%',lsl:null,usl:120,target:null,unit:'%',method:'팽윤성 시험',stage:'OQC'}
  };
  const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
  const esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=v=>{const s=clean(v).replace(/,/g,'');if(!s||/overflow/i.test(s))return null;const m=s.match(/[-+]?\d+(?:\.\d+)?/);if(!m)return null;const n=Number(m[0]);return Number.isFinite(n)?n:null};
  const fmt=(v,d=2)=>v==null||Number.isNaN(v)?'—':!Number.isFinite(v)?'∞':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
  const recordPayload=record=>{const value=record?.payload;if(value&&typeof value==='object')return value;if(typeof value==='string'){try{return JSON.parse(value)}catch(_){}}return{}};
  async function api(path){const response=await fetch(path,{credentials:'same-origin',cache:'no-store'});const payload=await response.json().catch(()=>null);if(response.status===401){location.replace(LOGIN);throw new Error('AUTH')}if(!response.ok||payload?.success===false)throw new Error(payload?.message||`HTTP ${response.status}`);return payload?.data!==undefined?payload.data:payload}
  function sameItem(check,cfg){const s=clean(check).replace(/\s/g,'').toLowerCase();return cfg.aliases.some(alias=>{const a=alias.replace(/\s/g,'').toLowerCase();return s===a||s.includes(a)||a.includes(s)})}
  function measurementValues(row){if(Array.isArray(row?.measurements))return row.measurements;const parts=clean(row?.value).split('/').map(v=>v.trim()).filter(Boolean);if(parts.length)return parts;return [row?.value1,row?.value2,row?.value3].filter(v=>clean(v)!=='')}
  function flatten(records,source){const out=[];(Array.isArray(records)?records:[]).forEach(record=>{const payload=recordPayload(record);if(payload.deleted)return;(Array.isArray(payload.rows)?payload.rows:[]).forEach(row=>{out.push({...row,_source:source,_updated:record.updated_at||record.updatedAt||payload.savedAt||''})})});return out}
  function normalizeValue(raw,cfg){const n=num(raw);if(n==null)return null;return typeof cfg.normalize==='function'?cfg.normalize(n):n}
  function dateOf(row){return clean(row.date||row.shipDate||row.inspectedAt||row._updated).slice(0,10)||'-'}
  function gradeOf(cpk){if(cpk==null||Number.isNaN(cpk))return{label:'데이터 없음',tone:''};if(cpk>=1.67)return{label:'우수 (≥1.67)',tone:'green'};if(cpk>=1.33)return{label:'적합 (≥1.33)',tone:'blue'};if(cpk>=1.0)return{label:'개선 필요 (<1.33)',tone:'orange'};return{label:'부적합 (<1.00)',tone:'red'}}
  function stats(values,cfg){if(values.length<2)return null;const mean=values.reduce((a,b)=>a+b,0)/values.length;const sd=Math.sqrt(values.reduce((sum,v)=>sum+(v-mean)**2,0)/(values.length-1));if(!Number.isFinite(sd))return null;const cp=cfg.lsl!=null&&cfg.usl!=null?(sd===0?Infinity:(cfg.usl-cfg.lsl)/(6*sd)):null;const cpu=cfg.usl!=null?(sd===0?(mean<=cfg.usl?Infinity:-Infinity):(cfg.usl-mean)/(3*sd)):null;const cpl=cfg.lsl!=null?(sd===0?(mean>=cfg.lsl?Infinity:-Infinity):(mean-cfg.lsl)/(3*sd)):null;const sides=[cpu,cpl].filter(v=>v!=null);const cpk=sides.length?Math.min(...sides):null;return{mean,sd,cp,cpk,n:values.length}}
  function outOfSpec(v,cfg){return(cfg.lsl!=null&&v<cfg.lsl)||(cfg.usl!=null&&v>cfg.usl)}
  const state={rows:[],selected:'입도'};
  const selectors=document.getElementById('selectors'),message=document.getElementById('message'),liveState=document.getElementById('liveState');
  function setLive(mode,text){liveState.className=`live ${mode||''}`.trim();liveState.querySelector('span').textContent=text}
  function setMessage(text,type=''){message.textContent=text||'';message.className=`message${text?' show':''}${type?` ${type}`:''}`}
  function renderSelectors(){selectors.innerHTML=Object.entries(CONFIG).map(([key,cfg])=>`<button type="button" class="metric ${key===state.selected?'active':''}" data-item="${esc(key)}"><strong>${esc(key)}</strong><small>${esc(cfg.spec)}</small></button>`).join('');selectors.querySelectorAll('[data-item]').forEach(btn=>btn.addEventListener('click',()=>{state.selected=btn.dataset.item;render()}))}
  function pointsFor(key){const cfg=CONFIG[key],points=[];state.rows.filter(row=>sameItem(row.check||row.item||row.name,cfg)).forEach(row=>measurementValues(row).forEach((raw,index)=>{const value=normalizeValue(raw,cfg);if(value==null)return;points.push({value,date:dateOf(row),lot:clean(row.lot||row.groupId||row.id||'-'),product:clean(row.product||row.item||'-'),source:row._source,index:index+1,raw:clean(raw)})}));return points.sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
  function chart(points,cfg,st){const W=640,H=240,pad={l:52,r:18,t:17,b:34};if(!points.length)return'<div class="empty">표시할 수치형 측정 데이터가 없습니다.<br>PQC/OQC에서 측정값이 저장되면 자동 반영됩니다.</div>';const vals=points.map(p=>p.value),refs=[cfg.lsl,cfg.usl,st?.mean].filter(v=>v!=null&&Number.isFinite(v));let min=Math.min(...vals,...refs),max=Math.max(...vals,...refs);if(min===max){const delta=Math.abs(min||1)*.1||1;min-=delta;max+=delta}else{const margin=(max-min)*.12;min-=margin;max+=margin}const x=i=>pad.l+(points.length===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(points.length-1));const y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/(max-min);let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(state.selected)} SPC 추이">`;for(let i=0;i<=4;i++){const yy=pad.t+i*(H-pad.t-pad.b)/4,val=max-i*(max-min)/4;svg+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text x="5" y="${yy+3}">${esc(Number(val).toLocaleString('ko-KR',{maximumFractionDigits:2}))}</text>`}svg+=`<line class="axis" x1="${pad.l}" x2="${pad.l}" y1="${pad.t}" y2="${H-pad.b}"/><line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${H-pad.b}" y2="${H-pad.b}"/>`;const ref=(v,cls,label)=>{if(v==null||!Number.isFinite(v))return'';const yy=y(v);return`<line class="${cls}" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text x="${W-pad.r-2}" y="${Math.max(9,yy-4)}" text-anchor="end">${label} ${esc(Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2}))}</text>`};svg+=ref(cfg.usl,'spec','USL')+ref(cfg.lsl,'spec','LSL')+ref(st?.mean,'mean','MEAN');if(points.length>1)svg+=`<polyline class="line" points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ')}"/>`;points.forEach((p,i)=>{svg+=`<circle class="dot ${outOfSpec(p.value,cfg)?'out':''}" cx="${x(i)}" cy="${y(p.value)}" r="4"/>`;if(points.length<=12||i===0||i===points.length-1)svg+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(p.date==='-'?String(i+1):p.date.slice(5))}</text>`});return svg+'</svg>'}
  function renderHistory(points,cfg){const recent=points.slice().reverse().slice(0,12);document.getElementById('historyMeta').textContent=`${points.length}개 측정값`;if(!recent.length){document.getElementById('history').innerHTML='<div class="empty">측정 이력이 없습니다.</div>';return}document.getElementById('history').innerHTML=`<div style="overflow-x:auto"><table class="table"><thead><tr><th>일자</th><th>LOT</th><th>구분</th><th style="text-align:right">측정값</th><th>판정</th></tr></thead><tbody>${recent.map(p=>{const ng=outOfSpec(p.value,cfg);return`<tr><td>${esc(p.date)}</td><td>${esc(p.lot)}</td><td>${esc(p.source)}</td><td class="num ${ng?'ng':''}">${esc(Number(p.value).toLocaleString('ko-KR',{maximumFractionDigits:3}))} ${esc(cfg.unit)}</td><td class="${ng?'ng':''}">${ng?'규격이탈':'규격내'}</td></tr>`}).join('')}</tbody></table></div>`}
  function render(){renderSelectors();const cfg=CONFIG[state.selected],points=pointsFor(state.selected),values=points.map(p=>p.value),st=stats(values,cfg),grade=gradeOf(st?.cpk);document.getElementById('specText').textContent=cfg.spec;document.getElementById('stageText').textContent=cfg.stage;document.getElementById('methodText').textContent=`측정방법: ${cfg.method}`;const decimals=state.selected==='점도'||state.selected==='수분율'||state.selected==='절연저항'?1:state.selected==='고형분'?3:2;document.getElementById('meanValue').innerHTML=st?`${fmt(st.mean,decimals)}<small>${esc(cfg.unit)}</small>`:'—';document.getElementById('sdValue').innerHTML=st?`${fmt(st.sd,decimals)}<small>${esc(cfg.unit)}</small>`:'—';document.getElementById('cpValue').textContent=st?(st.cp==null?'—':fmt(st.cp,2)):'—';document.getElementById('cpkValue').textContent=st?(st.cpk==null?'—':fmt(st.cpk,2)):'—';document.getElementById('sampleCount').textContent=`측정 ${points.length}개`;const pill=document.getElementById('gradePill');pill.textContent=grade.label;pill.className=`pill ${grade.tone}`.trim();document.getElementById('chartMeta').textContent=points.length?`최근 ${points.length}개 측정값`:'측정 데이터 없음';document.getElementById('chartWrap').innerHTML=chart(points,cfg,st);renderHistory(points,cfg);if(points.length<2)setMessage('Cpk 계산에는 수치형 측정값이 2개 이상 필요합니다. 현재는 저장된 실제 측정값만 표시합니다.','');else if(state.selected==='절연저항'&&state.rows.some(row=>sameItem(row.check||row.item||row.name,cfg)&&measurementValues(row).some(v=>/overflow/i.test(clean(v)))))setMessage('절연저항의 Overflow 값은 합격 판정에는 사용할 수 있지만 수치가 아니므로 Cpk 계산 표본에서는 제외했습니다.','');else setMessage('')}
  async function load(){setLive('loading','조회 중');setMessage('');try{const [pqc,oqc]=await Promise.all([api('/api/qmes-sync/pqc'),api('/api/qmes-sync/oqc')]);state.rows=[...flatten(pqc,'PQC'),...flatten(oqc,'OQC')];render();setLive('','실시간 연동')}catch(error){if(error.message==='AUTH')return;state.rows=[];render();setMessage(`SPC 측정 데이터를 불러오지 못했습니다: ${error.message}`,'error');setLive('error','연결 실패')}}
  document.getElementById('backBtn').addEventListener('click',()=>location.assign(`/mobile.html?v=${VERSION}`));document.getElementById('refreshBtn').addEventListener('click',load);render();load();
})();
</script>
