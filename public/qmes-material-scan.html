<main><div class="panel"><div class="state" id="state"><div class="symbol" id="symbol">…</div><h1 id="verdict">검사정보 확인 중</h1><p id="reason" role="status">QMES 수입검사 및 작업지시서 정보를 조회합니다.</p></div>

<tr><th>원료명</th><td id="name">-</td></tr>

<tr><th>검사상태</th><td><span id="iqc">확인 중</span></td></tr>
<tr><th>보관구역</th><td id="zone">-</td></tr>
<tr><th>사용가능량</th><td id="qty">확인 필요</td></tr>
</tbody></table>
<div hidden aria-hidden="true"><span id="supplier"></span><span id="received"></span><span id="work"></span><span id="expected"></span><span id="plan"></span><span id="match"></span><span id="hold"></span></div><section style="padding:16px;border-bottom:1px solid #d4e0ed"><label for="scan" style="display:block;font-weight:700;margin-bottom:8px">실제 원료 라벨 대조</label><input id="scan" autocomplete="off" placeholder="원료 QR 주소 또는 LOT 입력" style="width:100%;padding:12px;border:1px solid #c6d6e8;border-radius:6px;font:inherit"><button id="camera" type="button" style="margin-top:8px;padding:10px 18px">카메라로 스캔</button> <video id="cameraView" playsinline muted hidden style="width:100%;margin-top:10px"></video><button id="compare" type="button" style="margin-top:8px;padding:10px 18px">원료 확인</button><p id="comparison" role="status" style="line-height:1.6">이 화면은 작업지시 원료 정보입니다. 실제 용기의 QR 또는 LOT를 입력해 대조하세요.</p></section><footer><a class="action" id="retry" href="" style="margin-bottom:10px">다시 조회</a><a class="action" id="detail" href="/" hidden>수입검사 상세보기</a><div class="small">조회 전용 화면입니다. 승인·투입·재고 수량을 변경하지 않습니다.</div></footer></div></main>
<script src="/js/qmes-material-stock-core-20261103.js?v=20261119-pvdf5140"></script>
<script>
(async function(){
'use strict';
const el=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const ref=String(params.get('r')||params.get('record')||'').trim(),workRef=String(params.get('w')||params.get('work')||'').trim();
const legacyLot=String(params.get('lot')||'').trim(),legacyName=String(params.get('material')||'').trim();
// Printed work-order identity is visible even before network/login checks.
el('lot').textContent=legacyLot||'-';el('name').textContent=legacyName||'-';
const core=window.qmesMaterialStockCore;
const norm=v=>String(v??'').trim().normalize('NFKC').toUpperCase().replace(/\s+/g,'');
let baseResult=null,comparisonOverride=null;
const paint=result=>{el('state').className='state '+result.kind;el('verdict').textContent=result.title;el('reason').textContent=result.message;el('symbol').textContent=result.symbol;};
const show=(kind,title,message,symbol)=>{
 baseResult={kind,title:kind==='bad'?'투입 차단':title,message,symbol:kind==='bad'?'✕':symbol};
 paint(comparisonOverride||baseResult);
};
const read=async url=>{
 const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
 if(r.status===401||r.status===403)throw Error('QMES 로그인 후 다시 스캔해 주세요.');
 if(!r.ok)throw Error('조회 실패 ('+r.status+'): '+url.split('?')[0]);
 const result=await r.json();
 if(result?.success!==true)throw Error(result?.message||'서버 응답 확인 필요');
 return result.data;
};
// Mobile scans use an issued, read-only link scoped to this single material row.
const scanToken=String(params.get('s')||'').trim();
if(scanToken){
 let current=null;
 const applyData=data=>{
  current=data;el('name').textContent=data.name||legacyName||'-';el('lot').textContent=data.lot||legacyLot||'-';
  el('code').textContent='-';el('zone').textContent='-';
  el('iqc').textContent=data.iqc||'확인 필요';el('iqc').className=data.iqc==='합격'?'pass':data.iqc==='불합격'?'fail':'';
  el('qty').textContent=Number.isFinite(data.available)?data.available.toLocaleString('ko-KR',{maximumFractionDigits:6})+' kg':'확인 필요';
  show(data.kind||'warn',data.title||'확인 필요',data.reason||'',data.kind==='ok'?'✓':data.kind==='bad'?'✕':'!');
 };
 el('compare').onclick=async()=>{
  const raw=el('scan').value.trim();if(!raw||!current)return;
  let scannedLot=raw,scannedName='';
  try{
   if(/^https?:|^\//.test(raw)){
    const link=new URL(raw,location.origin);if(link.origin!==location.origin)throw Error('나모 웹 원료 QR을 사용해 주세요.');
    const token=link.searchParams.get('s');
    if(token){const data=await read('/api/qmes/work-material-links/'+encodeURIComponent(token));scannedLot=data.lot;scannedName=data.name;}
    else {scannedLot=link.searchParams.get('lot')||'';scannedName=link.searchParams.get('material')||'';if(!scannedLot)throw Error('이 QR에서 LOT를 읽을 수 없습니다. LOT 번호로 대조하세요.');}
   }
   const sameLot=(core?.lot||norm)(scannedLot)===(core?.lot||norm)(current.lot);
   const sameName=!scannedName||(core?.material||norm)(scannedName)===(core?.material||norm)(current.name);
   if(sameLot&&sameName){comparisonOverride=null;paint(baseResult);el('comparison').textContent='✓ '+(scannedName?'원료·LOT':'LOT')+' 일치. 위의 검사·재고 판정을 확인하세요.';el('comparison').style.color='#13843b';}
   else {comparisonOverride={kind:'bad',title:'투입 차단',message:'작업지시 원료 또는 LOT와 일치하지 않습니다. 원료를 재확인하세요.',symbol:'✕'};paint(comparisonOverride);el('comparison').textContent='✕ 원료·LOT 불일치';el('comparison').style.color='#c23232';}
  }catch(error){comparisonOverride={kind:'warn',title:'원료 확인 필요',message:error.message,symbol:'!'};paint(comparisonOverride);el('comparison').textContent=error.message;}
 };
 let stream=null,cameraTimer=null;
const stopCamera=()=>{clearTimeout(cameraTimer);stream?.getTracks().forEach(t=>t.stop());stream=null;el('cameraView').hidden=true;el('camera').textContent='카메라로 스캔';};
window.addEventListener('pagehide',stopCamera);
el('camera').onclick=async()=>{
 if(stream){stopCamera();return;}
 if(!window.BarcodeDetector||!navigator.mediaDevices?.getUserMedia){el('comparison').textContent='이 브라우저는 카메라 QR 읽기를 지원하지 않습니다. QR 주소를 붙여넣거나 LOT를 입력하세요.';return;}
 try{
  const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const video=el('cameraView');video.srcObject=stream;video.hidden=false;await video.play();el('camera').textContent='스캔 중지';
  const scan=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes[0]?.rawValue){el('scan').value=codes[0].rawValue;stopCamera();el('compare').click();return;}}catch(_){}if(stream)cameraTimer=setTimeout(scan,250);};scan();
 }catch(_){stopCamera();el('comparison').textContent='카메라를 열지 못했습니다. 카메라 권한을 확인하거나 LOT를 입력하세요.';}
};
el('scan').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();el('compare').click();}});


 try{applyData(await read('/api/qmes/work-material-links/'+encodeURIComponent(scanToken)));}
 catch(error){el('iqc').textContent='확인 필요';el('qty').textContent='확인 필요';show('warn','조회 확인 필요',error.message,'!');}
 return;
}
if(!core){show('warn','재고 확인 필요','QMES 재고 계산 모듈을 불러올 수 없습니다.','!');return;}
// Read the same live sources as the raw-material inventory screen.
const sources=[['/api/qmes/work-orders','작업지시서'],['/api/iqc','수입검사'],['/api/trace?keyword=','작업실적'],['/api/qmes-sync/inventory','수불기록'],['/api/qmes-quality-gate/holds?lot=','품질보류']];
const pending=sources.map(async([url,label])=>{try{return {value:await read(url),label}}catch(error){return {error:label+': '+error.message,label}}});
const orderResult=await pending[0];
let iqc=[],orders=[],receipts=[],lot='',material='',supplier='',selected=[];
const lineParam=params.get('i'),hasLine=lineParam!==null&&/^\d+$/.test(lineParam);
if(orderResult.error||!Array.isArray(orderResult.value)){show('warn','작업지시 확인 필요',orderResult.error||'작업지시서 응답을 확인해 주세요.','!');return;}
orders=orderResult.value;
const exactJobs=orders.filter(row=>norm(row.id)===norm(workRef));
const jobs=exactJobs.length?exactJobs:orders.filter(row=>norm(row.fields?.['작업지시번호'])===norm(workRef));
if(!workRef||jobs.length!==1||!Array.isArray(jobs[0].materials)){show('warn','작업지시 확인 필요','연결된 작업지시서를 확인할 수 없습니다.','!');return;}
const job=jobs[0];
if(hasLine){
 const row=job.materials[Number(lineParam)];
 if(!row){show('warn','원료 확인 필요','작업지시서에서 해당 원료 행을 찾을 수 없습니다. 다시 인쇄해 주세요.','!');return;}
 lot=String(row.lot??'').trim();material=String(row.name??'').trim();
 el('name').textContent=material||'-';el('lot').textContent=lot||'-';
 if((legacyLot&&core.lot(legacyLot)!==core.lot(lot))||(legacyName&&core.material(legacyName)!==core.material(material))){
  show('bad','투입 차단','인쇄 후 작업지시 원료 또는 LOT가 변경됐습니다. 최신 작업지시서를 확인해 주세요.','✕');return;
 }
 selected=[row];
}else if(legacyLot&&legacyName){
 lot=legacyLot;material=legacyName;
 selected=job.materials.filter(row=>core.lot(row.lot)===core.lot(lot)&&core.material(row.name)===core.material(material));
}
el('code').textContent='-';el('zone').textContent='-';
el('work').textContent=job.fields?.['작업지시번호']||job.id;
if(lot&&material){el('name').textContent=material;el('lot').textContent=lot;}
const iqcResult=await pending[1];
if(iqcResult.error||!Array.isArray(iqcResult.value)){el('iqc').textContent='확인 필요';show('warn','수입검사 확인 필요',iqcResult.error||'수입검사 응답을 확인해 주세요.','!');return;}
iqc=iqcResult.value;
if(!hasLine&&!selected.length&&ref){
 const receipt=iqc.find(row=>String(row.id)===ref);
 if(receipt){lot=String(receipt.lot||'');material=String(receipt.item||'');selected=job.materials.filter(row=>core.lot(row.lot)===core.lot(lot)&&core.material(row.name)===core.material(material));}
}
el('name').textContent=material||'-';el('lot').textContent=lot||'-';
if(!lot||!material||!selected.length){show('bad','투입 차단','작업지시서의 원료명·LOT와 QR이 일치하지 않습니다.','✕');return;}
receipts=iqc.filter(row=>core.lot(row.lot)===core.lot(lot)&&core.material(row.item)===core.material(material));
const judgments=receipts.map(core.judgment);
const iqcState=!receipts.length?'기록 없음':judgments.includes('불합격')?'불합격':judgments.every(value=>value==='합격')?'합격':'확인 필요';
el('iqc').textContent=iqcState;el('iqc').className=iqcState==='합격'?'pass':iqcState==='불합격'?'fail':'';
el('match').textContent='일치';
const planned=selected.reduce((sum,row)=>sum+(core.number(row.plan)||0),0);
el('plan').textContent=planned.toLocaleString('ko-KR',{maximumFractionDigits:6})+' kg';
el('expected').textContent=material+' / '+lot;
el('compare').onclick=()=>{
 const raw=el('scan').value.trim();if(!raw)return;
 let scannedLot=raw,scannedName='',scannedId='',token='';
 try{const u=new URL(raw,location.origin);
 if(/^https?:/.test(raw)||raw.startsWith('/')){
  if(u.origin!==location.origin)throw Error('나모 웹의 원료 QR을 사용해 주세요.');
  token=/^\/iqc-label\/([a-f0-9-]{36})$/i.exec(u.pathname)?.[1]||'';
  scannedId=u.searchParams.get('r')||u.searchParams.get('record')||'';
  scannedLot=u.searchParams.get('lot')||'';scannedName=u.searchParams.get('material')||'';
  if(!token&&!scannedId&&!scannedLot)throw Error('이 QR에서 원료 또는 LOT 정보를 확인할 수 없습니다.');
 }
 const expectedToken=params.get('t')||'';
 const exactId=scannedId&&receipts.some(row=>scannedId===String(row.id));
 const exactToken=token&&expectedToken&&token===expectedToken;
 const candidates=iqc.filter(row=>core.lot(row.lot)===core.lot(scannedLot));
 const uniqueMaterial=new Set(candidates.map(row=>core.material(row.item)).filter(Boolean));
 const exactLot=scannedLot&&core.lot(scannedLot)===core.lot(lot)&&(scannedName?core.material(scannedName)===core.material(material):uniqueMaterial.size===1&&uniqueMaterial.has(core.material(material)));
 if(exactId||exactToken||exactLot){comparisonOverride=null;if(baseResult)paint(baseResult);el('comparison').textContent='✓ 작업지시 원료·LOT와 일치합니다. 투입 여부는 위의 검사·재고 확인 결과를 확인하세요.';el('comparison').style.color='#13843b';}
 else {comparisonOverride=token?{kind:'warn',title:'원료 확인 필요',message:'라벨 정보를 확인할 수 없습니다. LOT 번호로 다시 대조하세요.',symbol:'!'}:{kind:'bad',title:'투입 차단',message:'작업지시 원료와 스캔 원료·LOT가 일치하지 않습니다. 원료를 재확인하세요.',symbol:'✕'};paint(comparisonOverride);el('comparison').textContent=token?'확인 필요: 이 라벨의 원료 정보가 연결되지 않았습니다. LOT 번호로 다시 대조하세요.':'✕ 원료 또는 LOT 불일치 — 투입하지 말고 원료를 재확인하세요.';el('comparison').style.color='#c23232';}
 }catch(error){comparisonOverride={kind:'warn',title:'원료 확인 필요',message:error.message,symbol:'!'};paint(comparisonOverride);el('comparison').textContent=error.message;el('comparison').style.color='#b77912';}
};
let stream=null,cameraTimer=null;
const stopCamera=()=>{clearTimeout(cameraTimer);stream?.getTracks().forEach(t=>t.stop());stream=null;el('cameraView').hidden=true;el('camera').textContent='카메라로 스캔';};
window.addEventListener('pagehide',stopCamera);
el('camera').onclick=async()=>{
 if(stream){stopCamera();return;}
 if(!window.BarcodeDetector||!navigator.mediaDevices?.getUserMedia){el('comparison').textContent='이 브라우저는 카메라 QR 읽기를 지원하지 않습니다. QR 주소를 붙여넣거나 LOT를 입력하세요.';return;}
 try{
  const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const video=el('cameraView');video.srcObject=stream;video.hidden=false;await video.play();el('camera').textContent='스캔 중지';
  const scan=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes[0]?.rawValue){el('scan').value=codes[0].rawValue;stopCamera();el('compare').click();return;}}catch(_){}if(stream)cameraTimer=setTimeout(scan,250);};scan();
 }catch(_){stopCamera();el('comparison').textContent='카메라를 열지 못했습니다. 카메라 권한을 확인하거나 LOT를 입력하세요.';}
};
el('scan').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();el('compare').click();}});

if(receipts.length===1){
 el('detail').hidden=false;el('detail').href='#';
 el('detail').addEventListener('click',async event=>{
  event.preventDefault();const button=el('detail');if(button.dataset.loading)return;button.dataset.loading='1';
  try{const response=await fetch('/api/qmes/iqc/label-links',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({recordId:String(receipts[0].id)}),signal:AbortSignal.timeout(12000)});
   const result=await response.json();if(!response.ok||!result.success||!/^\/iqc-label\/[a-f0-9-]{36}$/i.test(result.path))throw Error('수입검사 상세 링크를 확인해 주세요.');location.href=result.path;
  }catch(error){el('comparison').textContent=error.message;}finally{delete button.dataset.loading;}
 });
}
show('warn','재고 확인 중','작업지시 원료·LOT 확인. 재고관리의 사용가능량을 조회합니다.','…');
const results=await Promise.all(pending.slice(2));
for(const k of [0,1])if(!results[k].error&&!Array.isArray(results[k].value))results[k].error=results[k].label+' 응답 형식 확인 필요';
if(!results[2].error&&!Array.isArray(results[2].value?.holds))results[2].error='품질보류 응답 형식 확인 필요';
const errors=results.filter(row=>row.error).map(row=>row.error);
const stock=core.build({iqc,orders,actuals:results[0].value||[],entries:core.readEntries(results[1].value||[]),holds:results[2].value?.holds||[],sourceErrors:errors});
const matches=stock.rows.filter(row=>core.lot(row.lot)===core.lot(lot)&&core.material(row.material)===core.material(material));
const suppliers=new Set(matches.map(row=>core.supplierKey(row.supplier)));
const entry=matches.length===1?matches[0]:null;
el('qty').textContent=entry&&!entry.uncertain&&Number.isFinite(entry.available)?entry.available.toLocaleString('ko-KR',{maximumFractionDigits:6})+' kg':'확인 필요';
if(iqcState==='불합격'){show('bad','투입 차단','수입검사 불합격입니다. 원료를 재확인하세요.','✕');return;}
if(!receipts.length){show('warn','수입검사 확인 필요','작업지시 원료명·LOT는 확인됐지만 일치하는 수입검사 기록이 없습니다.','!');return;}
if(iqcState!=='합격'){show('warn','수입검사 확인 필요','해당 원료 LOT의 수입검사 합격 여부를 확인해 주세요.','!');return;}
if(errors.length){show('warn','재고 확인 필요',errors.join(' / '),'!');return;}
if(!entry){show('warn','재고 확인 필요',suppliers.size>1?'동일 원료·LOT의 공급업체가 여러 곳입니다. 재고 내역을 확인해 주세요.':'재고관리에서 해당 원료·LOT의 재고를 확인할 수 없습니다.','!');return;}
el('supplier').textContent=entry.supplier;
el('hold').textContent=entry.quality==='품질보류'?'보류 있음':'보류 없음';
if(entry.quality==='품질보류'){show('bad','투입 차단','해당 LOT는 품질보류 상태입니다.','✕');return;}
if(entry.uncertain||entry.quality!=='사용가능'){show('warn','재고 확인 필요','재고관리에서 해당 원료 LOT의 수량·연결 상태를 확인해 주세요.','!');return;}
if(!(entry.available>0)){show('bad','투입 차단','재고관리의 사용가능량이 없습니다.','✕');return;}
if(planned>entry.available+1e-6){show('warn','투입량 확인 필요','작업지시 계획량이 재고관리의 사용가능량을 초과합니다.','!');return;}
show('ok','투입 가능','작업지시 원료·LOT 일치 · 수입검사 합격 · 재고 사용가능량 확인','✓');
})();
</script></body></html>
