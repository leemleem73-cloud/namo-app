<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMES 원료 QR 스캔 결과</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4fa;color:#16304f;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif}header{background:#153eaa;color:white;padding:18px 18px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}header a{color:white;text-decoration:none}main{max-width:460px;margin:0 auto;padding:18px 14px 36px}.panel{background:white;border:1px solid #d4e0ed;border-radius:13px;overflow:hidden;box-shadow:0 5px 24px #0e28551c}.state{text-align:center;padding:25px 12px 18px}.symbol{font-size:57px;line-height:1.1;color:#64748b}.state h1{margin:10px 0 0;font-size:28px;color:#334155}.state p{margin:9px 12px;color:#52667c;font-size:13px;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #d4e0ed;padding:13px 10px;text-align:left;overflow-wrap:anywhere}th{background:#edf4fd;width:36%;color:#294768}td{font-weight:700}footer{padding:16px;text-align:center}.action{display:block;background:#1646be;color:#fff;text-decoration:none;border-radius:7px;padding:13px;font-weight:700;text-align:center}.small{font-size:12px;color:#687c95;line-height:1.6;margin-top:15px;text-align:center}.ok .symbol,.ok h1{color:#13843b}.bad .symbol,.bad h1{color:#c23232}.warn .symbol,.warn h1{color:#b77912}.pass{color:#168343}.fail{color:#c33232}
</style></head><body><header><a href="/" aria-label="QMES 메인">‹</a> QMES　원료 QR 스캔 결과</header>
<main><div class="panel"><div class="state" id="state"><div class="symbol" id="symbol">…</div><h1 id="verdict">검사정보 확인 중</h1><p id="reason" role="status">QMES 수입검사 및 작업지시서 정보를 조회합니다.</p></div>
<table><tbody>
<tr><th>원료명</th><td id="name">-</td></tr><tr><th>원료코드</th><td id="code">-</td></tr><tr><th>LOT No.</th><td id="lot">-</td></tr><tr><th>검사상태</th><td id="iqc">확인 중</td></tr><tr><th>사용가능량</th><td id="qty">확인 필요</td></tr>
</tbody></table><footer><a class="action" id="detail" href="/" hidden>수입검사 상세보기</a><div class="small">조회 전용 화면입니다. 승인·투입·재고 수량을 변경하지 않습니다.</div></footer></div></main>
<script>
(async function(){
'use strict';
const el=id=>document.getElementById(id),p=new URLSearchParams(location.search);
const lot=(p.get('lot')||'').trim(),name=(p.get('material')||'').trim(),wo=(p.get('work')||'').trim(),iqcUrl=(p.get('iqc')||'').trim();
const normalize=x=>String(x??'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toUpperCase();
const lotKey=x=>normalize(x).replace(/[\s\u00A0]/g,'');
const materialKey=x=>normalize(x).replace(/[\s()\[\]_-]/g,'');
const itemMatches=(row,material)=>{
 const item=normalize(row.item),name=normalize(material);
 const aliases=[row.item_code,row.itemCode,row.material_code,row.materialCode].map(normalize);
 const tokens=item.split(/[^A-Z0-9가-힣]+/).filter(Boolean);
 return item===name||materialKey(item)===materialKey(name)||tokens.includes(name)||tokens.includes(materialKey(name))||aliases.includes(name);
};
const show=(status,title,reason,icon)=>{el('state').className='state '+status;el('symbol').textContent=icon;el('verdict').textContent=title;el('reason').textContent=reason;};
el('lot').textContent=lot||'-';el('name').textContent=name||'-';
if(iqcUrl){try{const u=new URL(iqcUrl,location.origin);if(u.origin===location.origin&&/^\/iqc-label\/[a-f0-9-]{36}$/i.test(u.pathname)){el('detail').href=u.href;el('detail').hidden=false;}}catch(_){}}
if(!lot||!name||!wo){show('bad','확인 불가','QR코드에 필요한 원료명·LOT·작업지시 정보가 없습니다.','✕');return;}
let iqcRecords,workRecords;
try{
 const answers=await Promise.all(['/api/iqc','/api/qmes/work-orders'].map(async url=>{const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(12000)});if(r.status===401||r.status===403)throw Error('로그인이 필요합니다. QMES에 로그인한 후 다시 QR코드를 스캔해 주세요.');if(!r.ok)throw Error('QMES 조회 오류: '+r.status);const data=await r.json();if(!data||data.success!==true||!Array.isArray(data.data))throw Error('QMES 조회 응답을 확인할 수 없습니다.');return data.data;}));
 [iqcRecords,workRecords]=answers;
}catch(err){show('warn','확인 필요',err.message||'정보를 불러올 수 없습니다.','!');return;}
const jobs=workRecords.filter(x=>normalize(x.id)===normalize(wo)||normalize(x.fields?.['작업지시번호'])===normalize(wo));
if(jobs.length!==1){
 show('warn','대조 확인 필요','작업지시서 정보를 정확히 조회하지 못했습니다. LOT와 작업지시번호를 확인하세요.','!');return;
}
const job=jobs[0];
if(!Array.isArray(job.materials)){
 show('warn','대조 확인 필요','작업지시서의 원료 정보가 조회되지 않았습니다.','!');return;
}
const matchesJob=job.materials.filter(m=>normalize(m.lot)===normalize(lot)&&normalize(m.name)===normalize(name));
if(!matchesJob.length){
 show('warn','대조 확인 필요','작업지시서의 원료명 또는 LOT가 다릅니다. 투입 전 담당자 확인이 필요합니다.','!');return;
}
// Verify the original LOT first. Normalize invisible characters and whitespace only.
const lotRows=iqcRecords.filter(x=>lotKey(x.lot)===lotKey(lot));
const exact=lotRows.filter(x=>normalize(x.item)===normalize(name));
let rows=exact.length?exact:lotRows.filter(x=>itemMatches(x,name));
if(rows.length!==1){
 if(!lotRows.length){
  el('iqc').textContent='LOT 조회 불일치';
  show('warn','LOT 확인 필요','IQC 조회는 정상 응답했지만 LOT '+lot+'의 검사기록은 일치하지 않았습니다. 수입검사 원료 LOT 원문과 비교해 주세요.','!');return;
 }
 if(lotRows.length===1){
  el('iqc').textContent='품목 대조 필요';
  show('warn','원료명 확인 필요','IQC에는 해당 LOT가 존재하지만 등록 품목명은 '+String(lotRows[0].item||'-')+'입니다. 작업지시서 원료명과 동일 품목인지 확인하세요.','!');return;
 }
 el('iqc').textContent='중복 기록 확인';
 show('warn','IQC 중복 확인','동일 LOT의 검사기록 '+lotRows.length+'건이 존재하며 일치 품목을 단일 결정하지 못했습니다.','!');return;
}
const row=rows[0];el('code').textContent=row.item_code||row.itemCode||row.material_code||row.materialCode||'-';
const items=(()=>{try{const v=typeof row.items_json==='string'?JSON.parse(row.items_json):row.items_json;return Array.isArray(v)?v:[]}catch(_){return []}})();
const values=items.flatMap(x=>[x?.judge,x?.result,x?.status,x?.value,...(Array.isArray(x?.values)?x.values:[]),...(Array.isArray(x?.measurements)?x.measurements:[])]).map(normalize);
const hasFail=values.some(v=>v.includes('불합격')||v.includes('부적합')||v.includes('미확인')||v==='NG'||v==='FAIL');
const allPass=items.length>0&&items.every(x=>String(x?.judge||'').trim()==='합격');
const explicit=String(row.judge||'').trim();
const master=items.find(x=>String(x?.name||'').includes('판정'));
const state=hasFail?'불합격':allPass?'합격':explicit||String(master?.judge||master?.value||'대기').trim()||'대기';
el('iqc').textContent=state;el('iqc').className=state==='합격'?'pass':state==='불합격'?'fail':'';
if(state==='불합격'){
 show('bad','투입 금지','수입검사 불합격 항목이 확인됐습니다. 해당 원료는 투입하지 마세요.','✕');return;
}
if(state!=='합격'){
 show('warn','IQC 확인 필요','검사 판정이 합격으로 확인되지 않았습니다. 투입 전에 품질부 확인이 필요합니다.','!');return;
}
show('warn','재고 확인 필요','원료명·LOT 및 IQC 합격이 확인됐습니다. 사용가능량과 부적합 보류 상태를 확인한 뒤 투입하세요.','!');
})();
</script></body></html>
