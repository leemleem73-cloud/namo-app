<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMES 원료 QR 스캔 결과</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4fa;color:#16304f;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif}header{background:#153eaa;color:white;padding:18px 18px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}header a{color:white;text-decoration:none}main{max-width:460px;margin:0 auto;padding:18px 14px 36px}.panel{background:white;border:1px solid #d4e0ed;border-radius:13px;overflow:hidden;box-shadow:0 5px 24px #0e28551c}.state{text-align:center;padding:25px 12px 18px}.symbol{font-size:57px;line-height:1.1;color:#64748b}.state h1{margin:10px 0 0;font-size:28px;color:#334155}.state p{margin:9px 12px;color:#52667c;font-size:13px;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #d4e0ed;padding:13px 10px;text-align:left;overflow-wrap:anywhere}th{background:#edf4fd;width:36%;color:#294768}td{font-weight:700}footer{padding:16px;text-align:center}.action{display:block;background:#1646be;color:#fff;text-decoration:none;border-radius:7px;padding:13px;font-weight:700;text-align:center}.small{font-size:12px;color:#687c95;line-height:1.6;margin-top:15px;text-align:center}.ok .symbol,.ok h1{color:#13843b}.bad .symbol,.bad h1{color:#c23232}.warn .symbol,.warn h1{color:#b77912}.pass{color:#168343}.fail{color:#c33232}

.state{padding:24px 16px;border-bottom:1px solid #d4e0ed}
.symbol{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:#e8eef5;font-size:48px;font-weight:900}
.state h1{font-size:32px;font-weight:900;letter-spacing:1px}
.state.ok{background:#effbf3}.ok .symbol{background:#169447;color:#fff}.ok h1{color:#117b38}
.state.bad{background:#fff0f0;border-bottom-color:#efb5b5}.bad .symbol{background:#d83232;color:#fff}.bad h1{color:#bd2424}.bad p{color:#9b2929;font-weight:700}
.state.warn{background:#fff9eb}.warn .symbol{background:#e4a422;color:#fff}.warn h1{color:#925e0e}
#iqc{display:inline-block;padding:4px 12px;border-radius:5px;background:#edf1f6}
#iqc.pass{background:#e2f5e8;color:#147a37}#iqc.fail{background:#ffe3e3;color:#bd2424}
th{width:37%}td{font-size:16px}#qty{font-size:18px}
</style></head><body><header><a href="/" aria-label="QMES 메인">‹</a> QMES　원료 QR 스캔 결과</header>
<main><div class="panel"><div class="state" id="state"><div class="symbol" id="symbol">…</div><h1 id="verdict">검사정보 확인 중</h1><p id="reason" role="status">QMES 수입검사 및 작업지시서 정보를 조회합니다.</p></div>
<table aria-label="원료 QR 확인 정보"><tbody>
<tr><th>원료명</th><td id="name">-</td></tr>
<tr><th>원료코드</th><td id="code">-</td></tr>
<tr><th>LOT NO</th><td id="lot">-</td></tr>
<tr><th>검사상태</th><td><span id="iqc">확인 중</span></td></tr>
<tr><th>보관구역</th><td id="zone">-</td></tr>
<tr><th>사용가능량</th><td id="qty">확인 필요</td></tr>
</tbody></table>
<div hidden aria-hidden="true"><span id="supplier"></span><span id="received"></span><span id="work"></span><span id="expected"></span><span id="plan"></span><span id="match"></span><span id="hold"></span></div><section style="padding:16px;border-bottom:1px solid #d4e0ed"><label for="scan" style="display:block;font-weight:700;margin-bottom:8px">실제 원료 라벨 대조</label><input id="scan" autocomplete="off" placeholder="원료 QR 주소 또는 LOT 입력" style="width:100%;padding:12px;border:1px solid #c6d6e8;border-radius:6px;font:inherit"><button id="camera" type="button" style="margin-top:8px;padding:10px 18px">카메라로 스캔</button> <video id="cameraView" playsinline muted hidden style="width:100%;margin-top:10px"></video><button id="compare" type="button" style="margin-top:8px;padding:10px 18px">원료 확인</button><p id="comparison" role="status" style="line-height:1.6">이 화면은 작업지시 원료 정보입니다. 실제 용기의 QR 또는 LOT를 입력해 대조하세요.</p></section><footer><a class="action" id="retry" href="" style="margin-bottom:10px">다시 조회</a><a class="action" id="detail" href="/" hidden>수입검사 상세보기</a><div class="small">조회 전용 화면입니다. 승인·투입·재고 수량을 변경하지 않습니다.</div></footer></div></main>
<script src="/js/qmes-material-stock-core-20261103.js"></script>
<script>
(async function(){
'use strict';
const el=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const ref=String(params.get('r')||params.get('record')||'').trim(),workRef=String(params.get('w')||params.get('work')||'').trim();
const legacyLot=String(params.get('lot')||'').trim(),legacyName=String(params.get('material')||'').trim();
const core=window.qmesMaterialStockCore;
const norm=v=>String(v??'').trim().normalize('NFKC').toUpperCase().replace(/\s+/g,'');
let baseResult=null,comparisonOverride=null;
const paint=result=>{el('state').className='state '+result.kind;el('verdict').textContent=result.title;el('reason').textContent=result.message;el('symbol').textContent=result.symbol;};
const show=(kind,title,message,symbol)=>{
 baseResult={kind,title:kind==='bad'?'투입 차단':title,message,symbol:kind==='bad'?'✕':symbol};
 paint(comparisonOverride||baseResult);
};
const read=async url=>{
 const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
 if(r.status===401||r.status===403)throw Error('QMES 로그인 후 다시 스캔해 주세요.');
 if(!r.ok)throw Error('조회 실패 ('+r.status+'): '+url.split('?')[0]);
 const result=await r.json();
 if(result?.success!==true)throw Error(result?.message||'서버 응답 확인 필요');
 return result.data;
};
if(!core){show('warn','재고 확인 필요','QMES 재고 계산 모듈을 불러올 수 없습니다.','!');return;}
// Fetch independently: a delayed work-order query must not hide verified IQC fields.
const orderRequest=read('/api/qmes/work-orders').then(value=>({value}),error=>({error}));
let iqc,orders;
try{iqc=await read('/api/iqc');}
catch(err){show('warn','조회 확인 필요',err.message,'!');el('qty').textContent='미확인';return;}
if(!Array.isArray(iqc)){show('warn','조회 확인 필요','수입검사 응답 형식을 확인해 주세요.','!');return;}
const original=ref?iqc.filter(r=>String(r.id)===ref):iqc.filter(r=>norm(r.lot)===norm(legacyLot)&&core.material(r.item)===core.material(legacyName));
if(original.length!==1){show('warn','검사 확인 필요',original.length?'IQC 기록을 단일 건으로 확정할 수 없습니다.':'해당 수입검사 QR 기록을 찾을 수 없습니다.','!');return;}
const receipt=original[0];
const lot=String(receipt.lot||'').trim(),material=String(receipt.item||'').trim(),supplier=String(receipt.supplier||'').trim();
el('name').textContent=material||'-';el('lot').textContent=lot||'-';el('supplier').textContent=supplier||'미등록';
const oldLink=params.get('iqc');
if(oldLink){try{const link=new URL(oldLink,location.origin);if(link.origin===location.origin&&/^\/iqc-label\/[a-f0-9-]{36}$/i.test(link.pathname)){el('detail').href=link.href;el('detail').hidden=false;}}catch(_){}}
if(ref&& !el('detail').href.includes('/iqc-label/')){
 el('detail').hidden=false;
 el('detail').href='#';
 el('detail').addEventListener('click',async e=>{
  e.preventDefault();const btn=el('detail');
  if(btn.dataset.loading)return;btn.dataset.loading='1';btn.textContent='수입검사 불러오는 중';
  try{
   const r=await fetch('/api/qmes/iqc/label-links',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({recordId:ref}),signal:AbortSignal.timeout(12000)});
   const v=await r.json();if(!r.ok||!v.success||!/^\/iqc-label\/[a-f0-9-]{36}$/i.test(v.path))throw Error('IQC 상세 링크 확인 필요');
   location.href=v.path;
  }catch(err){show('warn','수입검사 조회 필요',err.message,'!');btn.textContent='수입검사 상세보기';delete btn.dataset.loading;}
 });
}
if(!lot||!material){show('warn','검사 확인 필요','수입검사 기록에 원료명 또는 LOT가 없습니다.','!');return;}
const iqcState=core.judgment(receipt);
el('iqc').textContent=iqcState;el('iqc').className=iqcState==='합격'?'pass':iqcState==='불합격'?'fail':'';
el('code').textContent='-';
el('zone').textContent='-';
const incoming=core.number(receipt.incoming_qty);
el('received').textContent=incoming===null?'미등록':incoming.toLocaleString('ko-KR')+' kg';
el('work').textContent=workRef||'미지정';
el('compare').onclick=()=>{
 const raw=el('scan').value.trim();if(!raw)return;
 let scannedLot=raw,scannedName='',scannedId='',token='';
 try{const u=new URL(raw,location.origin);
 if(/^https?:/.test(raw)||raw.startsWith('/')){
  if(u.origin!==location.origin)throw Error('나모 웹의 원료 QR을 사용해 주세요.');
  token=/^\/iqc-label\/([a-f0-9-]{36})$/i.exec(u.pathname)?.[1]||'';
  scannedId=u.searchParams.get('r')||u.searchParams.get('record')||'';
  scannedLot=u.searchParams.get('lot')||'';scannedName=u.searchParams.get('material')||'';
  if(!token&&!scannedId&&!scannedLot)throw Error('이 QR에서 원료 또는 LOT 정보를 확인할 수 없습니다.');
 }
 const expectedToken=params.get('t')||'';
 const exactId=scannedId&&scannedId===String(receipt.id);
 const exactToken=token&&expectedToken&&token===expectedToken;
 const candidates=iqc.filter(row=>core.lot(row.lot)===core.lot(scannedLot));
 const uniqueMaterial=new Set(candidates.map(row=>core.material(row.item)).filter(Boolean));
 const exactLot=scannedLot&&core.lot(scannedLot)===core.lot(lot)&&(scannedName?core.material(scannedName)===core.material(material):uniqueMaterial.size===1&&uniqueMaterial.has(core.material(material)));
 if(exactId||exactToken||exactLot){comparisonOverride=null;if(baseResult)paint(baseResult);el('comparison').textContent='✓ 작업지시 원료·LOT와 일치합니다. 투입 여부는 위의 검사·재고 확인 결과를 확인하세요.';el('comparison').style.color='#13843b';}
 else {comparisonOverride=token?{kind:'warn',title:'원료 확인 필요',message:'라벨 정보를 확인할 수 없습니다. LOT 번호로 다시 대조하세요.',symbol:'!'}:{kind:'bad',title:'투입 차단',message:'작업지시 원료와 스캔 원료·LOT가 일치하지 않습니다. 원료를 재확인하세요.',symbol:'✕'};paint(comparisonOverride);el('comparison').textContent=token?'확인 필요: 이 라벨의 원료 정보가 연결되지 않았습니다. LOT 번호로 다시 대조하세요.':'✕ 원료 또는 LOT 불일치 — 투입하지 말고 원료를 재확인하세요.';el('comparison').style.color='#c23232';}
 }catch(error){comparisonOverride={kind:'warn',title:'원료 확인 필요',message:error.message,symbol:'!'};paint(comparisonOverride);el('comparison').textContent=error.message;el('comparison').style.color='#b77912';}
};
let stream=null,cameraTimer=null;
const stopCamera=()=>{clearTimeout(cameraTimer);stream?.getTracks().forEach(t=>t.stop());stream=null;el('cameraView').hidden=true;el('camera').textContent='카메라로 스캔';};
window.addEventListener('pagehide',stopCamera);
el('camera').onclick=async()=>{
 if(stream){stopCamera();return;}
 if(!window.BarcodeDetector||!navigator.mediaDevices?.getUserMedia){el('comparison').textContent='이 브라우저는 카메라 QR 읽기를 지원하지 않습니다. QR 주소를 붙여넣거나 LOT를 입력하세요.';return;}
 try{
  const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const video=el('cameraView');video.srcObject=stream;video.hidden=false;await video.play();el('camera').textContent='스캔 중지';
  const scan=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes[0]?.rawValue){el('scan').value=codes[0].rawValue;stopCamera();el('compare').click();return;}}catch(_){}if(stream)cameraTimer=setTimeout(scan,250);};scan();
 }catch(_){stopCamera();el('comparison').textContent='카메라를 열지 못했습니다. 카메라 권한을 확인하거나 LOT를 입력하세요.';}
};
el('scan').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();el('compare').click();}});
const orderResult=await orderRequest;
if(orderResult.error||!Array.isArray(orderResult.value)){el('work').textContent=workRef||'미지정';show('warn','작업지시 조회 필요',orderResult.error?.message||'작업지시 응답 형식을 확인해 주세요.','!');el('qty').textContent='미확인';return;}
orders=orderResult.value;
const job=orders.filter(w=>norm(w.id)===norm(workRef)||norm(w.fields?.['작업지시번호'])===norm(workRef));
if(!workRef||job.length!==1||!Array.isArray(job[0].materials)){
 show('warn','작업지시 확인 필요','해당 작업지시서를 단일 건으로 확인할 수 없습니다.','!');return;
}
const selected=job[0].materials.filter(m=>core.lot(m.lot)===core.lot(lot)&&core.material(m.name)===core.material(material));
el('expected').textContent=job[0].materials.map(m=>String(m.name||'')+' / '+String(m.lot||'')).join(', ')||'미등록';
el('work').textContent=job[0].fields?.['작업지시번호']||job[0].id;
el('match').textContent=selected.length?'일치':'불일치';
el('match').className=selected.length?'pass':'fail';
if(!selected.length){
 show('bad','투입 차단 · 원료 불일치','IQC 기록은 조회됐지만 작업지시서의 원료명·LOT와 일치하지 않습니다.','!');return;
}
if(iqcState==='불합격'){show('bad','투입 금지','수입검사 불합격 기록이 확인됐습니다.','✕');return;}
if(iqcState!=='합격'){show('warn','IQC 확인 필요','수입검사 합격 판정이 확인되지 않았습니다.','!');return;}
if(!supplier){show('warn','공급업체 확인 필요','IQC는 합격이지만 공급업체가 등록되지 않았습니다.','!');return;}
el('expected').textContent=selected.map(m=>String(m.name)+' / '+String(m.lot)).join(', ');
const planned=selected.reduce((sum,m)=>sum+(core.number(m.plan)||0),0);
el('plan').textContent=planned.toLocaleString('ko-KR',{maximumFractionDigits:3})+' kg';
show('warn','원료·LOT 일치','수입검사 합격 확인. 사용가능량과 품질보류를 조회하고 있습니다.','…');
const queries=[['/api/trace?keyword=','작업실적'],['/api/qmes-sync/inventory','수불기록'],['/api/qmes-quality-gate/holds?lot='+encodeURIComponent(lot),'품질보류']];
const results=await Promise.all(queries.map(async([url,label])=>{try{return {value:await read(url),label}}catch(error){return {error:label+': '+error.message,label}}}));
if(!results[2].error&&!Array.isArray(results[2].value?.holds))results[2].error='품질보류 응답 형식 확인 필요';
for(const k of [0,1])if(!results[k].error&&!Array.isArray(results[k].value))results[k].error=results[k].label+' 응답 형식 확인 필요';
const errors=results.filter(x=>x.error).map(x=>x.error);
el('hold').textContent=results[2].error?'미확인':Array.isArray(results[2].value?.holds)?(results[2].value.holds.some(h=>!h.released_at&&!h.releasedAt)?'보류 있음':'보류 없음'):'미확인';
el('qty').textContent='미확인';
const stock=core.build({
 iqc,orders,actuals:Array.isArray(results[0].value)?results[0].value:[],
 entries:core.readEntries(Array.isArray(results[1].value)?results[1].value:[]),
 holds:Array.isArray(results[2].value?.holds)?results[2].value.holds:[],
 sourceErrors:errors
});
const matched=stock.rows.filter(r=>core.lot(r.lot)===core.lot(lot)&&core.material(r.material)===core.material(material)&&core.supplierKey(r.supplier)===core.supplierKey(supplier));
if(errors.length){show('warn','재고 확인 필요','원료·LOT 일치 및 IQC 합격 확인. '+errors.join(' / ')+'','!');return;}
if(matched.length!==1){show('warn','재고 확인 필요','일치하는 원료·LOT·공급업체의 가용재고를 단일 건으로 확인하지 못했습니다.','!');return;}
const entry=matched[0];
if(!entry.uncertain&&Number.isFinite(entry.available))el('qty').textContent=entry.available.toLocaleString('ko-KR',{maximumFractionDigits:3})+' kg';
if(entry.quality==='품질보류'){el('hold').textContent='보류 있음';show('bad','투입 금지','해당 LOT는 품질보류 상태입니다. 품질부 해제 승인 후 사용하세요.','✕');return;}
if(entry.quality!=='사용가능'||entry.uncertain){el('qty').textContent='확인 필요';show('warn','재고 확인 필요','IQC 합격 확인. 재고 계산 또는 수불 이력이 불확실하여 투입을 승인할 수 없습니다.','!');return;}

if(!(entry.available>0)){show('bad','투입 금지','사용가능 재고가 없습니다.','✕');return;}
if(Number.isFinite(planned)&&planned>entry.available+1e-6){show('warn','투입량 확인 필요','계획투입량이 현재 사용가능량을 초과합니다.','!');return;}
show('ok','투입 가능','IQC 합격 · 작업지시 LOT 일치 · 품질보류 없음 · 사용가능량 확인','✓');
})();
</script></body></html>
