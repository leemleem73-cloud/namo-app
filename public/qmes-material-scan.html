<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMES 원료 QR 스캔 결과</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4fa;color:#16304f;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif}header{background:#153eaa;color:white;padding:18px 18px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}header a{color:white;text-decoration:none}main{max-width:460px;margin:0 auto;padding:18px 14px 36px}.panel{background:white;border:1px solid #d4e0ed;border-radius:13px;overflow:hidden;box-shadow:0 5px 24px #0e28551c}.state{text-align:center;padding:25px 12px 18px}.symbol{font-size:57px;line-height:1.1;color:#64748b}.state h1{margin:10px 0 0;font-size:28px;color:#334155}.state p{margin:9px 12px;color:#52667c;font-size:13px;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #d4e0ed;padding:13px 10px;text-align:left;overflow-wrap:anywhere}th{background:#edf4fd;width:36%;color:#294768}td{font-weight:700}footer{padding:16px;text-align:center}.action{display:block;background:#1646be;color:#fff;text-decoration:none;border-radius:7px;padding:13px;font-weight:700;text-align:center}.small{font-size:12px;color:#687c95;line-height:1.6;margin-top:15px;text-align:center}.ok .symbol,.ok h1{color:#13843b}.bad .symbol,.bad h1{color:#c23232}.warn .symbol,.warn h1{color:#b77912}.pass{color:#168343}.fail{color:#c33232}
</style></head><body><header><a href="/" aria-label="QMES 메인">‹</a> QMES　원료 QR 스캔 결과</header>
<main><div class="panel"><div class="state" id="state"><div class="symbol" id="symbol">…</div><h1 id="verdict">검사정보 확인 중</h1><p id="reason" role="status">QMES 수입검사 및 작업지시서 정보를 조회합니다.</p></div>
<table><tbody>
<tr><th>원료명</th><td id="name">-</td></tr><tr><th>공급업체</th><td id="supplier">-</td></tr><tr><th>원료 LOT No.</th><td id="lot">-</td></tr><tr><th>검사상태</th><td id="iqc">확인 중</td></tr><tr><th>사용가능량</th><td id="qty">확인 필요</td></tr>
</tbody></table><footer><a class="action" id="detail" href="/" hidden>수입검사 상세보기</a><div class="small">조회 전용 화면입니다. 승인·투입·재고 수량을 변경하지 않습니다.</div></footer></div></main>
<script src="/js/qmes-material-stock-core-20261103.js"></script>
<script>
(async function(){
'use strict';
const el=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const ref=String(params.get('r')||params.get('record')||'').trim(),workRef=String(params.get('w')||params.get('work')||'').trim();
const legacyLot=String(params.get('lot')||'').trim(),legacyName=String(params.get('material')||'').trim();
const core=window.qmesMaterialStockCore;
const norm=v=>String(v??'').trim().normalize('NFKC').toUpperCase().replace(/\s+/g,'');
const show=(kind,title,message,symbol)=>{el('state').className='state '+kind;el('verdict').textContent=title;el('reason').textContent=message;el('symbol').textContent=symbol;};
const read=async url=>{
 const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
 if(r.status===401||r.status===403)throw Error('QMES 로그인 후 다시 스캔해 주세요.');
 if(!r.ok)throw Error('조회 실패 ('+r.status+'): '+url.split('?')[0]);
 const result=await r.json();
 if(result?.success!==true)throw Error(result?.message||'서버 응답 확인 필요');
 return result.data;
};
if(!core){show('warn','재고 확인 필요','QMES 재고 계산 모듈을 불러올 수 없습니다.','!');return;}
let iqc,orders;
try{[iqc,orders]=await Promise.all([read('/api/iqc'),read('/api/qmes/work-orders')]);}
catch(err){show('warn','조회 확인 필요',err.message,'!');return;}
if(!Array.isArray(iqc)||!Array.isArray(orders)){show('warn','조회 확인 필요','IQC 또는 작업지시서 응답 형식을 확인해 주세요.','!');return;}
const original=ref?iqc.filter(r=>String(r.id)===ref):iqc.filter(r=>norm(r.lot)===norm(legacyLot)&&core.material(r.item)===core.material(legacyName));
if(original.length!==1){show('warn','검사 확인 필요',original.length?'IQC 기록을 단일 건으로 확정할 수 없습니다.':'해당 수입검사 QR 기록을 찾을 수 없습니다.','!');return;}
const receipt=original[0];
const lot=String(receipt.lot||'').trim(),material=String(receipt.item||'').trim(),supplier=String(receipt.supplier||'').trim();
el('name').textContent=material||'-';el('lot').textContent=lot||'-';el('supplier').textContent=supplier||'미등록';
const oldLink=params.get('iqc');
if(oldLink){try{const link=new URL(oldLink,location.origin);if(link.origin===location.origin&&/^\/iqc-label\/[a-f0-9-]{36}$/i.test(link.pathname)){el('detail').href=link.href;el('detail').hidden=false;}}catch(_){}}
if(ref&& !el('detail').href.includes('/iqc-label/')){
 el('detail').hidden=false;
 el('detail').href='#';
 el('detail').addEventListener('click',async e=>{
  e.preventDefault();const btn=el('detail');
  if(btn.dataset.loading)return;btn.dataset.loading='1';btn.textContent='수입검사 불러오는 중';
  try{
   const r=await fetch('/api/qmes/iqc/label-links',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({recordId:ref}),signal:AbortSignal.timeout(12000)});
   const v=await r.json();if(!r.ok||!v.success||!/^\/iqc-label\/[a-f0-9-]{36}$/i.test(v.path))throw Error('IQC 상세 링크 확인 필요');
   location.href=v.path;
  }catch(err){show('warn','수입검사 조회 필요',err.message,'!');btn.textContent='수입검사 상세보기';delete btn.dataset.loading;}
 });
}
if(!lot||!material){show('warn','검사 확인 필요','수입검사 기록에 원료명 또는 LOT가 없습니다.','!');return;}
const job=orders.filter(w=>norm(w.id)===norm(workRef)||norm(w.fields?.['작업지시번호'])===norm(workRef));
if(!workRef||job.length!==1||!Array.isArray(job[0].materials)){
 show('warn','작업지시 확인 필요','해당 작업지시서를 단일 건으로 확인할 수 없습니다.','!');return;
}
const selected=job[0].materials.filter(m=>core.lot(m.lot)===core.lot(lot)&&core.material(m.name)===core.material(material));
if(!selected.length){
 show('warn','원료 LOT 확인 필요','IQC 기록은 조회됐지만 작업지시서의 원료명·LOT와 일치하지 않습니다.','!');return;
}
const items=(()=>{try{const x=typeof receipt.items_json==='string'?JSON.parse(receipt.items_json):receipt.items_json;return Array.isArray(x)?x:[]}catch(_){return []}})();
const vals=items.flatMap(x=>[x?.judge,x?.result,x?.status,x?.value,...(Array.isArray(x?.values)?x.values:[]),...(Array.isArray(x?.measurements)?x.measurements:[])]).map(v=>String(v??'').trim().toUpperCase());
const fail=vals.some(v=>v.includes('불합격')||v.includes('부적합')||v.includes('미확인')||v==='NG'||v==='FAIL');
const allPass=items.length>0&&items.every(x=>String(x?.judge||'').trim()==='합격');
const iqcState=fail?'불합격':allPass?'합격':String(receipt.judge||items.find(x=>String(x?.name||'').includes('판정'))?.judge||'대기').trim();
el('iqc').textContent=iqcState;el('iqc').className=iqcState==='합격'?'pass':iqcState==='불합격'?'fail':'';
if(iqcState==='불합격'){show('bad','투입 금지','수입검사 불합격 기록이 확인됐습니다.','✕');return;}
if(iqcState!=='합격'){show('warn','IQC 확인 필요','수입검사 합격 판정이 확인되지 않았습니다.','!');return;}
if(!supplier){show('warn','공급업체 확인 필요','IQC는 합격이지만 공급업체가 등록되지 않았습니다.','!');return;}
const queries=[['/api/trace?keyword=','작업실적'],['/api/qmes-sync/inventory','수불기록'],['/api/qmes-quality-gate/holds?lot='+encodeURIComponent(lot),'품질보류']];
const results=await Promise.all(queries.map(async([url,label])=>{try{return {value:await read(url),label}}catch(error){return {error:label+': '+error.message,label}}}));
const errors=results.filter(x=>x.error).map(x=>x.error);
const stock=core.build({
 iqc,orders,actuals:Array.isArray(results[0].value)?results[0].value:[],
 entries:core.readEntries(Array.isArray(results[1].value)?results[1].value:[]),
 holds:Array.isArray(results[2].value?.holds)?results[2].value.holds:[],
 sourceErrors:errors
});
const matched=stock.rows.filter(r=>core.lot(r.lot)===core.lot(lot)&&core.material(r.material)===core.material(material)&&core.supplierKey(r.supplier)===core.supplierKey(supplier));
if(errors.length||stock.warnings.length){show('warn','재고 확인 필요','IQC 합격은 확인됐지만 재고·품질보류 자료 중 일부를 조회하지 못했습니다.','!');return;}
if(matched.length!==1){show('warn','재고 확인 필요','일치하는 원료·LOT·공급업체의 가용재고를 단일 건으로 확인하지 못했습니다.','!');return;}
const entry=matched[0];
if(!entry.uncertain&&Number.isFinite(entry.available))el('qty').textContent=entry.available.toLocaleString('ko-KR',{maximumFractionDigits:3})+' kg';
if(entry.quality==='품질보류'){show('bad','투입 금지','해당 LOT는 품질보류 상태입니다. 품질부 해제 승인 후 사용하세요.','✕');return;}
if(entry.quality!=='사용가능'||entry.uncertain){show('warn','재고 확인 필요','IQC 합격 확인. 재고 계산 또는 수불 이력이 불확실하여 투입을 승인할 수 없습니다.','!');return;}
const planned=Number(String(selected[0].plan??'').replace(/,/g,''));
if(!(entry.available>0)){show('bad','투입 금지','사용가능 재고가 없습니다.','✕');return;}
if(Number.isFinite(planned)&&planned>entry.available+1e-6){show('warn','투입량 확인 필요','계획투입량이 현재 사용가능량을 초과합니다.','!');return;}
show('ok','투입 가능','IQC 합격 · 작업지시 LOT 일치 · 품질보류 없음 · 사용가능량 확인','✓');
})();
</script></body></html>
