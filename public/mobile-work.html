<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b69b7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>NAMO QMES Mobile Work</title>
  <style>
    :root{
      --navy:#102a43;--blue:#0b69b7;--blue2:#168de4;--sky:#eaf5ff;--ink:#13263c;
      --muted:#718095;--line:#dce6ef;--panel:#fff;--bg:#eef3f7;
      --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink)}
    button{font:inherit}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}

    .head{position:relative;z-index:20;padding:calc(9px + var(--safe-top)) 12px 10px;background:linear-gradient(135deg,#0b5ca3 0%,#0e75c7 54%,#1994e6 100%);color:#fff;box-shadow:0 8px 24px rgba(13,83,144,.22)}
    .headrow{display:flex;align-items:center;gap:9px;min-height:45px}
    .back,.more{flex:0 0 42px;width:42px;height:42px;border:1px solid rgba(255,255,255,.24);border-radius:13px;background:rgba(255,255,255,.11);color:#fff;display:grid;place-items:center;font-weight:900;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
    .back{font-size:27px;line-height:1}.more{font-size:22px}
    .heading{min-width:0;flex:1;display:flex;align-items:center;gap:10px}
    .brandmark{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.96);display:grid;place-items:center;color:#0b69b7;font-size:17px;font-weight:950;box-shadow:0 4px 12px rgba(5,46,87,.17)}
    .title{min-width:0;flex:1}
    .title small{display:block;font-size:9.5px;font-weight:850;letter-spacing:.045em;color:rgba(255,255,255,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .title strong{display:block;margin-top:1px;font-size:19px;font-weight:950;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:0 2px;font-size:10.5px;color:rgba(255,255,255,.82);font-weight:750}
    .subrow b{color:#fff;font-weight:900}
    .status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .dot{width:7px;height:7px;border-radius:50%;background:#6cf0ad;box-shadow:0 0 0 3px rgba(108,240,173,.15)}

    .work{position:relative;min-height:0;background:#f4f7fa}
    .frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f4f7fa;opacity:0;transition:opacity .16s ease}
    .frame.ready{opacity:1}
    .loading{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#f8fbfd,#eef3f7);transition:opacity .18s ease}
    .loading.hide{opacity:0;pointer-events:none}
    .loadcard{width:min(292px,84vw);padding:23px 19px;border:1px solid #dce7f0;border-radius:20px;background:#fff;text-align:center;box-shadow:0 16px 44px rgba(31,62,97,.10)}
    .spinner{width:31px;height:31px;margin:0 auto 13px;border:3px solid #dbe8f3;border-top-color:#168de4;border-radius:50%;animation:spin .78s linear infinite}
    .loadcard strong{display:block;font-size:13px;font-weight:950;color:#18314d}.loadcard span{display:block;margin-top:6px;font-size:10px;font-weight:750;color:#8290a1;line-height:1.5}
    @keyframes spin{to{transform:rotate(360deg)}}

    .bottom{position:relative;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 8px calc(7px + var(--safe-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.975);backdrop-filter:blur(16px);box-shadow:0 -8px 24px rgba(31,62,97,.08)}
    .nav{min-height:53px;border:0;border-radius:14px;background:transparent;color:#7d8c9f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:900;cursor:pointer;transition:.13s ease}
    .nav i{font-style:normal;font-size:20px;line-height:1}.nav.active{background:#e9f4fd;color:#0b69b7;box-shadow:inset 0 0 0 1px #d8ebfb}.nav:active{transform:scale(.97)}

    .sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(10,28,47,.40);backdrop-filter:blur(3px)}
    .sheet.open{display:flex}
    .sheetcard{width:100%;max-height:min(78dvh,720px);overflow:auto;padding:10px 12px calc(15px + var(--safe-bottom));border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -22px 64px rgba(10,30,50,.23)}
    .grab{width:42px;height:4px;margin:0 auto 13px;border-radius:999px;background:#d5dde6}
    .sheethead{display:flex;align-items:center;justify-content:space-between;padding:0 3px 10px}.sheethead strong{font-size:16px;font-weight:950;letter-spacing:-.02em}.sheethead span{font-size:10px;color:#8290a1;font-weight:800}
    .modulegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
    .module{min-height:62px;padding:10px;border:1px solid #dfe7ef;border-radius:14px;background:#f9fbfd;color:#20354d;display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer}
    .module.active{border-color:#abd6f7;background:#eef7ff;color:#075c9d;box-shadow:inset 0 0 0 1px #d8edfd}
    .module i{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:#eef4f8;display:grid;place-items:center;font-style:normal;font-size:18px}.module.active i{background:#dceffd}
    .module span{min-width:0}.module b{display:block;font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.module small{display:block;margin-top:3px;font-size:9px;color:#8290a1;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:11px;border-top:1px solid #edf1f5}
    .action{min-height:49px;border:1px solid #dfe7ef;border-radius:13px;background:#f9fbfd;color:#20354d;font-size:11.5px;font-weight:900;cursor:pointer}.action.danger{color:#b32635;background:#fff8f8;border-color:#f0d6d9}

    @media(max-width:360px){.head{padding-left:9px;padding-right:9px}.back,.more{flex-basis:39px;width:39px;height:39px}.brandmark{display:none}.title strong{font-size:17px}.subrow{font-size:9.5px}.module{padding:8px;gap:7px}.module i{width:31px;height:31px;flex-basis:31px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="headrow">
        <button class="back" id="homeBtn" type="button" aria-label="모바일 홈">‹</button>
        <div class="heading">
          <div class="brandmark">N</div>
          <div class="title"><small>NAMO QMES · MOBILE WORKSPACE</small><strong id="pageTitle">업무 화면</strong></div>
        </div>
        <button class="more" id="moreBtn" type="button" aria-label="전체 업무 메뉴">⋮</button>
      </div>
      <div class="subrow"><span id="userText">로그인 사용자 확인 중</span><span class="status"><i class="dot"></i>실시간 업무 연결</span></div>
    </header>

    <main class="work">
      <div class="loading" id="loading"><div class="loadcard"><div class="spinner"></div><strong id="loadingTitle">업무 화면을 준비하고 있습니다</strong><span>화면 폭, 입력창, 표, 버튼을 모바일 업무용으로 자동 최적화합니다.</span></div></div>
      <iframe class="frame" id="workFrame" title="QMES 업무 화면"></iframe>
    </main>

    <nav class="bottom" aria-label="모바일 주요 메뉴">
      <button class="nav" data-tab="home"><i>⌂</i><span>홈</span></button>
      <button class="nav" data-tab="prod"><i>🏭</i><span>생산</span></button>
      <button class="nav" data-tab="pop"><i>🧪</i><span>검사</span></button>
      <button class="nav" data-tab="inv"><i>▣</i><span>재고</span></button>
      <button class="nav" data-tab="trace"><i>⌘</i><span>추적</span></button>
    </nav>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheetcard" role="dialog" aria-modal="true" aria-label="모바일 업무 메뉴">
      <div class="grab"></div>
      <div class="sheethead"><strong>전체 업무</strong><span>NAMO QMES</span></div>
      <div class="modulegrid" id="moduleGrid"></div>
      <div class="actions">
        <button class="action" id="reloadBtn" type="button">현재 화면 새로고침</button>
        <button class="action" id="desktopBtn" type="button">PC 화면으로 보기</button>
        <button class="action" id="mobileHomeBtn" type="button">모바일 홈</button>
        <button class="action danger" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const TAB_META = {
    dash:{title:'종합현황',sub:'KPI · 생산 · 품질 현황',icon:'📊'},
    woIssue:{title:'작업지시',sub:'작업지시 등록 · 조회',icon:'📝'},
    prod:{title:'생산배치',sub:'생산 계획 · 배치 진행',icon:'🏭'},
    prodProcess:{title:'생산공정',sub:'공정 진행 · 생산 실적',icon:'⚙️'},
    iqc:{title:'수입검사',sub:'원자재 입고 품질검사',icon:'🔎'},
    pqc:{title:'공정검사',sub:'공정 중 품질검사',icon:'🧪'},
    oqc:{title:'출하검사',sub:'출하 전 최종 품질검사',icon:'✅'},
    pop:{title:'현장입력',sub:'모바일 · iPad POP',icon:'📱'},
    inv:{title:'재고관리',sub:'원자재 · 완제품 재고',icon:'📦'},
    trace:{title:'LOT 추적',sub:'원자재 → 생산 → 출하',icon:'🔗'},
    eq:{title:'설비관리',sub:'설비 점검 · 상태 관리',icon:'🛠️'},
    partners:{title:'거래처',sub:'고객사 · 공급사 현황',icon:'🏢'},
    spc:{title:'SPC',sub:'공정능력 · Cpk 분석',icon:'📈'},
    lock:{title:'품질 인터락',sub:'품질 차단 · 해제 관리',icon:'🔒'}
  };
  const ORDER=['dash','woIssue','prod','prodProcess','iqc','pqc','oqc','pop','inv','trace','eq','partners','spc','lock'];
  const params=new URLSearchParams(location.search);
  let tab=params.get('tab')||(()=>{try{return sessionStorage.getItem('qmes_current_tab')||'dash';}catch(_){return'dash';}})();
  if(!TAB_META[tab])tab='dash';

  const frame=document.getElementById('workFrame');
  const loading=document.getElementById('loading');
  const pageTitle=document.getElementById('pageTitle');
  const loadingTitle=document.getElementById('loadingTitle');
  const sheet=document.getElementById('sheet');
  const moduleGrid=document.getElementById('moduleGrid');

  function setTitle(next){
    const meta=TAB_META[next]||TAB_META.dash;
    pageTitle.textContent=meta.title;
    loadingTitle.textContent=`${meta.title} 화면을 준비하고 있습니다`;
    document.title=`${meta.title} · NAMO QMES`;
  }
  function navGroup(next){
    if(next==='inv')return'inv';
    if(next==='trace')return'trace';
    if(['iqc','pqc','oqc','pop','spc','lock'].includes(next))return'pop';
    if(['prod','prodProcess','woIssue'].includes(next))return'prod';
    return'home';
  }
  function markNav(next){
    document.querySelectorAll('.nav').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===navGroup(next)));
    moduleGrid.querySelectorAll('.module').forEach(btn=>btn.classList.toggle('active',btn.dataset.module===next));
  }
  function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');}
  function openSheet(){sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');markNav(tab);}

  ORDER.forEach(id=>{
    const meta=TAB_META[id];
    const button=document.createElement('button');
    button.type='button';button.className='module';button.dataset.module=id;
    button.innerHTML=`<i>${meta.icon}</i><span><b>${meta.title}</b><small>${meta.sub}</small></span>`;
    button.addEventListener('click',()=>{closeSheet();loadTab(id,true);});
    moduleGrid.appendChild(button);
  });

  function wrapTables(doc,root){
    (root||doc).querySelectorAll?.('table').forEach(table=>{
      if(table.closest('.qmw-table-scroll'))return;
      const wrap=doc.createElement('div');wrap.className='qmw-table-scroll';
      table.parentNode.insertBefore(wrap,table);wrap.appendChild(table);
    });
  }

  function normalizeWideElements(doc){
    const viewport=Math.max(320,frame.clientWidth||window.innerWidth||390);
    const candidates=doc.querySelectorAll('main div,main section,main article,main form,#root>div>main>div');
    candidates.forEach(el=>{
      if(el.closest('.qmw-table-scroll')||el.closest('[role="dialog"]'))return;
      const cs=doc.defaultView.getComputedStyle(el);
      const min=parseFloat(cs.minWidth)||0;
      const width=el.getBoundingClientRect().width||0;
      if(min>viewport+24||width>viewport*1.35){
        el.style.setProperty('min-width','0','important');
        el.style.setProperty('max-width','100%','important');
      }
    });
    doc.querySelectorAll('main [style*="min-width"],main [style*="width:"]').forEach(el=>{
      if(el.tagName==='TABLE'||el.closest('.qmw-table-scroll'))return;
      const rect=el.getBoundingClientRect();
      if(rect.width>viewport*1.25){
        el.style.setProperty('min-width','0','important');
        el.style.setProperty('max-width','100%','important');
        el.style.setProperty('width','100%','important');
      }
    });
  }

  function injectEnterpriseMobile(doc,currentTab){
    if(!doc||!doc.head||!doc.body)return;
    doc.body.classList.add('qmes-mobile-enterprise-work',`qmes-mobile-tab-${currentTab}`);
    Array.from(doc.body.classList).filter(name=>name.startsWith('qmes-mobile-tab-')&&name!==`qmes-mobile-tab-${currentTab}`).forEach(name=>doc.body.classList.remove(name));

    let style=doc.getElementById('qmes-mobile-enterprise-injected-style-v2');
    if(!style){
      style=doc.createElement('style');style.id='qmes-mobile-enterprise-injected-style-v2';
      style.textContent=`
        html,body{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important;background:#f3f6f9!important;color:#16283d!important}
        body.qmes-mobile-enterprise-work{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif!important;font-size:14px!important}
        body.qmes-mobile-enterprise-work *{box-sizing:border-box!important;min-width:0}
        body.qmes-mobile-enterprise-work #root>div>header,
        body.qmes-mobile-enterprise-work #qmes-sync-sidebar,
        body.qmes-mobile-enterprise-work #qmes-sync-hamburger,
        body.qmes-mobile-enterprise-work #qmes-all-menu-dropdown,
        body.qmes-mobile-enterprise-work #qmes-user-dropdown{display:none!important}
        body.qmes-mobile-enterprise-work #root>div{width:100%!important;max-width:100%!important;min-height:100vh!important;margin:0!important;padding:0!important;background:#f3f6f9!important;color:#16283d!important}
        body.qmes-mobile-enterprise-work #root>div>main,
        body.qmes-mobile-enterprise-work main{width:100%!important;max-width:100%!important;margin:0!important;padding:10px!important;overflow:visible!important;background:#f3f6f9!important}
        body.qmes-mobile-enterprise-work main>div{width:100%!important;max-width:100%!important;margin:0!important}
        body.qmes-mobile-enterprise-work h1{margin-top:0!important;font-size:21px!important;line-height:1.25!important;letter-spacing:-.035em!important;color:#10263d!important}
        body.qmes-mobile-enterprise-work h2{font-size:18px!important;line-height:1.3!important;letter-spacing:-.03em!important;color:#18324e!important}
        body.qmes-mobile-enterprise-work h3{font-size:15px!important;line-height:1.35!important;color:#203b57!important}
        body.qmes-mobile-enterprise-work h4{font-size:13px!important;line-height:1.4!important}
        body.qmes-mobile-enterprise-work p,body.qmes-mobile-enterprise-work label,body.qmes-mobile-enterprise-work span,body.qmes-mobile-enterprise-work td,body.qmes-mobile-enterprise-work th{line-height:1.45!important}
        body.qmes-mobile-enterprise-work section,
        body.qmes-mobile-enterprise-work article,
        body.qmes-mobile-enterprise-work .rounded-xl,
        body.qmes-mobile-enterprise-work .rounded-lg,
        body.qmes-mobile-enterprise-work [class*="card"]{max-width:100%!important;border-radius:15px!important}
        body.qmes-mobile-enterprise-work input,
        body.qmes-mobile-enterprise-work select,
        body.qmes-mobile-enterprise-work textarea{width:100%!important;max-width:100%!important;font-size:16px!important;border-radius:10px!important;box-shadow:none!important}
        body.qmes-mobile-enterprise-work input,body.qmes-mobile-enterprise-work select{min-height:44px!important}
        body.qmes-mobile-enterprise-work textarea{min-height:88px!important;resize:vertical!important}
        body.qmes-mobile-enterprise-work button{min-height:42px!important;max-width:100%!important;border-radius:10px!important;touch-action:manipulation!important;white-space:normal!important;line-height:1.25!important}
        body.qmes-mobile-enterprise-work form{width:100%!important;max-width:100%!important}
        body.qmes-mobile-enterprise-work form .flex,body.qmes-mobile-enterprise-work main .flex{flex-wrap:wrap!important;gap:8px!important}
        body.qmes-mobile-enterprise-work .grid{max-width:100%!important;grid-template-columns:minmax(0,1fr)!important;gap:10px!important}
        body.qmes-mobile-enterprise-work [class*="grid-cols-2"],body.qmes-mobile-enterprise-work [class*="grid-cols-3"],body.qmes-mobile-enterprise-work [class*="grid-cols-4"],body.qmes-mobile-enterprise-work [class*="grid-cols-5"],body.qmes-mobile-enterprise-work [class*="grid-cols-6"]{grid-template-columns:minmax(0,1fr)!important}
        body.qmes-mobile-enterprise-work .qmw-table-scroll{width:100%!important;max-width:100%!important;overflow-x:auto!important;overflow-y:visible!important;-webkit-overflow-scrolling:touch!important;border:1px solid #e0e8f0!important;border-radius:13px!important;background:#fff!important;box-shadow:0 3px 12px rgba(34,61,89,.04)!important}
        body.qmes-mobile-enterprise-work .qmw-table-scroll:after{content:"좌우로 밀어서 표 전체 보기";display:block!important;position:sticky!important;left:0!important;width:max-content!important;min-width:100%!important;padding:7px 10px!important;border-top:1px solid #edf1f5!important;background:#fafcfe!important;color:#8996a6!important;font-size:9px!important;font-weight:750!important;text-align:center!important}
        body.qmes-mobile-enterprise-work table{width:max-content!important;min-width:100%!important;max-width:none!important;border-collapse:separate!important;border-spacing:0!important;font-size:12px!important;white-space:nowrap!important;table-layout:auto!important}
        body.qmes-mobile-enterprise-work th{position:sticky!important;top:0!important;z-index:2!important;background:#eaf3fa!important;color:#23415f!important;font-size:11px!important;font-weight:900!important;overflow:visible!important;text-overflow:clip!important}
        body.qmes-mobile-enterprise-work td,body.qmes-mobile-enterprise-work th{height:auto!important;padding:10px 9px!important;vertical-align:middle!important;overflow:visible!important;text-overflow:clip!important;max-width:none!important}
        body.qmes-mobile-enterprise-work td button{min-height:34px!important;padding:7px 10px!important;white-space:nowrap!important}
        body.qmes-mobile-enterprise-work [role="dialog"]{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:8px!important;border-radius:0!important;overflow:auto!important;align-items:flex-start!important;background:rgba(16,38,61,.42)!important}
        body.qmes-mobile-enterprise-work [role="dialog"]>div,body.qmes-mobile-enterprise-work [role="dialog"]>form{width:100%!important;max-width:none!important;max-height:none!important;margin:0!important;border-radius:16px!important;overflow:visible!important}
        body.qmes-mobile-enterprise-work .qmes-wo-cert,
        body.qmes-mobile-enterprise-work .qmes-prod-process,
        body.qmes-mobile-enterprise-work .inv-enterprise-root,
        body.qmes-mobile-enterprise-work .ipad-pop{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding-left:0!important;padding-right:0!important}
        body.qmes-mobile-enterprise-work .qpp-grid{display:grid!important;grid-template-columns:1fr!important;gap:10px!important}
        body.qmes-mobile-enterprise-work .namo-enterprise-dashboard{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important;padding:0!important}
        body.qmes-mobile-enterprise-work .namo-enterprise-dashboard>*{max-width:100%!important}
        body.qmes-mobile-enterprise-work .namo-enterprise-dashboard table{max-width:none!important}
        body.qmes-mobile-enterprise-work .qmes-side-open{margin-left:0!important;padding-left:0!important}
        body.qmes-mobile-enterprise-work [class*="max-w-"]{max-width:100%!important}
        body.qmes-mobile-enterprise-work [class*="w-screen"]{width:100%!important}
        body.qmes-mobile-enterprise-work [class*="overflow-hidden"]{overflow:visible!important}
        body.qmes-mobile-enterprise-work .qmw-table-scroll,body.qmes-mobile-enterprise-work .qmw-table-scroll *{min-width:revert-layer}

        body.qmes-mobile-tab-dash .namo-enterprise-dashboard [class*="grid"]{grid-template-columns:minmax(0,1fr)!important}
        body.qmes-mobile-tab-dash .namo-enterprise-dashboard [class*="workflow"]{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
        body.qmes-mobile-tab-prod .qmes-wo-form-field,
        body.qmes-mobile-tab-woIssue .qmes-wo-form-field{width:100%!important;max-width:100%!important}
        body.qmes-mobile-tab-prodProcess .qpp-card{width:100%!important;max-width:100%!important}
        body.qmes-mobile-tab-iqc main>div,
        body.qmes-mobile-tab-pqc main>div,
        body.qmes-mobile-tab-oqc main>div{max-width:100%!important}
        body.qmes-mobile-tab-pop .ipad-pop{font-size:14px!important}
        body.qmes-mobile-tab-inv #qmes-inventory-host{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
        body.qmes-mobile-tab-trace svg{max-width:100%!important;height:auto!important}

        @media(max-width:560px){
          body.qmes-mobile-enterprise-work #root>div>main,body.qmes-mobile-enterprise-work main{padding:8px!important}
          body.qmes-mobile-enterprise-work .px-6,body.qmes-mobile-enterprise-work .px-5,body.qmes-mobile-enterprise-work .p-6,body.qmes-mobile-enterprise-work .p-5{padding-left:11px!important;padding-right:11px!important}
          body.qmes-mobile-enterprise-work .gap-6,body.qmes-mobile-enterprise-work .gap-5,body.qmes-mobile-enterprise-work .gap-4{gap:9px!important}
          body.qmes-mobile-enterprise-work [class*="text-3xl"],body.qmes-mobile-enterprise-work [class*="text-4xl"]{font-size:21px!important;line-height:1.25!important}
        }
      `;
      doc.head.appendChild(style);
    }

    wrapTables(doc);
    normalizeWideElements(doc);

    if(!doc.defaultView.__QMES_MOBILE_ENTERPRISE_OBSERVER_V2__){
      doc.defaultView.__QMES_MOBILE_ENTERPRISE_OBSERVER_V2__=true;
      let timer=0;
      const observer=new doc.defaultView.MutationObserver(records=>{
        records.forEach(record=>record.addedNodes.forEach(node=>{
          if(node.nodeType!==1)return;
          if(node.matches?.('table'))wrapTables(doc,node.parentElement);else if(node.querySelector?.('table'))wrapTables(doc,node);
        }));
        clearTimeout(timer);timer=setTimeout(()=>normalizeWideElements(doc),80);
      });
      observer.observe(doc.body,{childList:true,subtree:true});
      doc.defaultView.addEventListener('resize',()=>normalizeWideElements(doc),{passive:true});
    }
    doc.documentElement.scrollTop=0;doc.body.scrollTop=0;
  }

  function updateUrl(next,push){
    const url=new URL(location.href);url.searchParams.set('tab',next);url.searchParams.set('v','20260903-mobile-enterprise-v2');
    history[push?'pushState':'replaceState']({tab:next},'',url);
  }

  function loadTab(next,push=false){
    tab=TAB_META[next]?next:'dash';setTitle(tab);markNav(tab);updateUrl(tab,push);
    loading.classList.remove('hide');frame.classList.remove('ready');
    try{sessionStorage.setItem('qmes_current_tab',tab);sessionStorage.setItem('qmes_mobile_last_tab',tab);}catch(_){}
    frame.src=`/index.html?desktop=1&embeddedMobile=1&tab=${encodeURIComponent(tab)}&v=20260903-mobile-enterprise-v2`;
  }

  frame.addEventListener('load',()=>{
    let tries=0;
    const apply=()=>{
      tries+=1;
      try{
        if(frame.contentWindow?.sessionStorage)frame.contentWindow.sessionStorage.setItem('qmes_current_tab',tab);
        injectEnterpriseMobile(frame.contentDocument,tab);
        frame.classList.add('ready');loading.classList.add('hide');
      }catch(_){if(tries>2){frame.classList.add('ready');loading.classList.add('hide');}}
      if(tries<7)setTimeout(apply,tries<3?180:520);
    };
    apply();
  });

  document.getElementById('homeBtn').addEventListener('click',()=>location.replace('/mobile.html?v=20260903-mobile-enterprise-v2'));
  document.getElementById('mobileHomeBtn').addEventListener('click',()=>location.replace('/mobile.html?v=20260903-mobile-enterprise-v2'));
  document.getElementById('moreBtn').addEventListener('click',openSheet);
  sheet.addEventListener('click',event=>{if(event.target===sheet)closeSheet();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeSheet();});
  document.getElementById('reloadBtn').addEventListener('click',()=>{closeSheet();loading.classList.remove('hide');frame.classList.remove('ready');frame.contentWindow?.location.reload();});
  document.getElementById('desktopBtn').addEventListener('click',()=>location.href=`/index.html?desktop=1&tab=${encodeURIComponent(tab)}&v=20260903-mobile-enterprise-v2`);
  document.getElementById('logoutBtn').addEventListener('click',async()=>{
    try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'});}catch(_){}
    try{['qmes-current-user-v1','qmes_current_tab','qmes_mobile_last_tab','qmes_open_menu','qmes_namo_talk_open'].forEach(key=>sessionStorage.removeItem(key));}catch(_){}
    location.replace('/index.html?desktop=1&logout=1&v=20260903-mobile-enterprise-v2');
  });

  document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{
    const next=btn.dataset.tab;
    if(next==='home'){location.replace('/mobile.html?v=20260903-mobile-enterprise-v2');return;}
    loadTab(next,true);
  }));
  window.addEventListener('popstate',event=>{
    const next=event.state?.tab||new URLSearchParams(location.search).get('tab');
    if(next&&TAB_META[next]&&next!==tab)loadTab(next,false);
  });

  fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'})
    .then(async response=>{const payload=await response.json().catch(()=>null);if(!response.ok||!payload||payload.success===false)throw new Error('unauthorized');return payload.data?.user||payload.data||payload;})
    .then(user=>{const name=String(user?.name||user?.loginId||user?.email||'').trim();document.getElementById('userText').innerHTML=name?`<b>${name}</b>님 · 모바일 업무`:'로그인 사용자';})
    .catch(()=>{document.getElementById('userText').textContent='로그인 세션 확인 필요';});

  setTitle(tab);markNav(tab);updateUrl(tab,false);loadTab(tab,false);
})();
</script>
</body>
</html>
