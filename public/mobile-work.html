<script>
(() => {
  'use strict';
  const VERSION='20260903-native-entry1', SESSION_KEY='qmes-current-user-v1';
  const params=new URLSearchParams(location.search), clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim(), num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.+-]/g,''));return Number.isFinite(n)?n:0}, esc=v=>clean(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[ch]||ch)), fmt=(v,d=0)=>Number(v||0).toLocaleString('ko-KR',{maximumFractionDigits:d});
  const first=(row,keys,fallback='')=>{for(const k of keys){const v=row&&row[k];if(v!==undefined&&v!==null&&clean(v)!=='')return v}return fallback};
  const isDone=v=>/완료|생산완료|출하완료|납품완료|마감|종료|합격|적합|PASS|OK/i.test(clean(v)), isBad=v=>/불합격|부적합|FAIL|NG|차단|이상|지연/i.test(clean(v));
  const statusOf=row=>clean(first(row,['status','workStatus','productionStatus','judge','judgement','result','deliveryStatus','shipping','state'],'-'))||'-';

  function purchaseOptions(selected=''){const items=purchaseOrders.map(o=>clean(o.purchaseNo||o.purchase_no||o.no)).filter(Boolean);if(selected&&!items.includes(selected))items.unshift(selected);return `<option value="">발주번호 선택</option>${items.map(no=>`<option value="${esc(no)}" ${no===selected?'selected':''}>${esc(no)}</option>`).join('')}`}
  function renderIqcForm(target){const r=target?.row||{},recv=clean(r.recv||today()).slice(0,10),inspect=clean(r.inspectedAt||r.recv||today()).slice(0,10),inNo=r.inNo||nextIqcNo(recv);editorBody.innerHTML=`<div class="form-note">PC 수입검사와 같은 필드 구조로 저장합니다. 신규 등록은 공용 DB에 바로 저장되고 PC IQC에서 동기화됩니다.</div><form class="form-grid" id="iqcForm"><div class="form-field"><label>입고번호</label><input name="inNo" value="${esc(inNo)}" readonly></div><div class="form-field"><label>발주번호 *</label><select name="purchaseOrderNo" id="purchaseSelect">${purchaseOptions(clean(r.purchaseOrderNo||r.purchaseOrder))}</select></div><div class="form-field"><label>입고일자 *</label><input name="recvDate" type="date" value="${esc(recv)}" ${target?'readonly':''}></div><div class="form-field"><label>검사일자 *</label><input name="inspectDate" type="date" value="${esc(inspect)}"></div><div class="form-field"><label>LOT No. *</label><input name="lot" value="${esc(r.lot||'')}" autocomplete="off"></div><div class="form-field"><label>원재료명 *</label><input name="name" value="${esc(r.name||'NMP')}"></div><div class="form-field"><label>업체명</label><input name="supplier" value="${esc(r.supplier==='-'?'':r.supplier||'')}"></div><div class="form-field"><label>입고수량 (kg) *</label><input name="qty" type="number" min="0" step="0.001" inputmode="decimal" value="${esc(num(r.qty)||'')}"></div><div class="form-field"><label>검사수량 (EA) *</label><input name="inspectQty" type="number" min="0" step="1" inputmode="numeric" value="${esc(num(r.inspectQty)||'')}"></div><div class="form-field"><label>불량수량 (EA)</label><input name="defectQty" type="number" min="0" step="1" inputmode="numeric" value="${esc(num(r.defectQty)||0)}"></div><div class="form-field"><label>포장형태</label><select name="packagingType"><option value="">선택</option>${['Drum','IBC','Pail','Bag','기타'].map(v=>`<option ${clean(r.packagingType)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-field"><label>입고 포장수량</label><input name="packageQty" type="number" min="1" step="1" value="${esc(r.packageQty||1)}"></div><div class="form-field"><label>용기당 중량 (kg)</label><input name="unitWeight" type="number" min="0" step="0.001" value="${esc(r.unitWeight||'')}"></div><div class="form-section"><strong>검사 판정</strong><div class="judge-grid">${['visual:외관','label:라벨','weight:중량','coa:COA'].map(item=>{const[key,label]=item.split(':'),value=r[key]||'합격';return`<div class="form-field"><label>${label}</label><select name="${key}"><option value="합격" ${value==='합격'?'selected':''}>합격</option><option value="불합격" ${value==='불합격'?'selected':''}>불합격</option></select></div>`}).join('')}</div></div><div class="form-field"><label>검사자 *</label><input name="inspector" value="${esc(r.inspector||r.by||currentUser||'')}"></div><div class="form-field full"><label>특이사항</label><textarea name="remarks">${esc(r.remarks||r.note||'')}</textarea></div><div class="form-actions"><button type="button" data-close-editor>취소</button><button class="save" type="submit">저장</button></div></form>`;editorBody.querySelector('[data-close-editor]').addEventListener('click',closeEditor);document.getElementById('purchaseSelect').addEventListener('change',event=>{const no=event.target.value,o=purchaseOrders.find(x=>clean(x.purchaseNo||x.purchase_no||x.no)===no);if(!o)return;const form=event.target.form,remaining=Math.max(0,num(o.qty)-num(o.receivedQty||o.received_qty));form.supplier.value=clean(o.supplier);form.name.value=clean(o.item||o.material)||form.name.value;if(!form.qty.value)form.qty.value=remaining||num(o.receivedQty||o.received_qty||o.qty)||'';if(!form.lot.value)form.lot.value=clean(o.materialLot||o.material_lot)});document.getElementById('iqcForm').addEventListener('submit',saveIqc)}
  async function saveIqc(event){event.preventDefault();const fd=new FormData(event.currentTarget),inNo=clean(fd.get('inNo')),purchaseOrderNo=clean(fd.get('purchaseOrderNo')),recv=clean(fd.get('recvDate')),inspectedAt=clean(fd.get('inspectDate')),lot=clean(fd.get('lot')),name=clean(fd.get('name')),supplier=clean(fd.get('supplier'))||'-',qty=num(fd.get('qty')),inspectQty=num(fd.get('inspectQty')),defectQty=num(fd.get('defectQty')),inspector=clean(fd.get('inspector'));if(!purchaseOrderNo||!recv||!inspectedAt||lot.length<2||!name||qty<=0||inspectQty<=0||!inspector){showFormError('발주번호, 입고/검사일자, LOT, 원재료명, 입고수량, 검사수량, 검사자를 확인하세요.');return}if(defectQty>inspectQty){showFormError('불량수량은 검사수량보다 클 수 없습니다.');return}const packageQty=Math.max(1,Math.trunc(num(fd.get('packageQty'))||1)),unitWeight=num(fd.get('unitWeight')),calculatedWeight=packageQty*unitWeight,judge=overall(fd);const rowData={inNo,purchaseOrderNo,purchaseLinkStatus:'발주연결',recv,inspectedAt,lot,code:'-',name,supplier,qty:`${qty} kg`,inspectQty:`${inspectQty} EA`,defectQty:`${defectQty} EA`,packagingType:clean(fd.get('packagingType')),packagingTypeOther:'',packageQty,unitWeight,calculatedWeight,barcodeQty:packageQty,visual:fd.get('visual'),label:fd.get('label'),weight:fd.get('weight'),coa:fd.get('coa'),remarks:clean(fd.get('remarks')),judge,note:judge==='불합격'?'즉시 격리 → 사용차단 → 업체 통보':'',inspector,by:inspector,source:'MOBILE QMES'};let holds=Array.isArray(editTarget?.payload?.holds)?editTarget.payload.holds.slice():[];if(judge==='불합격'&&!holds.some(h=>clean(h.target).includes(lot))){holds.unshift({id:`HLD-M-${Date.now()}`,target:`${lot} (${inNo})`,type:'원재료 Lot',gate:'IQC 게이트',reason:'수입검사 불합격 — 판정·승인 완료 전 생산 불출 차단',since:recv,cond:'격리 후 불합격 처리 확정',status:'차단중',ncr:'-'})}const payload={...(editTarget?.payload||{}),mode:'IQC',lotNo:lot,rows:[rowData],holds,lotRecord:editTarget?.payload?.lotRecord||null,savedAt:new Date().toISOString(),savedBy:inspector};setLoading(true,'수입검사 데이터를 저장하는 중입니다.');try{await api('/api/qmes-sync/iqc',{method:'POST',body:JSON.stringify({key:editTarget?.recordKey||inNo,payload})});closeEditor();await loadData();setMessage(`수입검사 ${inNo}가 공용 DB에 저장되었습니다.`)}catch(error){if(error.message!=='AUTH')showFormError(`저장 실패: ${error.message}`)}finally{setLoading(false)}}

  function setPage(){config=MODULES[tab]||MODULES.woIssue;headTitle.textContent=config.title;pageTitle.textContent=config.title;pageDesc.textContent=config.desc;searchInput.placeholder=`${config.title} 검색`;document.querySelectorAll('.bottom-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===tab||(tab==='prod'&&btn.dataset.nav==='prodProcess')||(['pqc','oqc','pop','spc','lock'].includes(tab)&&btn.dataset.nav==='iqc')));document.querySelectorAll('.module-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));try{sessionStorage.setItem('qmes_current_tab',tab);sessionStorage.setItem('qmes_mobile_last_tab',tab)}catch(_){}loadData()}
  function navigate(next){if(next==='home'){location.assign(`/mobile.html?v=${VERSION}`);return}location.assign(`/mobile-work.html?tab=${encodeURIComponent(next)}&v=${VERSION}`)}
  Object.entries(MODULES).forEach(([key,item])=>{const button=document.createElement('button');button.type='button';button.className='module-btn';button.dataset.tab=key;button.innerHTML=`<i>${ICONS[item.icon]||''}</i><span><b>${esc(item.title)}</b><small>${esc(item.desc)}</small></span>`;button.addEventListener('click',()=>navigate(key));moduleGrid.appendChild(button)});
  async function initUser(){let cached=null;try{cached=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')}catch(_){}const apply=user=>{const name=clean(user&&(user.name||user.loginId||user.email));if(name){currentUser=name;document.getElementById('userName').textContent=`${name}님`;return true}return false};if(cached)apply(cached);try{const user=await api('/api/auth/me');apply(user?.user||user)}catch(error){if(error.message!=='AUTH')document.getElementById('userName').textContent='로그인 필요'}}
  async function loadPurchases(){try{const data=await api('/api/purchase-orders');purchaseOrders=Array.isArray(data)?data:[]}catch(_){purchaseOrders=[]}}
  searchInput.addEventListener('input',filterRows);document.getElementById('refreshBtn').addEventListener('click',loadData);createBtn.addEventListener('click',()=>openEditor(null));document.getElementById('traceForm').addEventListener('submit',event=>{event.preventDefault();loadTrace(document.getElementById('traceKeyword').value)});document.getElementById('backBtn').addEventListener('click',()=>location.assign(`/mobile.html?v=${VERSION}`));document.getElementById('homeBtn').addEventListener('click',()=>navigate('home'));document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.nav)));
  const openSheet=()=>{sheet.classList.add('open');sheet.setAttribute('aria-hidden','false')},closeSheet=()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')};document.getElementById('menuBtn').addEventListener('click',openSheet);sheet.addEventListener('click',event=>{if(event.target===sheet)closeSheet()});editor.addEventListener('click',event=>{if(event.target===editor)closeEditor()});document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'})}catch(_){}try{sessionStorage.removeItem(SESSION_KEY)}catch(_){}location.replace('/index.html?logout=1&mobileLogin=1')});
  Promise.all([initUser(),loadPurchases()]).finally(setPage);
})();
</script>
