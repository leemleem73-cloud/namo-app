<script>
(() => {

  const frame=document.getElementById('workFrame'),loading=document.getElementById('loading'),pageTitle=document.getElementById('pageTitle'),loadingTitle=document.getElementById('loadingTitle'),sheet=document.getElementById('sheet'),moduleGrid=document.getElementById('moduleGrid');

  function navGroup(next){if(next==='inv')return'inv';if(next==='trace')return'trace';if(['iqc','pqc','oqc','pop','spc','lock'].includes(next))return'pop';if(['prod','prodProcess','woIssue'].includes(next))return'prod';return'home';}
  function markNav(next){document.querySelectorAll('.nav').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===navGroup(next)));moduleGrid.querySelectorAll('.module').forEach(btn=>btn.classList.toggle('active',btn.dataset.module===next));}

  ORDER.forEach(id=>{const meta=TAB_META[id],button=document.createElement('button');button.type='button';button.className='module';button.dataset.module=id;button.innerHTML=`<i>${ICONS[id]||ICONS.dash}</i><span><b>${meta.title}</b><small>${meta.sub}</small></span>`;button.addEventListener('click',()=>{closeSheet();loadTab(id,true)});moduleGrid.appendChild(button)});
