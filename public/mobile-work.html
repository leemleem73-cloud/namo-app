<body>
<div class="app">
  <header class="head">

<script>
(() => {
  'use strict';
  const VERSION='20260903-native-work1';
  const SESSION_KEY='qmes-current-user-v1';
  const params=new URLSearchParams(location.search);
  const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
  const num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.+-]/g,''));return Number.isFinite(n)?n:0};
  const first=(row,keys,fallback='')=>{for(const k of keys){const v=row&&row[k];if(v!==undefined&&v!==null&&clean(v)!=='')return v}return fallback};
  const esc=v=>clean(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const fmt=(v,d=0)=>Number(v||0).toLocaleString('ko-KR',{maximumFractionDigits:d});
  const isDone=v=>/완료|생산완료|출하완료|납품완료|마감|종료|합격|적합|PASS|OK/i.test(clean(v));
  const isBad=v=>/불합격|부적합|FAIL|NG|차단|이상|지연/i.test(clean(v));
  const statusOf=row=>clean(first(row,['status','workStatus','productionStatus','judge','judgement','result','deliveryStatus','shipping','state'],'-'))||'-';
  const tone=v=>{const s=clean(v);if(isBad(s))return'red';if(isDone(s))return'green';if(/진행|생산|작업|발행|확정/i.test(s))return'blue';if(/대기|예정|검사|부분/i.test(s))return'orange';return''};
  const dateText=v=>{const s=clean(v);if(!s)return'-';return s.length>16?s.slice(0,16).replace('T',' '):s};

  const MODULES={
    dash:{title:'종합현황',desc:'모바일 QMES 홈',mode:'home',icon:'grid'},
    woIssue:{title:'작업지시',desc:'작업지시 등록 · 진행 현황',sync:'workorder',kind:'work',icon:'clipboard'},
    prod:{title:'생산배치',desc:'생산 계획 · 배치 진행',sync:'workorder',kind:'prod',icon:'factory'},
    prodProcess:{title:'생산공정',desc:'공정 진행 · 생산 실적',sync:'workorder',kind:'prod',icon:'process'},
    iqc:{title:'수입검사',desc:'원자재 입고 품질검사',sync:'iqc',kind:'quality',icon:'shield'},
    pqc:{title:'공정검사',desc:'공정 중 품질검사',sync:'pqc',kind:'quality',icon:'flask'},
    oqc:{title:'출하검사',desc:'출하 전 최종 품질검사',sync:'oqc',kind:'quality',icon:'check'},
    pop:{title:'현장입력',desc:'모바일 · iPad 현장 기록',sync:'workorder',kind:'prod',icon:'tablet'},
    inv:{title:'재고관리',desc:'원자재 · 완제품 재고 현황',sync:'inventory',kind:'inventory',icon:'box'},
    trace:{title:'LOT 추적',desc:'원자재 → 생산 → 품질 → 출하 추적',mode:'trace',kind:'trace',icon:'link'},
    eq:{title:'설비관리',desc:'설비 점검 · 상태 현황',sync:'equipment',kind:'equipment',icon:'tool'},
    spc:{title:'SPC',desc:'품질 데이터 · 공정능력 확인',multi:['pqc','oqc'],kind:'quality',icon:'chart'},
    lock:{title:'품질 인터락',desc:'부적합 · 차단 항목 확인',multi:['iqc','pqc','oqc'],kind:'interlock',icon:'lock'},
    partners:{title:'거래처',desc:'모바일 기준정보 조회',mode:'unsupported',kind:'partners',icon:'building'}
  };
  const ICONS={
    grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    clipboard:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM8 12h8M8 16h6"/></svg>',
    factory:'<svg viewBox="0 0 24 24"><path d="M3 21V10l6 3V9l6 4V7l6 4v10Z"/><path d="M7 17h2M13 17h2M18 17h2"/></svg>',
    process:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    shield:'<svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.2 8 10 4.6-1.8 8-5 8-10V6Z"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
    flask:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-5 9a2.5 2.5 0 0 0 2.2 4h9.6a2.5 2.5 0 0 0 2.2-4l-5-9V3"/><path d="M7.5 15h9"/></svg>',
    check:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-7"/></svg>',
    tablet:'<svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M10 18h4"/></svg>',
    box:'<svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M9 8H7a4 4 0 0 0 0 8h2M15 8h2a4 4 0 1 1 0 8h-2M8 12h8"/></svg>',
    tool:'<svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L3.5 17.5l3 3 6-6a4 4 0 0 0 5-5l-2.5 2.5-3-3Z"/></svg>',
    chart:'<svg viewBox="0 0 24 24"><path d="M4 20V5M4 20h16"/><path d="m7 15 4-4 3 2 5-6"/></svg>',
    lock:'<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>',
    building:'<svg viewBox="0 0 24 24"><path d="M4 21V4h11v17M15 9h5v12M8 8h3M8 12h3M8 16h3M2 21h20"/></svg>'
  };

  const FIELD_SETS={
    work:[['작업지시번호',['workOrderNo','workOrder','no','lot','id']],['제품명',['product','productName','item','name']],['생산 LOT',['productionLot','lot','lotNo']],['계획량',['plan','plannedQty','targetQty','qty','amount']],['실적량',['actualQty','productionQty','prodQty','done','actual','productionActual']],['작업일자',['date','workDate','productionDate','startDate','createdAt','created_at']]],
    prod:[['생산 LOT',['productionLot','lot','lotNo','workOrderNo','workOrder','no']],['제품명',['product','productName','item','name']],['계획량',['plan','plannedQty','targetQty','qty','amount']],['생산실적',['actualQty','productionQty','prodQty','done','actual','productionActual']],['공정',['process','processName','step','stage']],['생산일자',['productionDate','date','workDate','startDate']]],
    quality:[['검사번호',['inspectionNo','inspectionId','id','no','groupId']],['LOT',['lot','lotNo','materialLot','productionLot','workOrder']],['품목',['material','materialName','product','productName','item']],['판정',['judge','judgement','result','status']],['검사일자',['date','inspectionDate','createdAt','created_at']],['검사자',['inspector','inspectorName','createdBy','updated_by']]],
    inventory:[['LOT',['lot','lotNo','materialLot','finishedLot','productionLot']],['품목',['material','materialName','product','productName','item','name']],['현재수량',['currentQty','stockQty','remainingQty','qty','amount','quantity']],['단위',['unit','uom']],['창고',['warehouse','storage','location']],['갱신일',['updatedAt','updated_at','date','createdAt']]],
    equipment:[['설비번호',['equipmentNo','equipmentId','code','id','no']],['설비명',['equipmentName','name','equipment']],['상태',['status','state']],['점검일',['inspectionDate','checkDate','date','updatedAt','updated_at']],['담당자',['manager','inspector','owner']],['비고',['note','remark','memo']]],
    trace:[['LOT',['lot','lotNo','materialLot','finishedLot','productionLot']],['작업지시',['workOrderNo','workOrder','wo']],['품목',['material','materialName','product','productName','item']],['공정',['process','stage','step']],['상태',['status','state','judge']],['일자',['date','productionDate','inspectionDate','shipDate','createdAt']]],
    partners:[['거래처',['partner','customer','supplier','name']],['구분',['type','category']],['담당자',['manager','contact']],['연락처',['phone','tel']],['이메일',['email']],['비고',['note','remark']]]
  };

  const headTitle=document.getElementById('headTitle'),pageTitle=document.getElementById('pageTitle'),pageDesc=document.getElementById('pageDesc'),sumAll=document.getElementById('sumAll'),sum2=document.getElementById('sum2'),sum3=document.getElementById('sum3'),sum2Label=document.getElementById('sum2Label'),sum3Label=document.getElementById('sum3Label'),recordList=document.getElementById('recordList'),searchInput=document.getElementById('searchInput'),message=document.getElementById('message'),traceArea=document.getElementById('traceArea'),toolbar=document.getElementById('toolbar'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText'),sheet=document.getElementById('sheet'),moduleGrid=document.getElementById('moduleGrid');
  let tab=params.get('tab')||'woIssue', config=MODULES[tab]||MODULES.woIssue, rawRows=[], visibleRows=[], authenticated=false;

  async function api(path,options){const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...(options||{})});const payload=await response.json().catch(()=>null);if(response.status===401){location.replace('/index.html?mobileLogin=1');throw new Error('AUTH')}if(!response.ok||payload?.success===false)throw new Error(payload?.message||`HTTP ${response.status}`);return payload?.data!==undefined?payload.data:payload}
  function flattenPayload(payload,meta={}){if(payload==null)return[];if(Array.isArray(payload))return payload.flatMap(item=>flattenPayload(item,meta));if(typeof payload!=='object')return[];for(const key of ['rows','items','list','lots','inventory','stocks','data']){if(Array.isArray(payload[key]))return payload[key].flatMap(item=>flattenPayload(item,meta))}return[{...payload,...meta}]}
  function normalizeSync(records){const list=Array.isArray(records)?records:[];return list.flatMap(record=>{if(record&&Object.prototype.hasOwnProperty.call(record,'payload'))return flattenPayload(record.payload,{_recordKey:record.record_key||record.recordKey||'',_updatedAt:record.updated_at||record.updatedAt||''});return flattenPayload(record)})}
  function rowUpdated(row){return clean(first(row,['_updatedAt','updatedAt','updated_at','modifiedAt','createdAt','created_at','date','workDate','productionDate','inspectionDate'],''))}
  function rowTitle(row,index){const kind=config.kind;if(kind==='quality')return clean(first(row,['lot','lotNo','materialLot','productionLot','inspectionNo','id'],`검사 ${index+1}`));if(kind==='inventory')return clean(first(row,['lot','lotNo','materialLot','finishedLot','product','material','item'],`재고 ${index+1}`));if(kind==='equipment')return clean(first(row,['equipmentName','name','equipmentNo','code'],`설비 ${index+1}`));if(kind==='trace')return clean(first(row,['lot','lotNo','productionLot','workOrderNo','workOrder'],`추적 ${index+1}`));return clean(first(row,['workOrderNo','workOrder','no','lot','productionLot','product'],`업무 ${index+1}`))}
  function rowSub(row){if(config.kind==='quality')return [first(row,['material','materialName','product','productName','item']),first(row,['date','inspectionDate','createdAt','created_at'])].filter(v=>clean(v)).join(' · ');if(config.kind==='inventory')return [first(row,['material','materialName','product','productName','item']),first(row,['warehouse','storage','location'])].filter(v=>clean(v)).join(' · ');if(config.kind==='equipment')return [first(row,['equipmentNo','code','id']),first(row,['inspectionDate','checkDate','date'])].filter(v=>clean(v)).join(' · ');return [first(row,['product','productName','item','name']),first(row,['date','workDate','productionDate','startDate'])].filter(v=>clean(v)).join(' · ')}
  function displayValue(label,value){if(value===undefined||value===null||clean(value)==='')return'-';if(/량|수량|중량|실적/.test(label)&&Number.isFinite(Number(value)))return Number(value).toLocaleString('ko-KR',{maximumFractionDigits:3});return clean(value)}
  function fieldsFor(){if(config.kind==='interlock')return FIELD_SETS.quality;return FIELD_SETS[config.kind]||FIELD_SETS.work}
  function renderRows(rows){visibleRows=rows;const fields=fieldsFor();if(!rows.length){recordList.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><strong>표시할 데이터가 없습니다.</strong><span>서버에 동기화된 QMES 데이터가 없거나 검색 조건과 일치하는 항목이 없습니다.</span></div>';return}recordList.innerHTML=rows.map((row,index)=>{const status=statusOf(row);const fieldHtml=fields.map(([label,keys])=>`<div class="field"><label>${esc(label)}</label><span>${esc(displayValue(label,first(row,keys,'-')))}</span></div>`).join('');return`<article class="record"><div class="record-head"><div class="record-no">${String(index+1).padStart(2,'0')}</div><div class="record-title"><strong>${esc(rowTitle(row,index))}</strong><span>${esc(rowSub(row)||rowUpdated(row)||config.desc)}</span></div><span class="badge ${tone(status)}">${esc(status)}</span></div><div class="fields">${fieldHtml}</div></article>`}).join('')}
  function updateSummary(rows){const statuses=rows.map(statusOf);const active=statuses.filter(s=>!isDone(s)&&!isBad(s)&&s!=='-').length;const issues=statuses.filter(isBad).length;const latest=rows.map(rowUpdated).filter(Boolean).sort().reverse()[0]||'-';sumAll.textContent=fmt(rows.length);if(config.kind==='quality'||config.kind==='interlock'){sum2Label.textContent='이상';sum2.textContent=fmt(issues)}else{sum2Label.textContent='진행';sum2.textContent=fmt(active)}sum3Label.textContent='최근 갱신';sum3.textContent=latest==='-'?'-':dateText(latest).slice(5,16)}
  function filterRows(){const q=clean(searchInput.value).toLowerCase();if(!q){renderRows(rawRows);updateSummary(rawRows);return}const rows=rawRows.filter(row=>Object.values(row||{}).some(value=>typeof value!=='object'&&clean(value).toLowerCase().includes(q)));renderRows(rows);updateSummary(rows)}
  function setMessage(text,type=''){message.textContent=text||'';message.className=`message${text?' show':''}${type?` ${type}`:''}`}
  function setLoading(show,text){loadingText.textContent=text||'데이터를 불러오는 중입니다.';loading.classList.toggle('show',!!show)}

  async function loadTrace(keyword){const q=clean(keyword);rawRows=[];renderRows([]);updateSummary([]);if(!q){setMessage('LOT 또는 작업지시번호를 입력해 추적하세요.','');return}setLoading(true,'LOT 추적 데이터를 조회하는 중입니다.');setMessage('');try{const data=await api(`/api/trace?keyword=${encodeURIComponent(q)}`);rawRows=flattenPayload(data);renderRows(rawRows);updateSummary(rawRows);if(!rawRows.length)setMessage('입력한 조건과 일치하는 LOT 추적 데이터가 없습니다.','warn')}catch(error){if(error.message!=='AUTH')setMessage(`LOT 추적 조회 실패: ${error.message}`,'error')}finally{setLoading(false)}}
  async function loadData(){if(config.mode==='home'){location.replace(`/mobile.html?v=${VERSION}`);return}if(config.mode==='trace'){traceArea.style.display='block';toolbar.style.display='none';updateSummary([]);setMessage('LOT 또는 작업지시번호를 입력해 추적하세요.');return}traceArea.style.display='none';toolbar.style.display='grid';if(config.mode==='unsupported'){rawRows=[];renderRows([]);updateSummary([]);setMessage('이 메뉴는 PC 브라우저의 로컬 데이터가 아니라 서버 공유 데이터로 전환한 뒤 모바일에서 동일하게 제공할 예정입니다. 현재 PC 화면으로 강제 이동하지 않습니다.','warn');return}setLoading(true,`${config.title} 데이터를 불러오는 중입니다.`);setMessage('');try{let rows=[];if(config.multi){const groups=await Promise.all(config.multi.map(type=>api(`/api/qmes-sync/${type}`).catch(()=>[])));rows=groups.flatMap(normalizeSync)}else{rows=normalizeSync(await api(`/api/qmes-sync/${config.sync}`))}if(config.kind==='interlock')rows=rows.filter(row=>isBad(statusOf(row)));rawRows=rows;filterRows();if(!rows.length)setMessage(`${config.title} 서버 동기화 데이터가 없습니다. PC 화면을 띄우지 않고 모바일 화면을 유지합니다.`,'warn')}catch(error){if(error.message!=='AUTH')setMessage(`${config.title} 데이터를 불러오지 못했습니다: ${error.message}`,'error');rawRows=[];renderRows([]);updateSummary([])}finally{setLoading(false)}}

  function setPage(){config=MODULES[tab]||MODULES.woIssue;headTitle.textContent=config.title;pageTitle.textContent=config.title;pageDesc.textContent=config.desc;searchInput.placeholder=`${config.title} 검색`;document.querySelectorAll('.bottom-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===tab||(tab==='prod'&&btn.dataset.nav==='prodProcess')||(['pqc','oqc','pop','spc','lock'].includes(tab)&&btn.dataset.nav==='iqc')));document.querySelectorAll('.module-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));try{sessionStorage.setItem('qmes_current_tab',tab);sessionStorage.setItem('qmes_mobile_last_tab',tab)}catch(_){}loadData()}
  function navigate(next){if(next==='home'||next==='dash'){location.assign(`/mobile.html?v=${VERSION}`);return}location.assign(`/mobile-work.html?tab=${encodeURIComponent(next)}&v=${VERSION}`)}

  Object.entries(MODULES).forEach(([key,item])=>{if(key==='dash')return;const button=document.createElement('button');button.type='button';button.className='module-btn';button.dataset.tab=key;button.innerHTML=`<i>${ICONS[item.icon]||ICONS.grid}</i><span><b>${esc(item.title)}</b><small>${esc(item.desc)}</small></span>`;button.addEventListener('click',()=>navigate(key));moduleGrid.appendChild(button)});

  async function initUser(){let cached=null;try{cached=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')}catch(_){}const apply=user=>{const name=clean(user&&(user.name||user.loginId||user.email));if(name){document.getElementById('userName').textContent=`${name}님`;authenticated=true;return true}return false};if(cached)apply(cached);try{const user=await api('/api/auth/me');apply(user?.user||user)}catch(error){if(error.message!=='AUTH')document.getElementById('userName').textContent='로그인 필요'}}

  searchInput.addEventListener('input',filterRows);document.getElementById('refreshBtn').addEventListener('click',loadData);document.getElementById('traceForm').addEventListener('submit',event=>{event.preventDefault();loadTrace(document.getElementById('traceKeyword').value)});document.getElementById('backBtn').addEventListener('click',()=>location.assign(`/mobile.html?v=${VERSION}`));document.getElementById('homeBtn').addEventListener('click',()=>navigate('home'));document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.nav)));
  const openSheet=()=>{sheet.classList.add('open');sheet.setAttribute('aria-hidden','false')},closeSheet=()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')};document.getElementById('menuBtn').addEventListener('click',openSheet);sheet.addEventListener('click',event=>{if(event.target===sheet)closeSheet()});document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'})}catch(_){}try{sessionStorage.removeItem(SESSION_KEY)}catch(_){}location.replace('/index.html?logout=1&mobileLogin=1')});

  initUser().finally(setPage);
})();
</script>
