<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAMO Talk</title>
<style>
html,body,#namo-root{width:100%;height:100%;margin:0;overflow:hidden;background:#eef3f7;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef3f7;color:#334155;font-weight:800;z-index:999999}
#error{max-width:720px;margin:20px;padding:16px;background:#fff1f2;color:#be123c;border:1px solid #fecdd3;border-radius:12px;white-space:pre-wrap;display:none}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="namo-root"></div>
<div id="boot">8월 14일 NAMO Talk 불러오는 중…</div>
<div id="error"></div>
<script>
window.React=React; window.ReactDOM=ReactDOM;
var useState=React.useState,useEffect=React.useEffect,useMemo=React.useMemo,useRef=React.useRef,useCallback=React.useCallback;
function safeParse(v,f){try{return JSON.parse(v||"")||f}catch(e){return f}}
window.__QMES_CURRENT_USER__=safeParse(sessionStorage.getItem("qmes-current-user-v1"),null)||safeParse(localStorage.getItem("qmes-current-user-v1"),null)||{name:"박현아",dept:"품질부",role:"user",uid:"U-0009"};
window.loadUsers=function(){
  const keys=["qmes-users-v1","qmes-user-list-v1","users"];
  for(const k of keys){const v=safeParse(localStorage.getItem(k),null);if(Array.isArray(v)&&v.length)return v}
  return [
   {uid:"U-0001",name:"김종혁",dept:"대표",position:"대표이사",role:"admin"},
   {uid:"U-0002",name:"김세희",dept:"연구소",position:"이사"},
   {uid:"U-0003",name:"정영기",dept:"연구소",position:"이사"},
   {uid:"U-0004",name:"박지헌",dept:"연구소",position:"연구원"},
   {uid:"U-0005",name:"박도훈",dept:"생산부",position:"대리"},
   {uid:"U-0006",name:"문지훈",dept:"생산부",position:"주임"},
   {uid:"U-0007",name:"김현진",dept:"영업부",position:"과장"},
   {uid:"U-0008",name:"임흥배",dept:"품질부",position:"부장",role:"admin"},
   {uid:"U-0009",name:"박현아",dept:"품질부",position:"사원"}
  ];
};
localStorage.setItem("qmes-namo-talk-minimized-v1","0");
(async function(){
 try{
   const sticker=await fetch("/assets/namo-emoticons-gel-20260731.js",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("이모티콘 "+r.status);return r.text()});
   (0,eval)(sticker);
   const source=await fetch("/js/namo-talk.jsx",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("NAMO Talk "+r.status);return r.text()});
   const code=Babel.transform(source,{presets:["react"],sourceType:"script"}).code;
   eval(code+`
     ;window.__NAMO_STANDALONE_MOUNT__=function(){
       var root=ReactDOM.createRoot(document.getElementById("namo-root"));
       root.render(React.createElement(NamoTalkTab,{onClose:function(){},initialRoom:""}));
     };
     window.__NAMO_STANDALONE_MOUNT__();
   `);
   for(const p of ["/js/namo-talk-header-contrast-20260814.js","/js/namo-attendance-time-patch.js"]){
     try{const s=await fetch(p,{cache:"no-store"}).then(r=>r.ok?r.text():"");if(s)(0,eval)(s)}catch(e){}
   }
   document.getElementById("boot").remove();
 }catch(e){
   document.getElementById("boot").style.display="none";
   const box=document.getElementById("error");box.style.display="block";box.textContent="NAMO Talk 실행 오류\n\n"+(e.stack||e);
 }
})();
</script>
</body>
</html>
