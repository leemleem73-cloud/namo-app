<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b3554">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>NAMO 전사 근태 · 연차 현황 V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef4f8;color:#15344c;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif}button,input,select{font:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;background:#f3f7fa}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0d3553,#176284);color:#fff;padding:12px 14px 10px;box-shadow:0 2px 12px rgba(13,53,83,.18)}.toprow{display:flex;align-items:center;gap:10px}.back{height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.24);border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-weight:900}.title{font-size:19px;font-weight:950;letter-spacing:-.5px}.sub{margin:4px 0 0;font-size:10.5px;color:#d3e6f0}.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.dates input{height:35px;width:100%;min-width:0;border:0;border-radius:9px;padding:0 9px;background:#fff;color:#173c57;font-size:12px;font-weight:800}.body{padding:9px 9px 84px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(64px,1fr));gap:5px;overflow-x:auto;padding-bottom:2px}.kpi{min-width:64px;background:#fff;border:1px solid #d8e3eb;border-radius:10px;padding:7px 7px 6px}.kpi small{display:block;font-size:8.5px;font-weight:850;color:#748795;white-space:nowrap}.kpi b{display:block;margin-top:2px;font-size:17px;line-height:1;color:#173e59}.kpi.green b{color:#078b51}.kpi.blue b{color:#1673d1}.kpi.orange b{color:#e66a08}.kpi.purple b{color:#7647ca}.kpi.red b{color:#d92d20}.tabs{display:flex;gap:5px;margin:8px 0}.tab{height:31px;padding:0 13px;border:1px solid #c8d7e1;border-radius:999px;background:#fff;color:#466273;font-size:11px;font-weight:900}.tab.on{background:#124b6e;border-color:#124b6e;color:#fff}.filters{display:grid;grid-template-columns:minmax(0,1fr) 105px 100px;gap:5px;margin-bottom:7px}.filters input,.filters select{height:34px;min-width:0;border:1px solid #cbd9e2;border-radius:8px;background:#fff;padding:0 8px;color:#25465b;font-size:10.5px}.count{margin:5px 2px;font-size:10px;font-weight:900;color:#36566c}.tablebox{overflow:auto;background:#fff;border:1px solid #d5e1e9;border-radius:10px;-webkit-overflow-scrolling:touch}.grid{width:100%;min-width:790px;border-collapse:collapse;table-layout:fixed;font-size:9.5px}.grid th{position:sticky;top:0;z-index:2;height:31px;padding:4px 3px;background:#e9f0f5;color:#354f62;border-right:1px solid #d9e3e9;border-bottom:1px solid #cfdce4;font-weight:950;white-space:nowrap}.grid td{height:33px;padding:4px 3px;text-align:center;border-right:1px solid #edf1f4;border-bottom:1px solid #e8edf1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid tr:last-child td{border-bottom:0}.grid .no{width:31px}.grid .name{width:88px;text-align:left;font-weight:950;color:#123b57}.grid .dept{width:64px}.grid .status{width:69px}.grid .time{width:48px}.grid .month{width:48px}.grid .leave{width:43px}.grid .detail{width:49px}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:3px 5px;border-radius:999px;font-size:8.5px;font-weight:950;background:#f0f2f4;color:#66737c}.pill.WORKING{background:#e4f6ec;color:#087441}.pill.DONE{background:#e8f1ff;color:#245bc2}.pill.LEAVE{background:#fff1da;color:#986100}.pill.STATUTORY{background:#efe8ff;color:#6b3db7}.pill.ABSENT{background:#fff0ef;color:#c52d25}.detailbtn{height:24px;padding:0 7px;border:1px solid #bdd0dc;border-radius:7px;background:#f8fbfd;color:#244c66;font-size:9px;font-weight:900}.leave-table{min-width:650px}.empty{padding:34px 10px;text-align:center;color:#82939e;font-size:11px}.legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:7px;padding:8px 9px;border:1px solid #d8e3ea;border-radius:9px;background:#fff;font-size:9px;color:#587080}.legend b{color:#25485f}.note{margin-top:5px;font-size:9px;color:#6c8291}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(760px,100%);height:62px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:rgba(255,255,255,.97);border-top:1px solid #d6e1e8;box-shadow:0 -4px 18px rgba(24,55,76,.06)}.bottom button{border:0;background:transparent;color:#6f8593;font-size:9px;font-weight:850}.bottom button b{display:block;font-size:19px;line-height:1.1;color:#5f7c8e}.bottom .active,.bottom .active b{color:#0b72d4}.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,30,45,.42)}.modal.hidden{display:none}.sheet{width:min(760px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(9,31,46,.25)}.sheethead{display:flex;align-items:center;gap:8px}.sheethead h3{margin:0;font-size:17px}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:#eef3f6;color:#405e71;font-size:20px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.dcell{background:#f4f7f9;border-radius:9px;padding:9px}.dcell small{display:block;font-size:9px;color:#768995}.dcell b{display:block;margin-top:3px;font-size:13px;color:#183d57}.notice{margin-top:10px;padding:9px 10px;border-radius:9px;background:#f1f6fa;color:#536d7e;font-size:10px;line-height:1.5}@media(max-width:520px){.filters{grid-template-columns:1fr 96px}.filters select:last-child{grid-column:1/-1}.title{font-size:18px}.body{padding-left:7px;padding-right:7px}.kpis{grid-template-columns:repeat(6,62px)}.grid{min-width:760px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow"><button id="backBtn" class="back" type="button">‹ 홈</button><div><div class="title">전사 근태 · 연차 현황</div><div class="sub">관리자 전용 · 전체 인원 표시 · 법정휴가 포함 · 대표이사 제외</div></div></div>
    <div class="dates"><input id="workDate" type="date"><input id="workMonth" type="month"></div>
  </header>
  <main class="body">
    <div id="kpis" class="kpis"></div>
    <div class="tabs"><button class="tab on" data-tab="attendance">근태 현황</button><button class="tab" data-tab="leave">휴가 현황</button></div>
    <div class="filters"><input id="query" placeholder="이름 · 부서 검색"><select id="dept"><option value="">전체 부서</option></select><select id="status"><option value="">전체 상태</option><option value="DONE">퇴근완료</option><option value="WORKING">근무중</option><option value="LEAVE">휴가</option><option value="STATUTORY">법정휴가</option><option value="ABSENT">미출근</option></select></div>
    <div id="content"></div>
  </main>
  <nav class="bottom"><button id="homeNav" class="active"><b>⌂</b>홈</button><button id="recordsNav"><b>▤</b>기록</button><button id="leaveNav"><b>□</b>연차</button><button id="approvalNav"><b>✓</b>승인</button><button id="profileNav"><b>○</b>내 정보</button></nav>
</div>
<div id="detailModal" class="modal hidden"><div class="sheet"><div class="sheethead"><h3 id="detailTitle">직원 상세</h3><button id="detailClose" class="close">×</button></div><div id="detailBody"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=v=>String(v||'').slice(0,10);const titleKey=v=>String(v||'').replace(/\s+/g,'').toLowerCase();const isCeo=x=>['대표','대표이사','ceo','chiefexecutiveofficer'].includes(titleKey(x?.title||x?.employee_title));
const t=v=>{if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?'-':d.toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false})};
const stateName=s=>({WORKING:'근무중',DONE:'퇴근완료',ABSENT:'미출근',LEAVE:'휴가',STATUTORY:'법정휴가'}[s]||s||'-');const leaveName=v=>({annual:'연차',am_half:'오전반차',pm_half:'오후반차',statutory:'법정휴가'}[v]||v||'-');const leaveStatus=v=>({PENDING_1:'승인대기',PENDING_2:'승인대기',APPROVED:'승인',REJECTED:'반려',CANCELLED:'취소'}[v]||v||'-');
let data={employees:[],leaves:[],summary:{},departments:[]},tab='attendance';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
async function api(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const p=await r.json().catch(()=>({success:false,message:'서버 응답 오류'}));if(r.status===401){location.replace('/attendance.html?v=20260907-admin-v2-login');throw new Error('로그인이 필요합니다.')}if(!r.ok||p?.success===false)throw new Error(p?.message||'현황을 불러오지 못했습니다.');return p?.data??p}
function normalize(raw){const employees=(raw?.employees||[]).filter(x=>!isCeo(x));const leaves=(raw?.leaves||[]).filter(x=>!isCeo(x));const summary={total:employees.length,checkedIn:employees.filter(x=>['WORKING','DONE'].includes(x.attendanceStatus)).length,working:employees.filter(x=>x.attendanceStatus==='WORKING').length,onLeave:employees.filter(x=>x.attendanceStatus==='LEAVE').length,statutory:employees.filter(x=>x.attendanceStatus==='STATUTORY').length,absent:employees.filter(x=>x.attendanceStatus==='ABSENT').length};const departments=[...new Set(employees.map(x=>String(x.department||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));return{...raw,employees,leaves,summary,departments}}
function statutoryDays(name){return (data.leaves||[]).filter(x=>x.status==='APPROVED'&&x.leave_type==='statutory'&&String(x.employee_name||'')===String(name||'')).reduce((s,x)=>s+Number(x.days||0),0)}
function renderKpis(){const s=data.summary||{};$('kpis').innerHTML=`<div class="kpi"><small>전체 인원</small><b>${s.total||0}명</b></div><div class="kpi green"><small>출근</small><b>${s.checkedIn||0}명</b></div><div class="kpi blue"><small>근무 중</small><b>${s.working||0}명</b></div><div class="kpi orange"><small>휴가</small><b>${s.onLeave||0}명</b></div><div class="kpi purple"><small>법정휴가</small><b>${s.statutory||0}명</b></div><div class="kpi red"><small>미출근</small><b>${s.absent||0}명</b></div>`}
function renderFilters(){const current=$('dept').value;$('dept').innerHTML='<option value="">전체 부서</option>'+data.departments.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function filteredEmployees(){const q=$('query').value.trim().toLowerCase(),dept=$('dept').value,status=$('status').value;return data.employees.filter(x=>(!dept||x.department===dept)&&(!status||x.attendanceStatus===status)&&(!q||`${x.name} ${x.department} ${x.title}`.toLowerCase().includes(q)))}
function renderAttendance(){const rows=filteredEmployees();$('content').innerHTML=`<div class="count">직원 ${rows.length}명 · 전체 행 표시 · 표는 좌우로 이동할 수 있습니다.</div><div class="tablebox"><table class="grid"><thead><tr><th class="no">No</th><th class="name">이름</th><th class="dept">부서</th><th class="status">상태</th><th class="time">출근</th><th class="time">퇴근</th><th class="month">월근무</th><th class="leave">연차</th><th class="leave">사용</th><th class="leave">잔여</th><th class="leave">법정</th><th class="detail">상세</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="name" title="${esc(x.name)} ${esc(x.title||'')}">${esc(x.name)} ${esc(x.title||'')}</td><td>${esc(x.department||'-')}</td><td><span class="pill ${esc(x.attendanceStatus)}">${esc(stateName(x.attendanceStatus))}</span></td><td>${esc(t(x.clockIn))}</td><td>${esc(t(x.clockOut))}</td><td>${Number(x.monthDays||0)}일</td><td>${Number(x.leaveGranted||0)}</td><td>${Number(x.leaveUsed||0)}</td><td>${Number(x.leaveRemaining||0)}</td><td>${statutoryDays(x.name)}</td><td><button class="detailbtn" data-detail="${esc(x.id)}">상세</button></td></tr>`).join('')}</tbody></table></div><div class="legend"><span><b>출근/퇴근</b> 모바일 기록</span><span><b>연차 사용</b> 승인된 연차·반차</span><span><b>법정</b> 승인된 법정휴가</span></div><div class="note">※ 법정휴가는 연차 잔여일수에서 차감하지 않습니다. ※ 대표이사는 근태 대상에서 제외됩니다.</div>`;$$('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail))}
function renderLeaves(){const q=$('query').value.trim().toLowerCase(),dept=$('dept').value;const rows=(data.leaves||[]).filter(x=>(!dept||x.employee_department===dept)&&(!q||`${x.employee_name} ${x.employee_department} ${x.employee_title}`.toLowerCase().includes(q)));$('content').innerHTML=`<div class="count">휴가 내역 ${rows.length}건</div><div class="tablebox"><table class="grid leave-table"><thead><tr><th>No</th><th>성명</th><th>부서</th><th>유형</th><th>시작일</th><th>종료일</th><th>일수</th><th>상태</th><th>사유</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="name">${esc(x.employee_name||'-')} ${esc(x.employee_title||'')}</td><td>${esc(x.employee_department||'-')}</td><td><span class="pill ${x.leave_type==='statutory'?'STATUTORY':'LEAVE'}">${esc(leaveName(x.leave_type))}</span></td><td>${esc(dateText(x.start_date))}</td><td>${esc(dateText(x.end_date))}</td><td>${Number(x.days||0)}</td><td>${esc(leaveStatus(x.status))}</td><td title="${esc(x.reason||'')}">${esc(x.reason||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function render(){renderKpis();renderFilters();$$('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('status').style.visibility=tab==='attendance'?'visible':'hidden';tab==='attendance'?renderAttendance():renderLeaves()}
async function load(){try{const raw=await api(`/api/attendance/admin/overview?date=${encodeURIComponent($('workDate').value)}&month=${encodeURIComponent($('workMonth').value)}`);data=normalize(raw);render()}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function openDetail(id){const x=data.employees.find(r=>String(r.id)===String(id));if(!x)return;$('detailTitle').textContent=`${x.name} ${x.title||''}`.trim();$('detailBody').innerHTML=`<div class="detailgrid"><div class="dcell"><small>부서</small><b>${esc(x.department||'-')}</b></div><div class="dcell"><small>상태</small><b>${esc(stateName(x.attendanceStatus))}</b></div><div class="dcell"><small>근무일</small><b>${esc($('workDate').value)}</b></div><div class="dcell"><small>출근</small><b>${esc(t(x.clockIn))}</b></div><div class="dcell"><small>퇴근</small><b>${esc(t(x.clockOut))}</b></div><div class="dcell"><small>월 근무</small><b>${Number(x.monthDays||0)}일</b></div><div class="dcell"><small>연차 부여</small><b>${Number(x.leaveGranted||0)}일</b></div><div class="dcell"><small>연차 사용</small><b>${Number(x.leaveUsed||0)}일</b></div><div class="dcell"><small>연차 잔여</small><b>${Number(x.leaveRemaining||0)}일</b></div><div class="dcell"><small>법정휴가</small><b>${statutoryDays(x.name)}일</b></div></div><div class="notice">법정휴가는 연차와 별도 관리하며 연차 잔여일수에서 차감하지 않습니다.</div>`;$('detailModal').classList.remove('hidden')}
function goAttendance(hash){location.assign('/attendance.html?v=20260907-admin-v2&from=adminv2'+(hash?'#'+hash:''))}
$('backBtn').onclick=()=>history.length>1?history.back():goAttendance('home');$('homeNav').onclick=()=>goAttendance('home');$('recordsNav').onclick=()=>goAttendance('records');$('leaveNav').onclick=()=>goAttendance('leave');$('approvalNav').onclick=()=>goAttendance('approval');$('profileNav').onclick=()=>goAttendance('profile');$('detailClose').onclick=()=>$('detailModal').classList.add('hidden');$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').classList.add('hidden')};
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});['query','dept','status'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('workDate').onchange=load;$('workMonth').onchange=load;
const d=today();$('workDate').value=d;$('workMonth').value=d.slice(0,7);$('content').innerHTML='<div class="empty">전사 근태 현황을 불러오는 중입니다.</div>';load();
})();
</script>
</body>
</html>
