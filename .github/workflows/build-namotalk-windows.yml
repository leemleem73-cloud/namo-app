name: Build NAMO Talk Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/namo-attendance-leave-fieldwork
    paths:
      - "desktop/**"
      - ".github/workflows/build-namotalk-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Build Windows installer
        shell: pwsh
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "NamoTalk_Setup_*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NamoTalk installer was not generated."
          }
          Write-Host "Installer created: $($installer.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamoTalk-Windows-Installer
          path: desktop/dist/NamoTalk_Setup_*.exe
          if-no-files-found: error
          retention-days: 30
