name: Remove retired NAMO Talk branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-namo-talk-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete NAMO Talk feature branches
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | while IFS= read -r branch; do
            case "$branch" in
              *namo-talk*|*private-talk*)
                if [ "$branch" != "main" ] && [ "$branch" != "HEAD" ]; then
                  echo "Deleting $branch"
                  git push origin --delete "$branch" || true
                fi
                ;;
            esac
          done
          rm -f .github/workflows/remove-namo-talk-branches-once.yml
      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish NAMO Talk branch cleanup"
          git push origin HEAD:main
