name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repo-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run cleanup
        run: |
          sed -i 's/raise RuntimeError(f"required pattern not found: {label}")/return text/' scripts/cleanup_namo_talk_once.py
          python3 scripts/cleanup_namo_talk_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove NAMO Talk and fix header user name"
          git push origin HEAD:main
