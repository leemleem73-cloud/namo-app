name: Final header name cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/header-name-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate surname avatar and refresh cache
        run: |
          python3 -c "from pathlib import Path; p=Path('public/js/router.jsx'); s=p.read_text(); old='<div className=\"w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold\" style={{background:\"#dfeaf2\",color:\"#315f7f\"}}>{user.name?.[0]||\"사\"}</div>'; assert old in s; p.write_text(s.replace(old,'',1))"
          python3 -c "from pathlib import Path; p=Path('public/index.html'); s=p.read_text(); p.write_text(s.replace('/js/router.jsx?v=20260910-talk-removed-name-fix','/js/router.jsx?v=20260910-name-avatar-fix'))"
          rm -f .github/workflows/header-name-fix-once.yml
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show header account as 임흥배 (품질부)"
          git push origin HEAD:main
