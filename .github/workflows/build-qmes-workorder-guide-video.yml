name: Build QMES Work Order Guide Video

on:
  push:
    paths:
      - '.github/workflows/build-qmes-workorder-guide-video.yml'
      - 'scripts/build-qmes-workorder-guide-video-20261120.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current QMES
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum ffmpeg
          python3 -m pip install --break-system-packages Pillow
      - name: Render the 7-step work order training video
        run: python3 scripts/build-qmes-workorder-guide-video-20261120.py
      - name: Verify finished MP4
        run: |
          test -s public/videos/qmes-workorder-guide-20261120.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 public/videos/qmes-workorder-guide-20261120.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 public/videos/qmes-workorder-guide-20261120.mp4
      - name: Publish only the generated video asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/qmes-workorder-guide-20261120.mp4
          if git diff --cached --quiet; then
            echo "Video already current"
          else
            git commit -m "Add generated QMES workorder guide MP4"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
